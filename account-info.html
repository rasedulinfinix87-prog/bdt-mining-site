<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Information - Goldmine Digital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #030d0a;
            --text-primary: #ffffff;
            --text-secondary: #8da499;
            --gold-primary: #f5cf66;
            --gold-gradient: linear-gradient(135deg, #e5ba41 0%, #fbe89d 50%, #b88a1a 100%);
            --input-bg: rgba(255, 255, 255, 0.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); display: flex; justify-content: center; min-height: 100vh; padding-bottom: 75px; }
        .mobile-container { width: 100%; max-width: 410px; background: #061913; padding: 20px 16px; }
        .header-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .back-btn { color: var(--gold-primary); font-size: 1.2rem; text-decoration: none; }
        .page-title { font-size: 1.1rem; font-weight: 700; color: var(--gold-primary); }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.72rem; color: var(--text-secondary); margin-bottom: 6px; }
        .input-box { position: relative; }
        .input-box input { width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; outline: none; }
    </style>
</head>
<body>

    <div class="mobile-container">
        <div class="header-bar">
            <a href="home-index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <div class="page-title">ACCOUNT INFORMATION</div>
            <div></div>
        </div>

        <div class="form-group">
            <label>Full Name</label>
            <div class="input-box"><input type="text" id="acc-fullname" value="Loading..." readonly></div>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <div class="input-box"><input type="email" id="acc-email" value="Loading..." readonly></div>
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <div class="input-box"><input type="text" id="acc-phone" value="Loading..." readonly></div>
        </div>

        <div class="form-group">
            <label>Secret PIN</label>
            <div class="input-box"><input type="text" id="acc-pin" value="Loading..." readonly></div>
        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script>
        async function fetchUserData() {
            const client = window._supabase || window.supabase;
            
            if (!client) {
                alert("Supabase client not initialized! check supabase-config.js");
                return;
            }

            // ১. আইডি আইডি চ্যাকিং
            let userId = localStorage.getItem('user_id');
            
            // যদি LocalStorage এ না পায়, তবে সেশন চেক করবে
            if (!userId) {
                const { data: { user } } = await client.auth.getUser();
                if (user) userId = user.id;
            }

            // মোবাইল স্ক্রিনে আইডি দেখাবে
            alert("Current User ID: " + userId);

            if (!userId) {
                alert("No User ID found! Please Login again.");
                window.location.href = 'login-signup.html';
                return;
            }

            try {
                // ২. ডাটাবেজ থেকে ডাটা খোঁজা (Double quotes দিয়ে 'user' রেসপন্স নিশ্চিত করা)
                const { data, error } = await client
                    .from('user')
                    .select('*')
                    .eq('id', userId)
                    .maybeSingle();

                if (error) {
                    alert("Database Error: " + error.message);
                    console.error(error);
                } else if (data) {
                    document.getElementById('acc-fullname').value = data.full_name || 'N/A';
                    document.getElementById('acc-email').value = data.email || 'N/A';
                    document.getElementById('acc-phone').value = data.phone || 'N/A';
                    document.getElementById('acc-pin').value = data.secret_pin || 'N/A';
                } else {
                    alert("ID: (" + userId + ") দিয়ে 'user' টেবিলে কোনো রো (Row) খুঁজে পাওয়া যায়নি!");
                }
            } catch (err) {
                alert("Execution Error: " + err.message);
            }
        }

        window.addEventListener('DOMContentLoaded', fetchUserData);
    </script>
</body>
</html>
