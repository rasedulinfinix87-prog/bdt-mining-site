<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Account Information - Goldmine Digital</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Supabase Config Script -->
    <script src="supabase-config.js"></script>

    <style>
        :root {
            --bg-color: #061913;
            --card-bg: rgba(12, 38, 29, 0.85);
            --card-border: rgba(46, 213, 115, 0.25);
            --text-primary: #ffffff;
            --text-secondary: #8da499;
            --gold-primary: #f5cf66;
            --gold-gradient: linear-gradient(135deg, #e5ba41 0%, #fbe89d 50%, #b88a1a 100%);
            --accent-green: #2ed573;
            --input-bg: rgba(255, 255, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #030d0a;
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .mobile-container {
            width: 100%;
            max-width: 410px;
            height: 100vh;
            height: 100dvh;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Header Layout */
        header {
            padding: 20px 20px 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--gold-primary);
            letter-spacing: 0.5px;
        }

        .back-btn {
            color: var(--text-secondary);
            font-size: 1.2rem;
            text-decoration: none;
            cursor: pointer;
        }

        /* Content Section */
        .content {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            flex: 1;
            overflow-y: auto;
        }

        /* Input Group Box */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
        }

        .form-input[readonly] {
            background: rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.6);
            border-color: rgba(255, 255, 255, 0.05);
            cursor: not-allowed;
        }

        .lock-icon {
            position: absolute;
            right: 14px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.85rem;
        }

        .toggle-icon {
            position: absolute;
            right: 14px;
            color: var(--gold-primary);
            font-size: 0.95rem;
            cursor: pointer;
        }

        /* Submit Button */
        .btn-gold {
            width: 100%;
            padding: 14px;
            background: var(--gold-gradient);
            border: none;
            border-radius: 25px;
            color: #030d0a;
            font-weight: 700;
            font-size: 0.92rem;
            letter-spacing: 0.6px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(245, 207, 102, 0.35);
            margin-top: 10px;
        }

        /* Toast Message */
        #toast-msg {
            display: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            text-align: center;
        }
        .toast-success { background: rgba(46, 213, 115, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .toast-error { background: rgba(255, 71, 87, 0.2); color: #ff4757; border: 1px solid #ff4757; }

        #bottom-nav-container {
            width: 100%;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- Header -->
        <header>
            <a href="javascript:history.back()" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div class="header-title">ACCOUNT INFORMATION</div>
            <div style="width: 20px;"></div>
        </header>

        <!-- Main Form Content -->
        <div class="content">
            
            <div id="toast-msg"></div>

            <!-- Full Name (Locked) -->
            <div class="form-group">
                <label class="form-label">FULL NAME</label>
                <div class="input-wrapper">
                    <input type="text" id="full-name" class="form-input" readonly value="Loading...">
                    <i class="fa-solid fa-lock lock-icon"></i>
                </div>
            </div>

            <!-- Email (Locked) -->
            <div class="form-group">
                <label class="form-label">EMAIL ADDRESS</label>
                <div class="input-wrapper">
                    <input type="email" id="email" class="form-input" readonly value="Loading...">
                    <i class="fa-solid fa-lock lock-icon"></i>
                </div>
            </div>

            <!-- Phone (Locked) -->
            <div class="form-group">
                <label class="form-label">PHONE NUMBER</label>
                <div class="input-wrapper">
                    <input type="text" id="phone" class="form-input" readonly value="Loading...">
                    <i class="fa-solid fa-lock lock-icon"></i>
                </div>
            </div>

            <!-- Secret PIN (Locked + View Symbol) -->
            <div class="form-group">
                <label class="form-label">SECRET PIN</label>
                <div class="input-wrapper">
                    <input type="password" id="secret-pin" class="form-input" readonly value="****">
                    <i class="fa-solid fa-eye toggle-icon" id="toggle-pin-btn" onclick="togglePinVisibility()"></i>
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.08); margin: 6px 0;">

            <!-- Password Change Field -->
            <div class="form-group">
                <label class="form-label" style="color: var(--gold-primary);">CHANGE PASSWORD</label>
                <div class="input-wrapper">
                    <input type="password" id="new-password" class="form-input" placeholder="Enter new password">
                    <i class="fa-solid fa-eye toggle-icon" id="toggle-pass-btn" onclick="togglePassVisibility()"></i>
                </div>
            </div>

            <!-- Submit Button -->
            <button class="btn-gold" onclick="handlePasswordUpdate()">UPDATE PASSWORD</button>

        </div>

        <!-- Dynamic Bottom Nav Connection -->
        <div id="bottom-nav-container"></div>
    </div>

    <script>
        let currentUserId = null;

        // 1. Bottom Nav load
        fetch('bottom.html?v=' + new Date().getTime())
            .then(res => res.text())
            .then(data => document.getElementById('bottom-nav-container').innerHTML = data)
            .catch(err => console.log('Bottom nav load error:', err));

        // 2. Multi-Check User Identification Logic
        document.addEventListener('DOMContentLoaded', async () => {
            // Check 1: localStorage key 'user_id' or 'userId' or 'user'
            currentUserId = localStorage.getItem('user_id') || localStorage.getItem('userId');

            if (!currentUserId && typeof supabase !== 'undefined') {
                // Check 2: Try fetching active Supabase Auth session
                const { data: { session } } = await supabase.auth.getSession();
                if (session && session.user) {
                    currentUserId = session.user.id;
                }
            }

            if (!currentUserId) {
                showToast("User session not found! Please log in.", "error");
                document.getElementById('full-name').value = 'Not Logged In';
                document.getElementById('email').value = 'Not Logged In';
                document.getElementById('phone').value = 'Not Logged In';
                return;
            }

            loadUserData(currentUserId);
        });

        // Load data from 'user' table
        async function loadUserData(userId) {
            try {
                const { data, error } = await supabase
                    .from('user')
                    .select('full_name, email, phone, secret_pin')
                    .eq('id', userId)
                    .single();

                if (error) throw error;

                if (data) {
                    document.getElementById('full-name').value = data.full_name || 'N/A';
                    document.getElementById('email').value = data.email || 'N/A';
                    document.getElementById('phone').value = data.phone || 'N/A';
                    document.getElementById('secret-pin').value = data.secret_pin || '----';
                }
            } catch (err) {
                console.error("Fetch Error:", err);
                showToast("Failed to fetch user details", "error");
            }
        }

        // Toggle Secret PIN
        function togglePinVisibility() {
            const pinInput = document.getElementById('secret-pin');
            const pinIcon = document.getElementById('toggle-pin-btn');

            if (pinInput.type === 'password') {
                pinInput.type = 'text';
                pinIcon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                pinInput.type = 'password';
                pinIcon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // Toggle Password
        function togglePassVisibility() {
            const passInput = document.getElementById('new-password');
            const passIcon = document.getElementById('toggle-pass-btn');

            if (passInput.type === 'password') {
                passInput.type = 'text';
                passIcon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                passInput.type = 'password';
                passIcon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // Update Password
        async function handlePasswordUpdate() {
            if (!currentUserId) {
                showToast("Please log in first!", "error");
                return;
            }

            const newPassword = document.getElementById('new-password').value.trim();

            if (!newPassword || newPassword.length < 6) {
                showToast("Password must be at least 6 characters!", "error");
                return;
            }

            try {
                const { error } = await supabase
                    .from('user')
                    .update({ 
                        password: newPassword,
                        updated_at: new Date().toISOString()
                    })
                    .eq('id', currentUserId);

                if (error) throw error;

                showToast("Password updated successfully!", "success");
                document.getElementById('new-password').value = '';
            } catch (err) {
                showToast("Failed to update password", "error");
            }
        }

        function showToast(msg, type) {
            const toast = document.getElementById('toast-msg');
            toast.innerText = msg;
            toast.className = type === 'success' ? 'toast-success' : 'toast-error';
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }
    </script>
</body>
</html>
