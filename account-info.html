<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Info - BDTMINER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #080c14; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 12px; }
        .container { width: 100%; max-width: 420px; background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 20px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8); }
        
        .page-title { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 700; color: #f59e0b; text-align: center; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .status-box { background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 12px; padding: 12px; text-align: center; margin-bottom: 15px; font-size: 13px; color: #f59e0b; font-weight: 600; }

        .form-group { margin-bottom: 15px; position: relative; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
        input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: #fff; font-size: 14px; outline: none; }
        input:focus { border-color: #f59e0b; }
        input:disabled { background: #1e293b; color: #94a3b8; cursor: not-allowed; border-color: #1e293b; }

        .eye-icon { position: absolute; right: 12px; top: 35px; cursor: pointer; color: #94a3b8; font-size: 16px; user-select: none; }

        .section-title { font-family: 'Orbitron', sans-serif; font-size: 13px; color: #f59e0b; margin: 20px 0 10px 0; border-bottom: 1px solid rgba(245, 158, 11, 0.2); padding-bottom: 5px; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }

        .btn-action { 
            width: 100%; 
            padding: 12px; 
            background: linear-gradient(135deg, #f59e0b, #d97706); 
            border: none; 
            border-radius: 10px; 
            color: #000; 
            font-weight: 800; 
            font-size: 14px; 
            cursor: pointer; 
            margin-top: 10px; 
            font-family: 'Orbitron', sans-serif; 
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .btn-secondary {
            background: #1e293b;
            color: #f59e0b;
            border: 1px solid #334155;
        }

        .back-home { display: block; text-align: center; color: #94a3b8; text-decoration: none; font-size: 13px; margin-top: 15px; }

        /* Custom Popup & Modal Styles */
        .custom-popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .custom-popup-overlay.active { opacity: 1; visibility: visible; }
        .custom-popup-box {
            background: linear-gradient(145deg, #0f172a, #1e293b);
            border: 1px solid rgba(245, 158, 11, 0.4);
            border-radius: 20px;
            width: 90%;
            max-width: 360px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(245, 158, 11, 0.15);
            transform: scale(0.6) translateY(30px);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .custom-popup-overlay.active .custom-popup-box { transform: scale(1) translateY(0); }
        .popup-title { font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: 700; color: #f59e0b; margin-bottom: 15px; text-transform: uppercase; }
        .popup-message { font-size: 13.5px; color: #cbd5e1; margin-bottom: 15px; line-height: 1.5; }
        .popup-btn { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; border: none; padding: 10px 20px; font-weight: 800; font-size: 13px; border-radius: 8px; cursor: pointer; width: 100%; font-family: 'Orbitron', sans-serif; margin-top: 10px; }
        .popup-btn-close { background: #334155; color: #fff; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="page-title">Account Info</div>

        <!-- Verification Status Display -->
        <div class="status-box" id="verificationStatusBox">
            Account Status: Loading...
        </div>

        <div class="section-title">NID Verified Information</div>
        
        <div class="form-group">
            <label>Full Name (From NID)</label>
            <input type="text" id="fullName" disabled placeholder="Not Verified Yet">
        </div>

        <div class="form-group">
            <label>Birth Date (From NID)</label>
            <input type="text" id="birthDate" disabled placeholder="Not Verified Yet">
        </div>

        <div class="form-group">
            <label>Registered Email ID (Locked)</label>
            <input type="text" id="regEmail" disabled placeholder="Loading email...">
        </div>

        <div class="section-title">
            <span>Security Settings</span>
        </div>

        <div class="form-group">
            <label>Secret Pin (Locked)</label>
            <input type="password" id="secretPin" disabled value="****">
            <span class="eye-icon" onclick="toggleSecretPin()">👁️</span>
        </div>

        <button type="button" class="btn-action btn-secondary" onclick="openPasswordModal()">Change Password</button>

        <a href="dashboard.html" class="back-home">← Back to Dashboard</a>
    </div>

    <!-- Password Change Modal -->
    <div class="custom-popup-overlay" id="passwordModal">
        <div class="custom-popup-box" style="text-align: left;">
            <div class="popup-title" style="text-align: center;">Change Password</div>
            
            <div class="form-group">
                <label>Old Password</label>
                <input type="password" id="oldPassword" placeholder="Enter current password">
            </div>

            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="modalNewPassword" placeholder="Enter new password">
            </div>

            <div class="form-group" style="margin-bottom: 5px;">
                <label>Confirm New Password</label>
                <input type="password" id="modalConfirmPassword" placeholder="Confirm new password">
            </div>

            <button type="button" class="popup-btn" id="changePassBtn" onclick="submitPasswordChange()">Update Password</button>
            <button type="button" class="popup-btn popup-btn-close" onclick="closePasswordModal()">Cancel</button>
        </div>
    </div>

    <!-- General Alert Popup Modal -->
    <div class="custom-popup-overlay" id="customPopup">
        <div class="custom-popup-box">
            <div class="popup-title" id="popupTitle">Success</div>
            <div class="popup-message" id="popupMessage">Action completed successfully.</div>
            <button type="button" class="popup-btn" onclick="closePopup()">OK</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pckocwvuxeseumynslwv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBja29jd3Z1eGVzZXVteW5zbHd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NDc3OTAsImV4cCI6MjEwNjIyMzc5MH0.0VBGW9lgZDritQa7XDoPncu5bl9M6J5W9eup0KSLXIc';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let rawSecretPin = '';

        async function fetchAccountData() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) {
                window.location.href = 'signup.html';
                return;
            }
            currentUser = user;
            document.getElementById('regEmail').value = user.email;

            // Fetch profile info including verification_status and secret_pin
            const { data: profile, error } = await supabaseClient
                .from('profiles')
                .select('full_name, birth_date, secret_pin, verification_status')
                .eq('id', user.id)
                .single();

            if (profile) {
                if (profile.full_name) document.getElementById('fullName').value = profile.full_name;
                if (profile.birth_date) document.getElementById('birthDate').value = profile.birth_date;
                if (profile.secret_pin) {
                    rawSecretPin = profile.secret_pin;
                    document.getElementById('secretPin').value = '•'.repeat(rawSecretPin.length);
                }

                const vStatus = profile.verification_status ? profile.verification_status.toUpperCase() : 'UNVERIFIED';
                document.getElementById('verificationStatusBox').innerText = `Account Verification Status: ${vStatus}`;
            } else {
                document.getElementById('verificationStatusBox').innerText = `Account Verification Status: UNVERIFIED`;
            }
        }

        // Toggle Secret Pin Visibility
        let isPinVisible = false;
        function toggleSecretPin() {
            const pinInput = document.getElementById('secretPin');
            if (!rawSecretPin) return;
            isPinVisible = !isPinVisible;
            if (isPinVisible) {
                pinInput.value = rawSecretPin;
            } else {
                pinInput.value = '•'.repeat(rawSecretPin.length);
            }
        }

        // Password Modal Controls
        function openPasswordModal() {
            document.getElementById('oldPassword').value = '';
            document.getElementById('modalNewPassword').value = '';
            document.getElementById('modalConfirmPassword').value = '';
            document.getElementById('passwordModal').classList.add('active');
        }

        function closePasswordModal() {
            document.getElementById('passwordModal').classList.remove('active');
        }

        async function submitPasswordChange() {
            const oldPass = document.getElementById('oldPassword').value;
            const newPass = document.getElementById('modalNewPassword').value;
            const confirmPass = document.getElementById('modalConfirmPassword').value;

            if (!oldPass || !newPass || !confirmPass) {
                showCustomPopup('Error', 'Please fill in all password fields.');
                return;
            }

            if (newPass !== confirmPass) {
                showCustomPopup('Error', 'New password and confirm password do not match.');
                return;
            }

            if (newPass.length < 6) {
                showCustomPopup('Error', 'New password must be at least 6 characters long.');
                return;
            }

            const changeBtn = document.getElementById('changePassBtn');
            changeBtn.disabled = true;
            changeBtn.innerText = 'Updating...';

            // Verify old password by signing in
            const { error: signInError } = await supabaseClient.auth.signInWithPassword({
                email: currentUser.email,
                password: oldPass
            });

            if (signInError) {
                showCustomPopup('Error', 'Incorrect old password provided.');
                changeBtn.disabled = false;
                changeBtn.innerText = 'Update Password';
                return;
            }

            // Update to new password
            const { error: updateError } = await supabaseClient.auth.updateUser({
                password: newPass
            });

            changeBtn.disabled = false;
            changeBtn.innerText = 'Update Password';

            if (updateError) {
                showCustomPopup('Error', updateError.message);
            } else {
                closePasswordModal();
                showCustomPopup('Success', 'Password has been updated successfully!');
            }
        }

        function showCustomPopup(title, message) {
            document.getElementById('popupTitle').innerText = title;
            document.getElementById('popupMessage').innerText = message;
            document.getElementById('customPopup').classList.add('active');
        }

        function closePopup() {
            document.getElementById('customPopup').classList.remove('active');
        }

        fetchAccountData();
    </script>
</body>
</html>
