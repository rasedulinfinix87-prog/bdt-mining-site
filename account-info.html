<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Info - BDTMINER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #080c14; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 12px; }
        .container { width: 100%; max-width: 420px; background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 20px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8); }
        
        .page-title { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 700; color: #f59e0b; text-align: center; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
        input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: #fff; font-size: 14px; outline: none; }
        input:focus { border-color: #f59e0b; }
        input:disabled { background: #1e293b; color: #64748b; cursor: not-allowed; border-color: #1e293b; }

        .section-title { font-family: 'Orbitron', sans-serif; font-size: 13px; color: #f59e0b; margin: 20px 0 10px 0; border-bottom: 1px solid rgba(245, 158, 11, 0.2); padding-bottom: 5px; text-transform: uppercase; }

        .btn-submit { 
            width: 100%; 
            padding: 12px; 
            background: linear-gradient(135deg, #f59e0b, #d97706); 
            border: none; 
            border-radius: 10px; 
            color: #000; 
            font-weight: 800; 
            font-size: 14px; 
            cursor: pointer; 
            margin-top: 10px; 
            font-family: 'Orbitron', sans-serif; 
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .back-home { display: block; text-align: center; color: #94a3b8; text-decoration: none; font-size: 13px; margin-top: 15px; }

        /* Custom Popup Modal Styles */
        .custom-popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .custom-popup-overlay.active { opacity: 1; visibility: visible; }
        .custom-popup-box {
            background: linear-gradient(145deg, #0f172a, #1e293b);
            border: 1px solid rgba(245, 158, 11, 0.4);
            border-radius: 20px;
            width: 90%;
            max-width: 360px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(245, 158, 11, 0.15);
            transform: scale(0.6) translateY(30px);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .custom-popup-overlay.active .custom-popup-box { transform: scale(1) translateY(0); }
        .popup-icon { font-size: 45px; margin-bottom: 15px; animation: bounceIcon 1s infinite alternate; }
        @keyframes bounceIcon { 0% { transform: translateY(0); } 100% { transform: translateY(-8px); } }
        .popup-title { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 700; color: #f59e0b; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .popup-message { font-size: 13.5px; color: #cbd5e1; margin-bottom: 12px; line-height: 1.6; }
        .popup-note { font-size: 12px; color: #f59e0b; background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); padding: 10px; border-radius: 10px; margin-bottom: 20px; font-weight: 500; }
        .popup-btn { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; border: none; padding: 12px 20px; font-weight: 800; font-size: 14px; border-radius: 10px; cursor: pointer; width: 100%; font-family: 'Orbitron', sans-serif; letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="page-title">Account Info</div>

        <form id="accountForm" onsubmit="updateAccountInfo(event)">
            <div class="section-title">NID Verified Information</div>
            
            <div class="form-group">
                <label>Full Name (From NID)</label>
                <input type="text" id="fullName" disabled placeholder="Not Verified Yet">
            </div>

            <div class="form-group">
                <label>Birth Date (From NID)</label>
                <input type="text" id="birthDate" disabled placeholder="Not Verified Yet">
            </div>

            <div class="section-title">Security Settings</div>

            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPassword" placeholder="Enter new password (optional)">
            </div>

            <div class="form-group">
                <label>Secret Pin</label>
                <input type="text" id="secretPin" placeholder="Enter 4 or 6 digit secret pin">
            </div>

            <button type="submit" class="btn-submit" id="updateBtn">Update Information</button>
        </form>

        <a href="dashboard.html" class="back-home">← Back to Dashboard</a>
    </div>

    <!-- Custom Popup Modal -->
    <div class="custom-popup-overlay" id="customPopup">
        <div class="custom-popup-box">
            <div class="popup-icon" id="popupIcon">🎉</div>
            <div class="popup-title" id="popupTitle">Success</div>
            <div class="popup-message" id="popupMessage">Information updated successfully.</div>
            <div class="popup-note" id="popupNote">Your changes have been saved.</div>
            <button type="button" class="popup-btn" onclick="closePopup()">OK</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pckocwvuxeseumynslwv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBja29jd3Z1eGVzZXVteW5zbHd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NDc3OTAsImV4cCI6MjEwNjIyMzc5MH0.0VBGW9lgZDritQa7XDoPncu5bl9M6J5W9eup0KSLXIc';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;

        async function fetchAccountData() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) {
                window.location.href = 'signup.html';
                return;
            }
            currentUser = user;

            // Fetch profile info
            const { data: profile, error } = await supabaseClient
                .from('profiles')
                .select('full_name, birth_date, secret_pin')
                .eq('id', user.id)
                .single();

            if (profile) {
                if (profile.full_name) {
                    document.getElementById('fullName').value = profile.full_name;
                }
                if (profile.birth_date) {
                    document.getElementById('birthDate').value = profile.birth_date;
                }
                if (profile.secret_pin) {
                    document.getElementById('secretPin').value = profile.secret_pin;
                }
            }
        }

        async function updateAccountInfo(e) {
            e.preventDefault();
            if (!currentUser) return;

            const updateBtn = document.getElementById('updateBtn');
            updateBtn.disabled = true;
            updateBtn.innerText = 'Updating...';

            const newPassword = document.getElementById('newPassword').value.trim();
            const secretPin = document.getElementById('secretPin').value.trim();

            let updateFields = {};
            if (secretPin) {
                updateFields.secret_pin = secretPin;
            }

            // Update secret_pin in profiles table
            if (Object.keys(updateFields).length > 0) {
                const { error: profileError } = await supabaseClient
                    .from('profiles')
                    .update(updateFields)
                    .eq('id', currentUser.id);

                if (profileError) {
                    showCustomPopup('error', 'Update Failed', profileError.message, 'Please try again', false);
                    updateBtn.disabled = false;
                    updateBtn.innerText = 'Update Information';
                    return;
                }
            }

            // Update password in Supabase Auth if provided
            if (newPassword) {
                const { error: authError } = await supabaseClient.auth.updateUser({
                    password: newPassword
                });

                if (authError) {
                    showCustomPopup('error', 'Password Update Failed', authError.message, 'Please try again', false);
                    updateBtn.disabled = false;
                    updateBtn.innerText = 'Update Information';
                    return;
                }
            }

            showCustomPopup('success', 'Updated Successfully', 'Your account information has been updated successfully.', 'Changes Saved', false);
            document.getElementById('newPassword').value = '';
            updateBtn.disabled = false;
            updateBtn.innerText = 'Update Information';
        }

        function showCustomPopup(type, title, message, note, redirect = false) {
            const iconElem = document.getElementById('popupIcon');
            if (type === 'success') iconElem.innerText = '🎉';
            else iconElem.innerText = '⚠️️';

            document.getElementById('popupTitle').innerText = title;
            document.getElementById('popupMessage').innerText = message;
            document.getElementById('popupNote').innerText = note;
            document.getElementById('customPopup').classList.add('active');
        }

        function closePopup() {
            document.getElementById('customPopup').classList.remove('active');
        }

        fetchAccountData();
    </script>
</body>
</html>
