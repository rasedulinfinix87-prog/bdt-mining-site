<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Information - Goldmine Digital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #030d0a;
            --card-bg: #061913;
            --text-primary: #ffffff;
            --text-secondary: #8da499;
            --gold-primary: #f5cf66;
            --gold-gradient: linear-gradient(135deg, #e5ba41 0%, #fbe89d 50%, #b88a1a 100%);
            --input-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); display: flex; justify-content: center; min-height: 100vh; padding-bottom: 80px; }
        .mobile-container { width: 100%; max-width: 410px; background: var(--card-bg); padding: 20px 16px; min-height: 100vh; position: relative; }
        
        /* Header */
        .header-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
        .back-btn { color: var(--gold-primary); font-size: 1.2rem; text-decoration: none; }
        .page-title { font-size: 1.1rem; font-weight: 700; color: var(--gold-primary); letter-spacing: 0.5px; }
        
        /* Form Styling */
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500; }
        .input-box { position: relative; display: flex; align-items: center; }
        .input-box input { 
            width: 100%; 
            padding: 12px 40px 12px 14px; 
            background: var(--input-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 10px; 
            color: #fff; 
            outline: none; 
            font-size: 0.9rem;
        }
        .input-box input:read-only { color: #d0d0d0; cursor: not-allowed; }
        .lock-icon { position: absolute; right: 14px; color: var(--text-secondary); font-size: 0.85rem; }
        
        /* Password Section Special Styling */
        .password-box { display: flex; gap: 8px; }
        .password-box .input-box { flex: 1; }
        .eye-icon { position: absolute; right: 14px; color: var(--gold-primary); cursor: pointer; font-size: 0.9rem; }
        .change-btn { 
            background: var(--gold-gradient); 
            border: none; 
            color: #000; 
            font-weight: 600; 
            font-size: 0.8rem; 
            padding: 0 16px; 
            border-radius: 10px; 
            cursor: pointer; 
            transition: transform 0.2s, opacity 0.2s; 
        }
        .change-btn:active { transform: scale(0.96); }

        /* Modal & Popup Animation */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px); 
            display: flex; justify-content: center; align-items: center; 
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 1000; 
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-card { 
            background: #0a251c; border: 1px solid var(--gold-primary); 
            border-radius: 16px; width: 90%; max-width: 360px; padding: 24px 20px; 
            text-align: center; transform: scale(0.8); transition: transform 0.3s ease; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .modal-overlay.active .modal-card { transform: scale(1); }
        .modal-card h3 { color: var(--gold-primary); margin-bottom: 14px; font-size: 1.1rem; }
        .modal-card input { 
            width: 100%; padding: 12px; margin-bottom: 12px; 
            background: var(--input-bg); border: 1px solid var(--border-color); 
            border-radius: 8px; color: #fff; outline: none; font-size: 0.85rem; 
        }
        .modal-actions { display: flex; gap: 10px; margin-top: 10px; }
        .modal-btn { 
            flex: 1; padding: 10px; border-radius: 8px; border: none; 
            font-weight: 600; cursor: pointer; font-size: 0.85rem; 
        }
        .btn-cancel { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-save { background: var(--gold-gradient); color: #000; }

        /* Animated Success Icon */
        .success-icon-box { 
            width: 60px; height: 60px; background: rgba(245, 207, 102, 0.1); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            margin: 0 auto 16px; border: 2px solid var(--gold-primary);
        }
        .success-icon-box i { font-size: 1.8rem; color: var(--gold-primary); animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- Header -->
        <div class="header-bar">
            <a href="home-index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <div class="page-title">ACCOUNT INFORMATION</div>
            <div style="width: 20px;"></div>
        </div>

        <!-- Full Name -->
        <div class="form-group">
            <label>FULL NAME</label>
            <div class="input-box">
                <input type="text" id="acc-fullname" value="Loading..." readonly>
            </div>
        </div>

        <!-- Email Address -->
        <div class="form-group">
            <label>EMAIL ADDRESS</label>
            <div class="input-box">
                <input type="email" id="acc-email" value="Loading..." readonly>
                <i class="fa-solid fa-lock lock-icon"></i>
            </div>
        </div>

        <!-- Mobile Number -->
        <div class="form-group">
            <label>MOBILE NUMBER</label>
            <div class="input-box">
                <input type="text" id="acc-phone" value="Loading..." readonly>
                <i class="fa-solid fa-lock lock-icon"></i>
            </div>
        </div>

        <!-- Secret PIN -->
        <div class="form-group">
            <label>SECRET PIN</label>
            <div class="input-box">
                <input type="password" id="acc-pin" value="Loading..." readonly>
                <i class="fa-solid fa-lock lock-icon"></i>
            </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
            <label>PASSWORD</label>
            <div class="password-box">
                <div class="input-box">
                    <input type="password" id="acc-password" value="******" readonly>
                    <i class="fa-solid fa-eye eye-icon" id="toggle-pwd" onclick="togglePasswordVisibility()"></i>
                </div>
                <button class="change-btn" onclick="openPasswordModal()">Change</button>
            </div>
        </div>

        <!-- Dynamic Container for Bottom Navigation -->
        <div id="bottom-nav-container"></div>
    </div>

    <!-- Password Change Modal Popup -->
    <div class="modal-overlay" id="pwd-modal">
        <div class="modal-card" id="modal-content">
            <h3>Change Password</h3>
            <input type="password" id="new-password" placeholder="Enter New Password">
            <input type="password" id="confirm-password" placeholder="Confirm New Password">
            <div class="modal-actions">
                <button class="modal-btn btn-cancel" onclick="closePasswordModal()">Cancel</button>
                <button class="modal-btn btn-save" onclick="updatePassword()">Update</button>
            </div>
        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script>
        let currentRawPassword = "";
        let currentUserId = null;

        // Masking Helpers
        function maskEmail(email) {
            if (!email || !email.includes('@')) return email;
            const parts = email.split('@');
            const name = parts[0];
            if (name.length <= 2) return name[0] + '***@' + parts[1];
            return name.substring(0, 2) + '***' + name.substring(name.length - 1) + '@' + parts[1];
        }

        function maskPhone(phone) {
            if (!phone) return phone;
            const str = phone.toString();
            if (str.length <= 5) return str;
            return str.substring(0, 3) + '***' + str.substring(str.length - 3);
        }

        // Toggle Password Visibility
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('acc-password');
            const icon = document.getElementById('toggle-pwd');
            
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                pwdInput.value = currentRawPassword;
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                pwdInput.type = 'password';
                pwdInput.value = currentRawPassword;
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Fetch User Data from Supabase
        async function fetchUserData() {
            const client = window._supabase || window.supabase;
            if (!client) {
                alert("Supabase client not initialized! Check supabase-config.js");
                return;
            }

            let userId = localStorage.getItem('user_id');
            if (!userId) {
                const { data: { user } } = await client.auth.getUser();
                if (user) userId = user.id;
            }

            if (!userId) {
                alert("No User ID found! Please login again.");
                window.location.href = 'login-signup.html';
                return;
            }

            currentUserId = userId;

            try {
                const { data, error } = await client
                    .from('user')
                    .select('*')
                    .eq('id', userId)
                    .maybeSingle();

                if (error) {
                    console.error("Database Error:", error.message);
                } else if (data) {
                    document.getElementById('acc-fullname').value = data.full_name || 'N/A';
                    document.getElementById('acc-email').value = maskEmail(data.email || '');
                    document.getElementById('acc-phone').value = maskPhone(data.phone || '');
                    document.getElementById('acc-pin').value = data.secret_pin ? '****' : 'N/A';
                    
                    // Store & Set Password
                    currentRawPassword = data.password || '******';
                    document.getElementById('acc-password').value = currentRawPassword;
                }
            } catch (err) {
                console.error("Execution Error:", err);
            }
        }

        // Modal Controls
        function openPasswordModal() {
            document.getElementById('new-password').value = '';
            document.getElementById('confirm-password').value = '';
            document.getElementById('pwd-modal').classList.add('active');
        }

        function closePasswordModal() {
            document.getElementById('pwd-modal').classList.remove('active');
            // Reset modal layout after closing animation
            setTimeout(() => {
                document.getElementById('modal-content').innerHTML = `
                    <h3>Change Password</h3>
                    <input type="password" id="new-password" placeholder="Enter New Password">
                    <input type="password" id="confirm-password" placeholder="Confirm New Password">
                    <div class="modal-actions">
                        <button class="modal-btn btn-cancel" onclick="closePasswordModal()">Cancel</button>
                        <button class="modal-btn btn-save" onclick="updatePassword()">Update</button>
                    </div>
                `;
            }, 300);
        }

        // Update Password Logic & Popup Animation
        async function updatePassword() {
            const newPwd = document.getElementById('new-password').value.trim();
            const confirmPwd = document.getElementById('confirm-password').value.trim();

            if (!newPwd || !confirmPwd) {
                alert("Please fill in both fields!");
                return;
            }
            if (newPwd !== confirmPwd) {
                alert("Passwords do not match!");
                return;
            }
            if (newPwd.length < 6) {
                alert("Password must be at least 6 characters long!");
                return;
            }

            const client = window._supabase || window.supabase;
            try {
                const { error } = await client
                    .from('user')
                    .update({ password: newPwd, updated_at: new Date().toISOString() })
                    .eq('id', currentUserId);

                if (error) {
                    alert("Error updating password: " + error.message);
                } else {
                    // Update Local State
                    currentRawPassword = newPwd;
                    document.getElementById('acc-password').value = newPwd;

                    // Show Success Animation Window
                    const modalContent = document.getElementById('modal-content');
                    modalContent.innerHTML = `
                        <div class="success-icon-box">
                            <i class="fa-solid fa-check"></i>
                        </div>
                        <h3 style="margin-bottom: 8px;">Success!</h3>
                        <p style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 16px;">Password updated successfully.</p>
                        <button class="modal-btn btn-save" style="width: 100%;" onclick="closePasswordModal()">Done</button>
                    `;
                }
            } catch (err) {
                alert("Failed to update: " + err.message);
            }
        }

        // Load bottom.html dynamically
        function loadBottomNav() {
            fetch('bottom.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('bottom-nav-container').innerHTML = data;
                })
                .catch(err => console.log('bottom.html not found or failed to load:', err));
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchUserData();
            loadBottomNav();
        });
    </script>
</body>
</html>
