<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Investment Portfolio</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: rgba(18, 24, 38, 0.75);
            --gold-primary: #ffd700;
            --gold-secondary: #ffaa00;
            --gold-glow: rgba(255, 215, 0, 0.15);
            --crypto-primary: #00f2fe;
            --crypto-secondary: #4facfe;
            --crypto-glow: rgba(0, 242, 254, 0.15);
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 215, 0, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(0, 242, 254, 0.05) 0%, transparent 20%);
            min-height: 100vh;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 90px; /* Space for fixed bottom nav */
        }

        /* Top Bar */
        .top-bar {
            width: 100%;
            background: rgba(12, 16, 25, 0.95);
            border-bottom: 1px solid var(--border-color);
            padding: 18px 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .top-bar h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #a1a1a1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            max-width: 600px;
            width: 100%;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header p {
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        /* Investment Grid */
        .investment-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Reduced Card Size (approx 30% compact) */
        .portfolio-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 18px 20px;
            backdrop-filter: blur(16px);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .portfolio-card:hover {
            transform: translateY(-4px);
        }

        /* Gold Card Specific Glow */
        .card-gold {
            border-color: rgba(255, 215, 0, 0.2);
        }
        .card-gold:hover {
            box-shadow: 0 15px 30px var(--gold-glow);
            border-color: rgba(255, 215, 0, 0.4);
        }

        /* Crypto Card Specific Glow */
        .card-crypto {
            border-color: rgba(0, 242, 254, 0.2);
        }
        .card-crypto:hover {
            box-shadow: 0 15px 30px var(--crypto-glow);
            border-color: rgba(0, 242, 254, 0.4);
        }

        /* Card Header */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .icon-box {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.1rem;
        }

        .card-gold .icon-box {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 170, 0, 0.1));
            color: var(--gold-primary);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .card-crypto .icon-box {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.2), rgba(79, 172, 254, 0.1));
            color: var(--crypto-primary);
            border: 1px solid rgba(0, 242, 254, 0.3);
        }

        .badge {
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .card-gold .badge {
            background: rgba(255, 215, 0, 0.1);
            color: var(--gold-primary);
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .card-crypto .badge {
            background: rgba(0, 242, 254, 0.1);
            color: var(--crypto-primary);
            border: 1px solid rgba(0, 242, 254, 0.2);
        }

        /* Card Info */
        .card-title-area h2 {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 3px;
        }

        .card-title-area p {
            color: var(--text-sub);
            font-size: 0.78rem;
        }

        .amount-area {
            margin: 12px 0 10px 0;
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .amount {
            font-size: 1.45rem;
            font-weight: 700;
        }

        .growth {
            font-size: 0.8rem;
            font-weight: 600;
            color: #10b981;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        /* Graph Container */
        .graph-container {
            width: 100%;
            height: 75px;
            margin: 10px 0 15px 0;
            position: relative;
        }

        /* Action Button */
        .card-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            font-size: 0.88rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .card-gold .card-btn {
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-secondary));
            color: #000;
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.2);
        }

        .card-gold .card-btn:hover {
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.35);
        }

        .card-crypto .card-btn {
            background: linear-gradient(135deg, var(--crypto-primary), var(--crypto-secondary));
            color: #000;
            box-shadow: 0 4px 12px rgba(0, 242, 254, 0.2);
        }

        .card-crypto .card-btn:hover {
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.35);
        }

        /* Fixed Bottom Navigation Container */
        #bottom-nav-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <h1>Investment Portfolio</h1>
    </div>

    <div class="container">
        <div class="header">
            <p>Select an investment card to view live charts and details</p>
        </div>

        <div class="investment-grid">

            <!-- CARD 1: GOLD INVESTMENT -->
            <div class="portfolio-card card-gold">
                <div class="card-header">
                    <div class="icon-box">
                        <i class="fa-solid fa-coins"></i>
                    </div>
                    <span class="badge">Global</span>
                </div>

                <div class="card-title-area">
                    <h2>Gold Investment</h2>
                    <p>Digital Gold & Bullion Assets</p>
                </div>

                <div class="amount-area">
                    <span class="amount">$<span id="gold-price">12,450.00</span></span>
                    <span class="growth"><i class="fa-solid fa-arrow-trend-up"></i> +14.2%</span>
                </div>

                <!-- Gold Investment 100 Data Points Chart -->
                <div class="graph-container">
                    <canvas id="goldChart"></canvas>
                </div>

                <!-- Link Button to Gold Investment Page -->
                <a href="gol-investing.html" class="card-btn">
                    <span>Graph Investment</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </a>
            </div>

            <!-- CARD 2: CRYPTO INVESTMENT -->
            <div class="portfolio-card card-crypto">
                <div class="card-header">
                    <div class="icon-box">
                        <i class="fa-solid fa-chart-line"></i>
                    </div>
                    <span class="badge">Global</span>
                </div>

                <div class="card-title-area">
                    <h2>Crypto Investment</h2>
                    <p>BTC, ETH & High-Cap Assets</p>
                </div>

                <div class="amount-area">
                    <span class="amount">$<span id="crypto-price">28,910.50</span></span>
                    <span class="growth"><i class="fa-solid fa-arrow-trend-up"></i> +28.6%</span>
                </div>

                <!-- Crypto Investment 100 Data Points Chart -->
                <div class="graph-container">
                    <canvas id="cryptoChart"></canvas>
                </div>

                <!-- Link Button to Crypto Investment Page -->
                <a href="crypto-investing.html" class="card-btn">
                    <span>Graph Investment</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </a>
            </div>

        </div>
    </div>

    <!-- Fixed Bottom Nav Container -->
    <div id="bottom-nav-container"></div>

    <!-- JavaScript for Dynamic 100 Data Points, Live Pricing & Bottom Nav -->
    <script>
        // Load bottom.html dynamically
        fetch('bottom.html?v=' + new Date().getTime())
            .then(response => {
                if(response.ok) return response.text();
            })
            .then(data => {
                if(data) document.getElementById('bottom-nav-container').innerHTML = data;
            })
            .catch(error => console.log('Bottom nav load error'));

        // Helper function to generate exactly 100 market data points
        function generateMarketPoints(startVal, volatility) {
            let points = [startVal];
            let current = startVal;
            for (let i = 1; i < 100; i++) {
                let change = (Math.random() - 0.49) * volatility;
                current += change;
                points.push(parseFloat(current.toFixed(2)));
            }
            return points;
        }

        const goldPoints = generateMarketPoints(12450, 4.0);
        const cryptoPoints = generateMarketPoints(28910, 25.0);
        const labels100 = Array.from({length: 100}, (_, i) => `Pt ${i + 1}`);

        // Gold Chart Initialization (100 Points)
        const goldCtx = document.getElementById('goldChart').getContext('2d');
        const goldGradient = goldCtx.createLinearGradient(0, 0, 0, 75);
        goldGradient.addColorStop(0, 'rgba(255, 215, 0, 0.35)');
        goldGradient.addColorStop(1, 'rgba(255, 215, 0, 0.0)');

        const goldChart = new Chart(goldCtx, {
            type: 'line',
            data: {
                labels: labels100,
                datasets: [{
                    data: goldPoints,
                    borderColor: '#ffd700',
                    borderWidth: 1.5,
                    fill: true,
                    backgroundColor: goldGradient,
                    tension: 0.3,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { x: { display: false }, y: { display: false } }
            }
        });

        // Crypto Chart Initialization (100 Points)
        const cryptoCtx = document.getElementById('cryptoChart').getContext('2d');
        const cryptoGradient = cryptoCtx.createLinearGradient(0, 0, 0, 75);
        cryptoGradient.addColorStop(0, 'rgba(0, 242, 254, 0.35)');
        cryptoGradient.addColorStop(1, 'rgba(0, 242, 254, 0.0)');

        const cryptoChart = new Chart(cryptoCtx, {
            type: 'line',
            data: {
                labels: labels100,
                datasets: [{
                    data: cryptoPoints,
                    borderColor: '#00f2fe',
                    borderWidth: 1.5,
                    fill: true,
                    backgroundColor: cryptoGradient,
                    tension: 0.3,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { x: { display: false }, y: { display: false } }
            }
        });

        // Real-time market price & chart updates
        setInterval(() => {
            let currentGold = parseFloat(document.getElementById('gold-price').innerText.replace(',', ''));
            let newGold = (currentGold + (Math.random() - 0.49) * 2.5).toFixed(2);
            document.getElementById('gold-price').innerText = Number(newGold).toLocaleString('en-US', {minimumFractionDigits: 2});
            
            goldChart.data.datasets[0].data.shift();
            goldChart.data.datasets[0].data.push(parseFloat(newGold));
            goldChart.update('none');

            let cryptoPrice = parseFloat(document.getElementById('crypto-price').innerText.replace(',', ''));
            let newCrypto = (cryptoPrice + (Math.random() - 0.49) * 15.0).toFixed(2);
            document.getElementById('crypto-price').innerText = Number(newCrypto).toLocaleString('en-US', {minimumFractionDigits: 2});

            cryptoChart.data.datasets[0].data.shift();
            cryptoChart.data.datasets[0].data.push(parseFloat(newCrypto));
            cryptoChart.update('none');
        }, 3000);
    </script>
</body>
</html>
