<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investment Portfolio</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: rgba(18, 24, 38, 0.75);
            --gold-primary: #ffd700;
            --gold-secondary: #ffaa00;
            --gold-glow: rgba(255, 215, 0, 0.15);
            --crypto-primary: #00f2fe;
            --crypto-secondary: #4facfe;
            --crypto-glow: rgba(0, 242, 254, 0.15);
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 215, 0, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(0, 242, 254, 0.05) 0%, transparent 20%);
            min-height: 100vh;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px 15px 10px 15px;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            margin: auto 0;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #a1a1a1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        /* Investment Grid */
        .investment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 15px;
        }

        /* Premium Card Base (Reduced size by ~30%) */
        .portfolio-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 18px;
            backdrop-filter: blur(16px);
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .portfolio-card:hover {
            transform: translateY(-5px);
        }

        /* Gold Card Specific Glow */
        .card-gold {
            border-color: rgba(255, 215, 0, 0.2);
        }
        .card-gold:hover {
            box-shadow: 0 15px 30px var(--gold-glow), 0 0 15px rgba(255, 215, 0, 0.2);
            border-color: rgba(255, 215, 0, 0.5);
        }

        /* Crypto Card Specific Glow */
        .card-crypto {
            border-color: rgba(0, 242, 254, 0.2);
        }
        .card-crypto:hover {
            box-shadow: 0 15px 30px var(--crypto-glow), 0 0 15px rgba(0, 242, 254, 0.2);
            border-color: rgba(0, 242, 254, 0.5);
        }

        /* Card Header */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .icon-box {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.1rem;
        }

        .card-gold .icon-box {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 170, 0, 0.1));
            color: var(--gold-primary);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .card-crypto .icon-box {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.2), rgba(79, 172, 254, 0.1));
            color: var(--crypto-primary);
            border: 1px solid rgba(0, 242, 254, 0.3);
        }

        .badge {
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .card-gold .badge {
            background: rgba(255, 215, 0, 0.1);
            color: var(--gold-primary);
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .card-crypto .badge {
            background: rgba(0, 242, 254, 0.1);
            color: var(--crypto-primary);
            border: 1px solid rgba(0, 242, 254, 0.2);
        }

        /* Card Info */
        .card-title-area h2 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 3px;
        }

        .card-title-area p {
            color: var(--text-sub);
            font-size: 0.75rem;
        }

        .amount-area {
            margin: 12px 0 10px 0;
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .amount {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .growth {
            font-size: 0.75rem;
            font-weight: 600;
            color: #10b981;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        /* Graph Canvas / Container */
        .graph-container {
            width: 100%;
            height: 80px;
            margin: 10px 0 15px 0;
            position: relative;
        }

        .graph-container svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* Action Link / Button */
        .card-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .card-gold .card-btn {
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-secondary));
            color: #000;
            box-shadow: 0 3px 12px rgba(255, 215, 0, 0.25);
        }

        .card-gold .card-btn:hover {
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
            transform: scale(1.02);
        }

        .card-crypto .card-btn {
            background: linear-gradient(135deg, var(--crypto-primary), var(--crypto-secondary));
            color: #000;
            box-shadow: 0 3px 12px rgba(0, 242, 254, 0.25);
        }

        .card-crypto .card-btn:hover {
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
            transform: scale(1.02);
        }

        /* Bottom Nav Container */
        #bottom-nav-container {
            width: 100%;
            max-width: 1100px;
            margin-top: 10px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            body {
                padding: 12px 10px 5px 10px;
            }
            .header h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Investment Portfolio</h1>
        </div>

        <div class="investment-grid">

            <!-- CARD 1: GOLD INVESTMENT -->
            <div class="portfolio-card card-gold">
                <div class="card-header">
                    <div class="icon-box">
                        <i class="fa-solid fa-coins"></i>
                    </div>
                    <span class="badge">Low Risk • Safe</span>
                </div>

                <div class="card-title-area">
                    <h2>Gold Investment</h2>
                    <p>Digital Gold & Bullion Assets</p>
                </div>

                <div class="amount-area">
                    <span class="amount">$12,450.00</span>
                    <span class="growth"><i class="fa-solid fa-arrow-trend-up"></i> +14.2%</span>
                </div>

                <!-- Gold Investment Graph -->
                <div class="graph-container">
                    <svg viewBox="0 0 300 100" preserveAspectRatio="none">
                        <defs>
                            <linearGradient id="goldGradient" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="#ffd700" stop-opacity="0.4"/>
                                <stop offset="100%" stop-color="#ffd700" stop-opacity="0.0"/>
                            </linearGradient>
                        </defs>
                        <!-- Area Fill -->
                        <path d="M0,80 Q50,40 100,60 T200,30 T300,10 L300,100 L0,100 Z" fill="url(#goldGradient)" />
                        <!-- Line -->
                        <path d="M0,80 Q50,40 100,60 T200,30 T300,10" fill="none" stroke="#ffd700" stroke-width="3" stroke-linecap="round" />
                    </svg>
                </div>

                <!-- Link Button to Gold Investment Page -->
                <a href="gol-investing.html" class="card-btn">
                    <span>Graph Investment</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </a>
            </div>

            <!-- CARD 2: CRYPTO INVESTMENT -->
            <div class="portfolio-card card-crypto">
                <div class="card-header">
                    <div class="icon-box">
                        <i class="fa-solid fa-chart-line"></i>
                    </div>
                    <span class="badge">High Yield • Web3</span>
                </div>

                <div class="card-title-area">
                    <h2>Crypto Investment</h2>
                    <p>BTC, ETH & High-Cap Assets</p>
                </div>

                <div class="amount-area">
                    <span class="amount">$28,910.50</span>
                    <span class="growth"><i class="fa-solid fa-arrow-trend-up"></i> +28.6%</span>
                </div>

                <!-- Crypto Investment Graph -->
                <div class="graph-container">
                    <svg viewBox="0 0 300 100" preserveAspectRatio="none">
                        <defs>
                            <linearGradient id="cryptoGradient" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.4"/>
                                <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.0"/>
                            </linearGradient>
                        </defs>
                        <!-- Area Fill -->
                        <path d="M0,90 Q40,30 90,70 T210,20 T300,5 L300,100 L0,100 Z" fill="url(#cryptoGradient)" />
                        <!-- Line -->
                        <path d="M0,90 Q40,30 90,70 T210,20 T300,5" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" />
                    </svg>
                </div>

                <!-- Link Button to Crypto Investment Page -->
                <a href="crypto-investing.html" class="card-btn">
                    <span>Graph Investment</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </a>
            </div>

        </div>
    </div>

    <!-- Bottom Nav Container Connected via JavaScript -->
    <div id="bottom-nav-container"></div>

    <!-- JavaScript to Fetch bottom.html -->
    <script>
        fetch('bottom.html?v=' + new Date().getTime())
            .then(response => {
                if(response.ok) return response.text();
            })
            .then(data => {
                if(data) document.getElementById('bottom-nav-container').innerHTML = data;
            })
            .catch(error => console.log('Bottom navigation not loaded'));
    </script>
</body>
</html>
