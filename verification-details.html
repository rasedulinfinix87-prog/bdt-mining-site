<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NID Verification - BDTMINER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #080c14; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 12px; }
        .container { width: 100%; max-width: 420px; background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 20px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8); }
        
        .page-title { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 700; color: #f59e0b; text-align: center; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
        input, textarea { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: #fff; font-size: 14px; outline: none; }
        input:focus, textarea:focus { border-color: #f59e0b; }
        input:disabled, textarea:disabled { opacity: 0.7; background: #1e293b; cursor: not-allowed; }
        textarea { resize: none; height: 80px; }

        .notice-box {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 10px;
            padding: 12px;
            font-size: 12.5px;
            color: #f59e0b;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .verified-badge-box {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10b981;
        }

        .btn-submit { 
            width: 100%; 
            padding: 12px; 
            background: linear-gradient(135deg, #f59e0b, #d97706); 
            border: none; 
            border-radius: 10px; 
            color: #000; 
            font-weight: 800; 
            font-size: 14px; 
            cursor: pointer; 
            margin-top: 10px; 
            font-family: 'Orbitron', sans-serif; 
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

        .back-home { display: block; text-align: center; color: #94a3b8; text-decoration: none; font-size: 13px; margin-top: 15px; }

        /* Custom Popup Modal Styles */
        .custom-popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .custom-popup-overlay.active { opacity: 1; visibility: visible; }
        .custom-popup-box {
            background: linear-gradient(145deg, #0f172a, #1e293b);
            border: 1px solid rgba(245, 158, 11, 0.4);
            border-radius: 20px;
            width: 90%;
            max-width: 360px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(245, 158, 11, 0.15);
            transform: scale(0.6) translateY(30px);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .custom-popup-overlay.active .custom-popup-box { transform: scale(1) translateY(0); }
        .popup-icon { font-size: 45px; margin-bottom: 15px; animation: bounceIcon 1s infinite alternate; }
        @keyframes bounceIcon { 0% { transform: translateY(0); } 100% { transform: translateY(-8px); } }
        .popup-title { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 700; color: #f59e0b; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .popup-message { font-size: 13.5px; color: #cbd5e1; margin-bottom: 12px; line-height: 1.6; }
        .popup-note { font-size: 12px; color: #f59e0b; background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); padding: 10px; border-radius: 10px; margin-bottom: 20px; font-weight: 500; }
        .popup-btn { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; border: none; padding: 12px 20px; font-weight: 800; font-size: 14px; border-radius: 10px; cursor: pointer; width: 100%; font-family: 'Orbitron', sans-serif; letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="page-title">NID Verification</div>
        
        <div class="notice-box" id="statusNotice">
            Please enter your exact NID details as shown on your National Identity Card (Bangla or English accepted).
        </div>

        <form id="nidForm" onsubmit="submitNidVerification(event)">
            <div class="form-group">
                <label>Full Name (As on NID)</label>
                <input type="text" id="fullName" placeholder="e.g. Md. Rahim Uddin" required>
            </div>

            <div class="form-group">
                <label>Father's Name</label>
                <input type="text" id="fatherName" placeholder="e.g. Md. Abdul Karim" required>
            </div>

            <div class="form-group">
                <label>Mother's Name</label>
                <input type="text" id="motherName" placeholder="e.g. Amena Begum" required>
            </div>

            <div class="form-group">
                <label>Birth Date</label>
                <input type="text" id="birthDate" placeholder="e.g. 15 Jan 1995 or 1995-01-15" required>
            </div>

            <div class="form-group">
                <label>NID Number</label>
                <input type="text" id="nidNumber" placeholder="e.g. 1995123456789" required>
            </div>

            <div class="form-group">
                <label>Full Address</label>
                <textarea id="fullAddress" placeholder="Village/Road, Post Office, Upazila, District" required></textarea>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Submit for Verification</button>
        </form>

        <a href="dashboard.html" class="back-home">← Back to Dashboard</a>
    </div>

    <!-- Custom Popup Modal -->
    <div class="custom-popup-overlay" id="customPopup">
        <div class="custom-popup-box">
            <div class="popup-icon" id="popupIcon">🎉</div>
            <div class="popup-title" id="popupTitle">Success</div>
            <div class="popup-message" id="popupMessage">Your request has been submitted.</div>
            <div class="popup-note" id="popupNote">Please wait 5 minutes to 1 hour for confirmation.</div>
            <button type="button" class="popup-btn" onclick="closePopup()">OK</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pckocwvuxeseumynslwv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBja29jd3Z1eGVzZXVteW5zbHd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NDc3OTAsImV4cCI6MjEwNjIyMzc5MH0.0VBGW9lgZDritQa7XDoPncu5bl9M6J5W9eup0KSLXIc';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let isRedirectOnClose = false;

        // NID Number Masking Function (মাঝখানের নাম্বারগুলো *** করার জন্য)
        function maskNidNumber(nid) {
            if (!nid || nid.length < 6) return nid;
            const start = nid.slice(0, 3);
            const end = nid.slice(-3);
            const middle = '*'.repeat(nid.length - 6);
            return start + middle + end;
        }

        async function checkUserAndStatus() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) {
                window.location.href = 'signup.html';
                return;
            }
            currentUser = user;

            // Fetch profile status
            const { data: profile, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('id', user.id)
                .single();

            if (profile) {
                // ইনপুট ফিল্ডগুলোতে ডাটা বসানো
                if (profile.full_name) document.getElementById('fullName').value = profile.full_name || '';
                if (profile.father_name) document.getElementById('fatherName').value = profile.father_name || '';
                if (profile.mother_name) document.getElementById('motherName').value = profile.mother_name || '';
                if (profile.birth_date) document.getElementById('birthDate').value = profile.birth_date || '';
                
                // NID নাম্বার লোড করার সময় যদি অলরেডি ডাটা থাকে, তবে মাস্ক করে (*** দিয়ে) দেখাবে
                if (profile.nid_number) {
                    document.getElementById('nidNumber').value = maskNidNumber(profile.nid_number);
                }
                
                if (profile.full_address) document.getElementById('fullAddress').value = profile.full_address || '';

                // Check if already approved
                if (profile.verification_status === 'approved') {
                    setFormDisabled(true, 'Account ভেরফিফাই এবং verified base শো করছে');
                    document.getElementById('statusNotice').classList.add('verified-badge-box');
                    return;
                }

                // Check if pending and 5-7 minutes passed -> Auto approve
                if (profile.verification_status === 'pending' && profile.verification_submitted_at) {
                    const submittedTime = new Date(profile.verification_submitted_at).getTime();
                    const now = new Date().getTime();
                    const diffMinutes = (now - submittedTime) / (1000 * 60);

                    if (diffMinutes >= 5) {
                        // Auto Approve
                        await supabaseClient
                            .from('profiles')
                            .update({ verification_status: 'approved' })
                            .eq('id', user.id);

                        setFormDisabled(true, 'Account ভেরফিফাই এবং verified base শো করছে');
                        document.getElementById('statusNotice').classList.add('verified-badge-box');
                        return;
                    } else {
                        // Still pending, lock fields and show notice
                        setFormDisabled(true, 'Verification is under review. Your NID details are locked.');
                        return;
                    }
                }
            }
        }

        function setFormDisabled(disabled, noticeText) {
            document.getElementById('fullName').disabled = disabled;
            document.getElementById('fatherName').disabled = disabled;
            document.getElementById('motherName').disabled = disabled;
            document.getElementById('birthDate').disabled = disabled;
            document.getElementById('nidNumber').disabled = disabled;
            document.getElementById('fullAddress').disabled = disabled;
            document.getElementById('submitBtn').disabled = disabled;
            if (noticeText) {
                document.getElementById('statusNoticeinnerText' in document.getElementById('statusNotice') ? 'innerText' : 'textContent') = noticeText;
                document.getElementById('statusNotice').innerText = noticeText;
            }
        }

        async function submitNidVerification(e) {
            e.preventDefault();
            if (!currentUser) return;

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Submitting...';

            const fullName = document.getElementById('fullName').value.trim();
            const fatherName = document.getElementById('fatherName').value.trim();
            const motherName = document.getElementById('motherName').value.trim();
            const birthDate = document.getElementById('birthDate').value.trim();
            let nidNumber = document.getElementById('nidNumber').value.trim();
            const fullAddress = document.getElementById('fullAddress').value.trim();
            const currentTime = new Date().toISOString();

            const { error } = await supabaseClient
                .from('profiles')
                .update({
                    full_name: fullName,
                    father_name: fatherName,
                    mother_name: motherName,
                    birth_date: birthDate,
                    nid_number: nidNumber,
                    full_address: fullAddress,
                    verification_status: 'pending',
                    verification_submitted_at: currentTime
                })
                .eq('id', currentUser.id);

            if (error) {
                showCustomPopup('error', 'Submission Failed', error.message, 'Please try again', false);
                submitBtn.disabled = false;
                submitBtn.innerText = 'Submit for Verification';
            } else {
                // সাবমিট করার সাথে সাথেই ইউজারকে মাস্ক করা NID নাম্বার দেখিয়ে ফর্ম লক করে দেওয়া
                document.getElementById('nidNumber').value = maskNidNumber(nidNumber);
                setFormDisabled(true, 'Verification is under review. Your NID details are locked.');

                showCustomPopup(
                    'success',
                    'Verification Submitted',
                    'Your verification request has been successfully submitted.',
                    'Please wait 5 minutes to 1 hour for confirmation.',
                    false
                );
            }
        }

        function showCustomPopup(type, title, message, note, redirect = false) {
            const iconElem = document.getElementById('popupIcon');
            if (type === 'success') iconElem.innerText = '🎉';
            else if (type === 'error') iconElem.innerText = '⚠️';
            else iconElem.innerText = '⏳';

            document.getElementById('popupTitle').innerText = title;
            document.getElementById('popupMessage').innerText = message;
            document.getElementById('popupNote').innerText = note;
            document.getElementById('customPopup').classList.add('active');
            isRedirectOnClose = redirect;
        }

        function closePopup() {
            document.getElementById('customPopup').classList.remove('active');
            if (isRedirectOnClose) {
                window.location.href = 'dashboard.html';
            }
        }

        checkUserAndStatus();
    </script>
</body>
</html>
