<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Deposit - Goldmine Digital</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #061913;
      --topbar-bg: rgba(6, 25, 19, 0.85);
      --card-bg: rgba(12, 38, 29, 0.85);
      --card-border: rgba(245, 207, 102, 0.3);
      --gold-primary: #f5cf66;
      --gold-gradient: linear-gradient(135deg, #ffe082 0%, #f5cf66 35%, #b89332 70%, #e6a100 100%);
      --card-gradient: linear-gradient(135deg, rgba(16, 48, 37, 0.9) 0%, rgba(3, 13, 10, 0.95) 100%);
      --text-main: #ffffff;
      --text-muted: #8da499;
      --green-glow: #2ed573;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    html, body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .mobile-container {
      width: 100%;
      max-width: 480px;
      background-color: var(--bg-dark);
      padding-bottom: 90px;
      position: relative;
      min-height: 100vh;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      background: var(--topbar-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--card-border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .top-bar .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .top-bar .back-btn {
      color: var(--gold-primary);
      font-size: 1.1rem;
      text-decoration: none;
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(245, 207, 102, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(245, 207, 102, 0.25);
      transition: all 0.3s ease;
    }

    .top-bar .back-btn:hover {
      background: rgba(245, 207, 102, 0.25);
      box-shadow: 0 0 10px rgba(245, 207, 102, 0.3);
    }

    .top-bar h2 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: 0.5px;
    }

    .content-section {
      padding: 20px;
    }

    .section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    /* Gateway Method Selector Grid */
    .gateway-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .gateway-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 15px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }

    .gateway-card i {
      font-size: 1.6rem;
      color: var(--text-muted);
      transition: all 0.3s ease;
    }

    .gateway-card span {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Active Gateway Card Style */
    .gateway-card.active {
      background: var(--card-gradient);
      border-color: var(--gold-primary);
      box-shadow: 0 0 18px rgba(245, 207, 102, 0.3);
      transform: translateY(-2px);
    }

    .gateway-card.active i, .gateway-card.active span {
      color: var(--gold-primary);
      text-shadow: 0 0 8px rgba(245, 207, 102, 0.4);
    }

    /* Shiny Gold Shimmer Animation */
    @keyframes goldShimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Admin Info Display Card - Auto Height for full screen responsiveness */
    .admin-info-card {
      background: var(--card-gradient);
      border: 1px dashed var(--gold-primary);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 12px;
      height: auto; /* Dynamic height to fit full content without breaking layout */
      width: 100%;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.6), 0 0 15px rgba(245, 207, 102, 0.1);
      position: relative;
    }

    .admin-info-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .admin-info-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .copy-btn {
      background: rgba(245, 207, 102, 0.15);
      border: 1px solid var(--gold-primary);
      color: var(--gold-primary);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s ease;
    }

    .copy-btn:hover {
      background: var(--gold-primary);
      color: #030d0a;
      box-shadow: 0 0 10px rgba(245, 207, 102, 0.4);
    }

    .admin-address-text {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--gold-primary);
      word-break: break-all;
      white-space: pre-line;
      line-height: 1.4;
    }

    .admin-instruction {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.3;
    }

    /* Exchange & Fee Info Text */
    .calc-info-text {
      font-size: 0.78rem;
      color: var(--gold-primary);
      margin-top: 4px;
      font-weight: 600;
      min-height: 18px;
      line-height: 1.2;
    }

    /* Form Inputs in Premium Card Styles */
    .input-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 14px;
      transition: all 0.3s ease;
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .input-card:focus-within {
      border-color: var(--gold-primary);
      box-shadow: 0 0 12px rgba(245, 207, 102, 0.25);
      background: rgba(16, 48, 37, 0.95);
    }

    .input-card label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .input-field {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 0.95rem;
      font-weight: 600;
    }

    .input-field::placeholder {
      color: rgba(141, 164, 153, 0.4);
      font-weight: 400;
    }

    /* Animated Gold Submit Button */
    .btn-submit {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(270deg, #ffe082, #f5cf66, #b89332, #ffe082);
      background-size: 300% 300%;
      animation: goldShimmer 4s ease infinite;
      color: #030d0a;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 20px rgba(245, 207, 102, 0.35);
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(245, 207, 102, 0.5);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      animation: none;
    }

    /* Custom Popup Animation Modal */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(3, 13, 10, 0.8);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .popup-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .popup-card {
      background: linear-gradient(145deg, #0c261d 0%, #030d0a 100%);
      border: 1px solid var(--gold-primary);
      padding: 25px 20px;
      border-radius: 20px;
      width: 85%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(245, 207, 102, 0.25);
      transform: scale(0.7);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .popup-overlay.active .popup-card {
      transform: scale(1);
    }

    .popup-icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 15px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
    }

    .popup-icon.success {
      background: rgba(46, 213, 115, 0.15);
      border: 1px solid var(--green-glow);
      color: var(--green-glow);
      box-shadow: 0 0 15px rgba(46, 213, 115, 0.3);
    }

    .popup-icon.error {
      background: rgba(255, 71, 87, 0.15);
      border: 1px solid #ff4757;
      color: #ff4757;
      box-shadow: 0 0 15px rgba(255, 71, 87, 0.3);
    }

    .popup-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .popup-msg {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 20px;
    }

    .popup-btn {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: var(--gold-gradient);
      color: #030d0a;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    #bottom-nav-container {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <div class="mobile-container">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="title-group">
        <a href="wallet-getway-method.html" class="back-btn">
          <i class="fa-solid fa-chevron-left"></i>
        </a>
        <h2>Deposit Money</h2>
      </div>
      <i class="fa-solid fa-shield-halved" style="color: var(--gold-primary); font-size: 1.1rem;"></i>
    </div>

    <div class="content-section">
      <!-- Payment Gateway Method Cards (3 items) -->
      <div class="section-title">Select Payment Gateway</div>
      <div class="gateway-grid">
        <div class="gateway-card active" data-method="bkash" onclick="selectGateway('bkash')">
          <i class="fa-solid fa-mobile-screen-button"></i>
          <span>bKash</span>
        </div>
        <div class="gateway-card" data-method="usdt" onclick="selectGateway('usdt')">
          <i class="fa-solid fa-coins"></i>
          <span>USDT</span>
        </div>
        <div class="gateway-card" data-method="bank" onclick="selectGateway('bank')">
          <i class="fa-solid fa-building-columns"></i>
          <span>Bank</span>
        </div>
      </div>

      <!-- Dynamic Deposit Address Card -->
      <div class="admin-info-card" id="admin-info-box">
        <div class="admin-info-header">
          <span class="admin-info-title" id="gateway-title-display">Deposit Info</span>
          <button type="button" class="copy-btn" onclick="copyAddress()">
            <i class="fa-regular fa-copy"></i> Copy
          </button>
        </div>
        <div class="admin-address-text" id="admin-address-display">Loading...</div>
        <div class="admin-instruction" id="admin-instruction-display">Please send payment to the address above.</div>
      </div>

      <!-- Deposit Form -->
      <form id="deposit-form">
        <div class="input-card">
          <label for="amount">Deposit Amount ($)</label>
          <input type="number" id="amount" class="input-field" placeholder="0.00" step="any" oninput="calculateExchangeAndFee()" required>
          <div class="calc-info-text" id="calc-info-display"></div>
        </div>

        <div class="input-card">
          <label for="account_number" id="sender-label">Your Sender Number / Wallet</label>
          <input type="text" id="account_number" class="input-field" placeholder="Enter your number or wallet address" required>
        </div>

        <div class="input-card">
          <label for="trx_id">Transaction ID (TrxID)</label>
          <input type="text" id="trx_id" class="input-field" placeholder="Enter transaction reference ID" required>
        </div>

        <button type="submit" class="btn-submit" id="btn-submit">
          Confirm & Submit Request
        </button>
      </form>
    </div>

    <!-- Container for bottom.html navigation -->
    <div id="bottom-nav-container"></div>
  </div>

  <!-- Animated Theme Popup Modal -->
  <div class="popup-overlay" id="custom-popup">
    <div class="popup-card">
      <div class="popup-icon success" id="popup-icon">
        <i class="fa-solid fa-check"></i>
      </div>
      <div class="popup-title" id="popup-title">Success!</div>
      <div class="popup-msg" id="popup-msg">Your action was completed successfully.</div>
      <button class="popup-btn" onclick="closePopup()">OK</button>
    </div>
  </div>

  <!-- Supabase CDN and Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <script>
    let selectedMethodKey = 'bkash';
    let gatewayDataList = {};
    let redirectOnClose = false;

    // Load gateways from Supabase
    async function loadGatewaysFromSupabase() {
      const client = window._supabase || window.supabase;
      if (!client) return;

      const { data, error } = await client
        .from('payment_gateways')
        .select('*')
        .eq('is_active', true);

      if (data && data.length > 0) {
        data.forEach(item => {
          gatewayDataList[item.method_key.toLowerCase()] = item;
        });
      } else {
        // Fallback default values
        gatewayDataList = {
          bkash: { title: 'bKash Personal', admin_address: '01953823183', instruction: 'This Number Accept Send Money bKash', usd_rate: 125, cashout_fee: 1.5, minimam_deposit_bkash: '10' },
          usdt: { title: 'USDT NETWORK (BSC BEP20)', admin_address: '0xb9277f748305fbefa740dc230c88ad7875bfcaad', instruction: 'BSC (BEP20)', usd_rate: 1, cashout_fee: 0.5, minimum_deposit_usd: '10' },
          bank: { title: 'Bank Transfer', admin_address: 'Bank: City Bank\nAccount: 1234567890\nBranch: Dhaka Main', instruction: 'ব্যাংক ডিপোজিট করার পর Trx ID বা স্লিপ নম্বর দিন।', usd_rate: 125, cashout_fee: 0, minimam_deposit_bank: '500' }
        };
      }

      updateGatewayDisplay();
    }

    // Switch active gateway card
    function selectGateway(methodKey) {
      selectedMethodKey = methodKey;

      document.querySelectorAll('.gateway-card').forEach(card => {
        if (card.dataset.method === methodKey) {
          card.classList.add('active');
        } else {
          card.classList.remove('active');
        }
      });

      updateGatewayDisplay();
      calculateExchangeAndFee();
    }

    // Dynamic Minimum Deposit Helper
    function getMinDepositLimit(gatewayObj) {
      if (selectedMethodKey === 'bkash') {
        return parseFloat(gatewayObj.minimam_deposit_bkash) || 10;
      } else if (selectedMethodKey === 'usdt') {
        return parseFloat(gatewayObj.minimum_deposit_usd) || 10;
      } else if (selectedMethodKey === 'bank') {
        return parseFloat(gatewayObj.minimam_deposit_bank) || 500;
      }
      return 10;
    }

    // Update Admin Address Card & Input Placeholders
    function updateGatewayDisplay() {
      const currentGateway = gatewayDataList[selectedMethodKey] || {};

      document.getElementById('gateway-title-display').innerText = currentGateway.title || 'Deposit Info';
      
      let rawAddress = currentGateway.admin_address || 'Not Available';
      let formattedAddress = rawAddress.replace(/\\n/g, '\n');
      document.getElementById('admin-address-display').innerText = formattedAddress;

      document.getElementById('admin-instruction-display').innerText = currentGateway.instruction || '';

      const senderLabel = document.getElementById('sender-label');
      const senderInput = document.getElementById('account_number');
      const amountInput = document.getElementById('amount');

      const minLimit = getMinDepositLimit(currentGateway);
      amountInput.placeholder = `Minimum $${minLimit}`;

      if (selectedMethodKey === 'bkash') {
        senderLabel.innerText = 'Your bKash Number';
        senderInput.placeholder = 'e.g. 01700000000';
      } else if (selectedMethodKey === 'usdt') {
        senderLabel.innerText = 'Your USDT Sender Address';
        senderInput.placeholder = 'e.g. T... or 0x... Address';
      } else {
        senderLabel.innerText = 'Sender Account Title / No';
        senderInput.placeholder = 'e.g. Account Name / Number';
      }
    }

    // Calculate Dollar Exchange Rate & Cashout Fee Dynamically
    function calculateExchangeAndFee() {
      const amountVal = parseFloat(document.getElementById('amount').value) || 0;
      const displayBox = document.getElementById('calc-info-display');
      const currentGateway = gatewayDataList[selectedMethodKey] || {};

      const usdRate = parseFloat(currentGateway.usd_rate) || (selectedMethodKey === 'usdt' ? 1 : 125);
      const cashoutFeePct = parseFloat(currentGateway.cashout_fee) || 0;

      if (amountVal > 0) {
        let textInfo = '';
        if (selectedMethodKey === 'bkash' || usdRate > 1) {
          const totalBDT = (amountVal * usdRate).toFixed(2);
          textInfo = `Amount: $1 = ${usdRate} BDT (Total: ৳${totalBDT})`;
        } else {
          textInfo = `Amount: $${amountVal.toFixed(2)}`;
        }

        if (cashoutFeePct > 0) {
          const feeAmount = ((amountVal * cashoutFeePct) / 100).toFixed(2);
          textInfo += ` | Fee: $${feeAmount}`;
        }

        displayBox.innerText = textInfo;
      } else {
        displayBox.innerText = usdRate > 1 ? `Rate: $1 = ${usdRate} BDT` : '';
      }
    }

    // Copy Address Button Functionality
    function copyAddress() {
      const address = document.getElementById('admin-address-display').innerText;
      if (address && address !== 'Loading...') {
        navigator.clipboard.writeText(address).then(() => {
          showPopup('Copied!', 'Address copied to clipboard successfully.', 'success');
        }).catch(err => {
          console.error('Copy failed', err);
        });
      }
    }

    // Custom Popup Display Helper
    function showPopup(title, message, status = 'success', isRedirect = false) {
      const overlay = document.getElementById('custom-popup');
      const icon = document.getElementById('popup-icon');
      
      document.getElementById('popup-title').innerText = title;
      document.getElementById('popup-msg').innerText = message;
      redirectOnClose = isRedirect;

      if (status === 'success') {
        icon.className = 'popup-icon success';
        icon.innerHTML = '<i class="fa-solid fa-check"></i>';
      } else {
        icon.className = 'popup-icon error';
        icon.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
      }

      overlay.classList.add('active');
    }

    function closePopup() {
      document.getElementById('custom-popup').classList.remove('active');
      if (redirectOnClose) {
        window.location.href = "wallet-getway-method.html";
      }
    }

    // Form Submission with Validation and Fee Calculation
    document.getElementById('deposit-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const client = window._supabase || window.supabase;
      const submitBtn = document.getElementById('btn-submit');

      const amountVal = parseFloat(document.getElementById('amount').value);
      const trxIdInput = document.getElementById('trx_id').value.trim();
      const accountNumber = document.getElementById('account_number').value.trim();

      const currentGateway = gatewayDataList[selectedMethodKey] || {};
      const minLimit = getMinDepositLimit(currentGateway);

      // 1. Minimum Deposit Validation Logic
      if (amountVal < minLimit) {
        showPopup('Minimum Deposit Limit', `এই মেথডে সর্বনিম্ন ডিপোজিট $${minLimit}`, 'error');
        return;
      }

      if (!trxIdInput) {
        showPopup('Warning', 'Please enter a valid Transaction ID.', 'error');
        return;
      }

      submitBtn.innerText = "Processing...";
      submitBtn.disabled = true;

      const { data: { user } } = await client.auth.getUser();

      if (!user) {
        showPopup('Authentication Error', 'Please login first!', 'error');
        submitBtn.innerText = "Confirm & Submit Request";
        submitBtn.disabled = false;
        return;
      }

      // 2. Unique TrxID Check
      const { data: existingTrx, error: checkError } = await client
        .from('transactions')
        .select('trx_id')
        .eq('trx_id', trxIdInput)
        .maybeSingle();

      if (existingTrx) {
        showPopup('Duplicate TrxID', 'এই Transaction ID টি পূর্বে একবার ব্যবহার করা হয়েছে! অনুগ্রহ করে সঠিক Trx ID দিন।', 'error');
        submitBtn.innerText = "Confirm & Submit Request";
        submitBtn.disabled = false;
        return;
      }

      // 3. Cashout Fee Calculation Logic
      const cashoutFeePct = parseFloat(currentGateway.cashout_fee) || 0;
      const chargeAmount = (amountVal * cashoutFeePct) / 100;
      const netAmount = amountVal - chargeAmount;

      const methodName = currentGateway.title || selectedMethodKey.toUpperCase();

      // Payload matching transactions table columns
      const payload = {
        user_id: user.id,
        type: 'deposit',
        amount: amountVal,
        charge: chargeAmount,
        net_amount: netAmount,
        method: methodName,
        account_number: accountNumber,
        trx_id: trxIdInput,
        status: 'pending'
      };

      const { error: insertError } = await client.from('transactions').insert([payload]);

      if (insertError) {
        showPopup('Submission Failed', insertError.message, 'error');
      } else {
        showPopup('Success!', 'Deposit request submitted successfully!', 'success', true);
      }

      submitBtn.innerText = "Confirm & Submit Request";
      submitBtn.disabled = false;
    });

    // Load bottom navigation bar
    fetch('bottom.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('bottom-nav-container').innerHTML = html;
      })
      .catch(err => console.log('Error loading bottom.html:', err));

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(loadGatewaysFromSupabase, 100);
    });
  </script>
</body>
</html>
