<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit & Withdraw - BDTMINER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #080c14; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 0 0 20px 0; }

        /* হেডার ফুল উইডথ এবং কোনো গ্যাপ ছাড়া ফিক্সড */
        #header-placeholder {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
        }

        .container { width: 100%; max-width: 420px; background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 20px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8); margin: 0 12px; }
        
        .tab-buttons { display: flex; background: #1e293b; border-radius: 12px; padding: 4px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: #94a3b8; font-weight: 600; font-size: 14px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-family: 'Orbitron', sans-serif; letter-spacing: 0.5px; }
        .tab-btn.active { background: #1E90EE; color: #000; font-weight: 700; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
        input, select { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: #fff; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: #1E90EE; }
        
        /* Neon Yellow Spring & Glowing Animation */
        @keyframes neonYellowSpring {
            0% {
                border-color: #ffff00;
                box-shadow: 0 0 8px rgba(255, 255, 0, 0.5), inset 0 0 5px rgba(255, 255, 0, 0.2);
            }
            50% {
                border-color: #ffe600;
                box-shadow: 0 0 20px rgba(255, 230, 0, 0.9), inset 0 0 10px rgba(255, 230, 0, 0.5);
            }
            100% {
                border-color: #ffff00;
                box-shadow: 0 0 8px rgba(255, 255, 0, 0.5), inset 0 0 5px rgba(255, 255, 0, 0.2);
            }
        }

        /* Live Conversion Preview Box - Neon Yellow Spring Effect */
        .conversion-preview {
            background: rgba(255, 255, 0, 0.05);
            border: 2px solid #ffff00;
            border-radius: 10px;
            padding: 10px;
            font-size: 13px;
            color: #ffff00;
            margin-top: 8px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: neonYellowSpring 2s infinite ease-in-out;
        }

        #usdOutput {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #1E90EE;
        }

        .rate-info {
            font-size: 11px;
            color: #1E90EE;
            margin-top: 4px;
            text-align: right;
            font-family: 'Orbitron', sans-serif;
        }

        .btn-submit { 
            width: 100%; 
            padding: 12px; 
            background: linear-gradient(135deg, #1E90EE, #0056b3); 
            border: none; 
            border-radius: 10px; 
            color: #fff; 
            font-weight: 800; 
            font-size: 14px; 
            cursor: pointer; 
            margin-top: 10px; 
            font-family: 'Orbitron', sans-serif; 
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Admin / Send Money Box - Neon Yellow Spring Effect */
        .admin-num-box { 
            background: rgba(255, 255, 0, 0.05); 
            border: 2px solid #ffff00; 
            border-radius: 10px; 
            padding: 10px; 
            text-align: center; 
            margin-bottom: 15px; 
            font-size: 13px; 
            color: #ffff00; 
            animation: neonYellowSpring 2s infinite ease-in-out;
        }

        .admin-num-box span, .admin-num-box strong {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            letter-spacing: normal;
            color: #1E90EE;
        }

        .copy-btn {
            background: #1E90EE;
            border: none;
            color: #fff;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 5px;
        }

        .back-home { display: block; text-align: center; color: #94a3b8; text-decoration: none; font-size: 13px; margin-top: 15px; }

        .custom-popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .custom-popup-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .custom-popup-box {
            background: linear-gradient(145deg, #0f172a, #1e293b);
            border: 1px solid rgba(30, 144, 238, 0.4);
            border-radius: 20px;
            width: 90%;
            max-width: 360px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(30, 144, 238, 0.15);
            transform: scale(0.6) translateY(30px);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .custom-popup-overlay.active .custom-popup-box {
            transform: scale(1) translateY(0);
        }
        .popup-icon {
            font-size: 45px;
            margin-bottom: 15px;
            animation: bounceIcon 1s infinite alternate;
        }
        @keyframes bounceIcon {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }
        .popup-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: #1E90EE;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .popup-message {
            font-size: 13.5px;
            color: #cbd5e1;
            margin-bottom: 12px;
            line-height: 1.6;
        }
        .popup-note {
            font-size: 12px;
            color: #1E90EE;
            background: rgba(30, 144, 238, 0.1);
            border: 1px solid rgba(30, 144, 238, 0.3);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .popup-btn {
            background: linear-gradient(135deg, #1E90EE, #0056b3);
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-weight: 800;
            font-size: 14px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.5px;
            transition: 0.2s;
        }
        .popup-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <!-- Header Dynamic Injection Placeholder -->
    <div id="header-placeholder"></div>

    <div class="container">
        <!-- Tab Switcher -->
        <div class="tab-buttons">
            <button class="tab-btn active" id="depositTabBtn" onclick="switchTab('deposit')">Deposit</button>
            <button class="tab-btn" id="withdrawTabBtn" onclick="switchTab('withdraw')">Withdraw</button>
        </div>

        <!-- Admin Payment Info Display Box (Send Money Box) -->
        <div class="admin-num-box" id="adminNumBox">
            <div id="bkashAdminInfo">
                Send Money <span id="adminBkashText">Loading...</span> (bKash)
                <button type="button" class="copy-btn" onclick="copyBkashNumber()">Copy</button>
            </div>
            <div id="usdtAdminInfo" style="display: none; word-break: break-all;">
                Network: <strong>BSC (BEP20)</strong><br>
                Address: <span id="walletAddrText">Loading...</span>
                <button type="button" class="copy-btn" onclick="copyWalletAddress()">Copy</button>
            </div>
        </div>

        <!-- Form Area -->
        <form id="transForm" onsubmit="handleTransaction(event)">
            <div class="form-group">
                <label>Select Payment Method</label>
                <select id="method" onchange="handleMethodChange()" required>
                    <option value="bkash">bKash Personal</option>
                    <option value="usdt">USDT (BEP20)</option>
                </select>
            </div>

            <div class="form-group">
                <label id="amountLabel">Amount (BDT)</label>
                <input type="number" id="amount" placeholder="e.g. 1250" min="1" oninput="calculateConversion()" required>
                
                <!-- Live USD Conversion Preview Box (You will receive Box) -->
                <div class="conversion-preview" id="conversionPreview">
                    <span>You will receive:</span>
                    <span id="usdOutput">$ 0.00 USD</span>
                </div>
                <div class="rate-info" id="rateInfoText">Exchange Rate: $1 = ৳ 125 BDT</div>
            </div>

            <div class="form-group">
                <label id="numLabel">Your Sender Mobile Number</label>
                <input type="text" id="phone" placeholder="017xxxxxxxx" required>
            </div>

            <div class="form-group" id="trxGroup">
                <label id="trxLabel">Transaction ID (TrxID)</label>
                <input type="text" id="trxId" placeholder="e.g. B7X89KL21">
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Submit Deposit Request</button>
        </form>

        <a href="dashboard.html" class="back-home">← Back to Dashboard</a>
    </div>

    <!-- Premium Custom Animated Popup Modal -->
    <div class="custom-popup-overlay" id="customPopup">
        <div class="custom-popup-box">
            <div class="popup-icon" id="popupIcon">🎉</div>
            <div class="popup-title" id="popupTitle">Success</div>
            <div class="popup-message" id="popupMessage">Your request has been submitted successfully.</div>
            <div class="popup-note" id="popupNote">Please wait 5-10 minutes for confirmation.</div>
            <button type="button" class="popup-btn" onclick="closePopup()">OK</button>
        </div>
    </div>

    <script>
        const USD_RATE = 125; 

        const SUPABASE_URL = 'https://pckocwvuxeseumynslwv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBja29jd3Z1eGVzZXVteW5zbHd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NDc3OTAsImV4cCI6MjEwNjIyMzc5MH0.0VBGW9lgZDritQa7XDoPncu5bl9M6J5W9eup0KSLXIc';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentType = 'deposit';
        let isRedirectOnClose = false;

        document.getElementById('rateInfoText').innerText = `Exchange Rate: $1 = ৳ ${USD_RATE} BDT`;

        // Sidebar Toggle Global Function
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebarMenu');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar && overlay) {
                sidebar.classList.toggle('active');
                overlay.classList.toggle('active');
            }
        }

        // Load Header Dynamically and Update Balance
        async function loadHeader() {
            try {
                const response = await fetch('header.html');
                if (response.ok) {
                    const html = await response.text();
                    document.getElementById('header-placeholder').innerHTML = html;
                    
                    // Highlight current page in navbar
                    const currentPage = window.location.pathname.split("/").pop();
                    const navLinks = document.querySelectorAll('.nav-item, .sidebar-links .nav-item');
                    navLinks.forEach(link => {
                        if (link.getAttribute('href') === currentPage) {
                            link.classList.add('active');
                        }
                    });

                    // Fetch and update balance after header loads
                    fetchUserData();
                }
            } catch (err) {
                console.error('Header load error:', err);
            }
        }

        async function fetchUserData() {
            try {
                const { data: { user } } = await supabaseClient.auth.getUser();
                if (user) {
                    const { data: profile } = await supabaseClient
                        .from('profiles')
                        .select('balance')
                        .eq('id', user.id)
                        .single();

                    if (profile) {
                        const bal = parseFloat(profile.balance || 0).toFixed(2);
                        const balanceElement = document.getElementById('topBalance');
                        if (balanceElement) {
                            balanceElement.innerText = `$${bal}`;
                        }
                    }
                }
            } catch (err) {
                console.error('User data fetch error:', err);
            }
        }

        async function fetchAdminConfig() {
            try {
                const { data, error } = await supabaseClient
                    .from('admin_config')
                    .select('bkash_number, usdt_address')
                    .single();

                if (data && !error) {
                    document.getElementById('adminBkashText').innerText = data.bkash_number || '01700000000';
                    document.getElementById('walletAddrText').innerText = data.usdt_address || '0x...';
                }
            } catch (err) {
                console.error('Config fetch error:', err);
            }
        }

        function switchTab(type) {
            currentType = type;
            const depositBtn = document.getElementById('depositTabBtn');
            const withdrawBtn = document.getElementById('withdrawTabBtn');
            const adminBox = document.getElementById('adminNumBox');
            const trxGroup = document.getElementById('trxGroup');
            const submitBtn = document.getElementById('submitBtn');

            if (type === 'deposit') {
                depositBtn.classList.add('active');
                withdrawBtn.classList.remove('active');
                adminBox.style.display = 'block';
                trxGroup.style.display = 'block';
                document.getElementById('trxId').required = true;
                submitBtn.innerText = 'Submit Deposit Request';
            } else {
                withdrawBtn.classList.add('active');
                depositBtn.classList.remove('active');
                adminBox.style.display = 'none';
                trxGroup.style.display = 'none';
                document.getElementById('trxId').required = false;
                submitBtn.innerText = 'Submit Withdraw Request';
            }

            handleMethodChange();
        }

        function handleMethodChange() {
            const method = document.getElementById('method').value;
            const bkashAdmin = document.getElementById('bkashAdminInfo');
            const usdtAdmin = document.getElementById('usdtAdminInfo');
            const amountLabel = document.getElementById('amountLabel');
            const amountInput = document.getElementById('amount');
            const numLabel = document.getElementById('numLabel');
            const phoneInput = document.getElementById('phone');
            const rateInfoText = document.getElementById('rateInfoText');
            const trxLabel = document.getElementById('trxLabel');

            if (currentType === 'deposit') {
                if (method === 'bkash') {
                    bkashAdmin.style.display = 'block';
                    usdtAdmin.style.display = 'none';
                    amountLabel.innerText = 'Amount (BDT)';
                    amountInput.placeholder = 'e.g. 1250';
                    numLabel.innerText = 'Your Sender Mobile Number';
                    phoneInput.placeholder = '017xxxxxxxx';
                    rateInfoText.style.display = 'block';
                    trxLabel.innerText = 'Transaction ID (TrxID)';
                } else {
                    bkashAdmin.style.display = 'none';
                    usdtAdmin.style.display = 'block';
                    amountLabel.innerText = 'Amount (USD / USDT)';
                    amountInput.placeholder = 'e.g. 10';
                    numLabel.innerText = 'Your Sender Wallet Address (BEP20)';
                    phoneInput.placeholder = '0x...';
                    rateInfoText.style.display = 'none';
                    trxLabel.innerText = 'Transaction Hash (TxID)';
                }
            } else {
                bkashAdmin.style.display = 'none';
                usdtAdmin.style.display = 'none';
                if (method === 'bkash') {
                    amountLabel.innerText = 'Amount (BDT equivalent in USD)';
                    amountInput.placeholder = 'e.g. 1250';
                    numLabel.innerText = 'Your Receiver Mobile Number';
                    phoneInput.placeholder = '017xxxxxxxx';
                    rateInfoText.style.display = 'block';
                } else {
                    amountLabel.innerText = 'Amount (USD / USDT)';
                    amountInput.placeholder = 'e.g. 10';
                    numLabel.innerText = 'Your Receiver Wallet Address (BEP20)';
                    phoneInput.placeholder = '0x...';
                    rateInfoText.style.display = 'none';
                }
            }
            calculateConversion();
        }

        function calculateConversion() {
            const method = document.getElementById('method').value;
            const inputVal = parseFloat(document.getElementById('amount').value) || 0;
            const previewLabel = document.querySelector('#conversionPreview span:first-child');
            const usdOutput = document.getElementById('usdOutput');

            if (method === 'usdt') {
                const usdValue = inputVal.toFixed(2);
                if (currentType === 'deposit') {
                    previewLabel.innerText = 'You will receive:';
                    usdOutput.innerText = `$ ${usdValue} USD`;
                } else {
                    previewLabel.innerText = 'Withdraw Amount:';
                    usdOutput.innerText = `$ ${usdValue} USD`;
                }
            } else {
                const usdValue = (inputVal / USD_RATE).toFixed(2);
                if (currentType === 'deposit') {
                    previewLabel.innerText = 'You will receive:';
                    usdOutput.innerText = `$ ${usdValue} USD`;
                } else {
                    previewLabel.innerText = 'Withdraw Amount:';
                    usdOutput.innerText = `$ ${usdValue} USD (৳ ${inputVal} BDT)`;
                }
            }
        }

        function copyBkashNumber() {
            const num = document.getElementById('adminBkashText').innerText;
            navigator.clipboard.writeText(num).then(() => {
                showCustomPopup('success', 'Copied!', 'bKash Number copied to clipboard successfully.', 'Action Successful', false);
            });
        }

        function copyWalletAddress() {
            const addr = document.getElementById('walletAddrText').innerText;
            navigator.clipboard.writeText(addr).then(() => {
                showCustomPopup('success', 'Copied!', 'Wallet Address copied to clipboard successfully.', 'Action Successful', false);
            });
        }

        function showCustomPopup(type, title, message, note, redirect = false) {
            const iconElem = document.getElementById('popupIcon');
            if (type === 'success') {
                iconElem.innerText = '🎉';
            } else if (type === 'error') {
                iconElem.innerText = '⚠';
            } else {
                iconElem.innerText = '🔔';
            }

            document.getElementById('popupTitle').innerText = title;
            document.getElementById('popupMessage').innerText = message;
            document.getElementById('popupNote').innerText = note;
            document.getElementById('customPopup').classList.add('active');
            isRedirectOnClose = redirect;
        }

        function closePopup() {
            document.getElementById('customPopup').classList.remove('active');
            if (isRedirectOnClose) {
                window.location.href = 'dashboard.html';
            }
        }

        async function handleTransaction(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Processing...';

            const { data: { user } } = await supabaseClient.auth.getUser();

            if (!user) {
                showCustomPopup('error', 'Authentication Required', 'Please sign up or log in first to submit your request!', 'Redirecting to Signup', false);
                setTimeout(() => { window.location.href = 'signup.html'; }, 2000);
                return;
            }

            const method = document.getElementById('method').value;
            const inputValue = parseFloat(document.getElementById('amount').value);
            let usdAmount = 0;

            if (method === 'usdt') {
                usdAmount = parseFloat(inputValue.toFixed(2));
            } else {
                usdAmount = parseFloat((inputValue / USD_RATE).toFixed(2));
            }

            const inputFieldVal = document.getElementById('phone').value;
            const rawTrxId = document.getElementById('trxId').value;
            const trxId = rawTrxId ? rawTrxId.trim() : null;

            if (usdAmount <= 0) {
                showCustomPopup('error', 'Invalid Amount', 'Please enter a valid amount greater than zero.', 'Check your input', false);
                submitBtn.disabled = false;
                submitBtn.innerText = currentType === 'deposit' ? 'Submit Deposit Request' : 'Submit Withdraw Request';
                return;
            }

            if (currentType === 'deposit' && trxId) {
                const { data: existingTrx, error: trxCheckError } = await supabaseClient
                    .from('transactions')
                    .select('id')
                    .eq('trx_id', trxId)
                    .maybeSingle();

                if (existingTrx) {
                    showCustomPopup('error', 'Duplicate TrxID', 'This TrxID has already been used previously. Using the same TrxID multiple times is strictly prohibited.', 'Security Alert', false);
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Submit Deposit Request';
                    return;
                }
            }

            if (currentType === 'withdraw') {
                const { data: profile, error: profileError } = await supabaseClient
                    .from('profiles')
                    .select('balance')
                    .eq('id', user.id)
                    .single();

                if (profileError || !profile) {
                    showCustomPopup('error', 'Profile Error', 'User profile could not be found!', 'Please try again', false);
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Submit Withdraw Request';
                    return;
                }

                const currentBalance = parseFloat(profile.balance || 0);

                if (currentBalance < usdAmount) {
                    showCustomPopup('error', 'Insufficient Balance', `Your account balance is insufficient!\n\nYour Balance: $${currentBalance.toFixed(2)} USD\nRequested: $${usdAmount} USD`, 'Please deposit funds first', false);
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Submit Withdraw Request';
                    return;
                }

                const newBalance = currentBalance - usdAmount;
                const { error: updateError } = await supabaseClient
                    .from('profiles')
                    .update({ balance: newBalance })
                    .eq('id', user.id);

                if (updateError) {
                    showCustomPopup('error', 'Update Failed', 'Failed to update balance: ' + updateError.message, 'System Error', false);
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Submit Withdraw Request';
                    return;
                }
            }

            const { data, error } = await supabaseClient
                .from('transactions')
                .insert([
                    {
                        user_id: user.id,
                        user_email: user.email,
                        type: currentType,
                        method: method,
                        amount: usdAmount,
                        sender_receiver_number: method === 'bkash' ? inputFieldVal : null,
                        wallet_address: method === 'usdt' ? inputFieldVal : null,
                        trx_id: trxId,
                        status: 'pending'
                    }
                ]);

            if (error) {
                if (error.code === '23505') {
                    showCustomPopup('error', 'Duplicate TrxID', 'This TrxID already exists in the database. Duplicate submissions are not allowed.', 'Security Alert', false);
                } else {
                    showCustomPopup('error', 'Submission Failed', 'Failed to submit request: ' + error.message, 'Please try again', false);
                }
                submitBtn.disabled = false;
                submitBtn.innerText = currentType === 'deposit' ? 'Submit Deposit Request' : 'Submit Withdraw Request';
            } else {
                if (currentType === 'deposit') {
                    showCustomPopup(
                        'success',
                        'Deposit Request Submitted',
                        `Your deposit request of $${usdAmount} USD has been successfully submitted.`,
                        'Please wait 5-10 minutes for confirmation.',
                        true
                    );
                } else {
                    showCustomPopup(
                        'success',
                        'Withdraw Request Submitted',
                        `Your withdrawal request of $${usdAmount} USD has been successfully submitted.`,
                        'Please wait 12-24 hours for withdrawal processing.',
                        true
                    );
                }
            }
        }

        // Initialize functions
        loadHeader();
        fetchAdminConfig();

        const urlParams = new URLSearchParams(window.location.search);
        const initialType = urlParams.get('type');
        if (initialType === 'withdraw' || initialType === 'deposit') {
            switchTab(initialType);
        } else {
            handleMethodChange();
        }
    </script>
</body>
</html>
