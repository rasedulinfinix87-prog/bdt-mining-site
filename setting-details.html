<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Goldmine Digital</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #061913;
      --topbar-bg: #030d0a;
      --card-bg: rgba(12, 38, 29, 0.85);
      --card-border: rgba(245, 207, 102, 0.2);
      --gold-primary: #f5cf66;
      --gold-gradient: linear-gradient(135deg, #f5cf66 0%, #b89332 100%);
      --green-accent: #2ed573;
      --text-main: #ffffff;
      --text-muted: #8da499;
      --danger-color: #ff4757;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(245, 207, 102, 0.05) 0%, transparent 20%),
        radial-gradient(circle at 90% 80%, rgba(46, 213, 115, 0.03) 0%, transparent 20%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .mobile-container {
      width: 100%;
      max-width: 480px;
      background-color: var(--bg-dark);
      padding-bottom: 90px;
      position: relative;
      min-height: 100vh;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      background: var(--topbar-bg);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .top-bar .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .top-bar .back-btn {
      color: var(--text-main);
      font-size: 1.1rem;
      text-decoration: none;
      cursor: pointer;
    }

    .top-bar h2 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: 0.5px;
    }

    /* Profile Header (Logged in) */
    .user-profile-card {
      margin: 20px;
      padding: 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      backdrop-filter: blur(10px);
    }

    .avatar-box {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(245, 207, 102, 0.2), rgba(46, 213, 115, 0.1));
      border: 2px solid var(--gold-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: var(--gold-primary);
    }

    .user-info h4 {
      font-size: 1.1rem;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .user-info p {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    /* Settings Menu List */
    .menu-group {
      margin: 0 20px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .menu-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 1px;
      margin: 10px 0 4px 5px;
      font-weight: 600;
    }

    .menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      color: var(--text-main);
      text-decoration: none;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .menu-item:hover {
      border-color: var(--gold-primary);
      transform: translateX(3px);
    }

    .menu-item-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .menu-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(245, 207, 102, 0.1);
      color: var(--gold-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    .menu-text {
      font-size: 0.95rem;
      font-weight: 500;
    }

    .menu-item i.chevron {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    /* Rating Component Style */
    .rating-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px 18px;
      margin-top: 5px;
    }

    .rating-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 10px;
    }

    .stars-container {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 8px 0;
    }

    .stars-container i {
      font-size: 1.4rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .stars-container i:hover,
    .stars-container i.active {
      color: var(--gold-primary);
      transform: scale(1.15);
    }

    .rating-feedback {
      text-align: center;
      font-size: 0.8rem;
      color: var(--green-accent);
      min-height: 18px;
      margin-top: 5px;
      font-weight: 500;
    }

    /* Action Buttons */
    .btn-action {
      width: calc(100% - 40px);
      margin: 10px 20px;
      padding: 14px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .btn-signin {
      background: var(--gold-gradient);
      color: #030d0a;
      box-shadow: 0 4px 15px rgba(245, 207, 102, 0.25);
    }

    .btn-logout {
      background: rgba(255, 71, 87, 0.12);
      color: var(--danger-color);
      border: 1px solid rgba(255, 71, 87, 0.3);
    }

    .btn-logout:hover {
      background: rgba(255, 71, 87, 0.25);
    }

    #bottom-nav-container {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      z-index: 1000;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="mobile-container">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="title-group">
        <a href="javascript:history.back()" class="back-btn">
          <i class="fa-solid fa-chevron-left"></i>
        </a>
        <h2>Settings</h2>
      </div>
      <i class="fa-solid fa-gear" style="color: var(--gold-primary); font-size: 1.2rem;"></i>
    </div>

    <!-- User Profile Card (Show when logged in) -->
    <div id="user-profile" class="user-profile-card hidden">
      <div class="avatar-box">
        <i class="fa-solid fa-user"></i>
      </div>
      <div class="user-info">
        <h4 id="user-name">Loading...</h4>
        <p id="user-email">user@example.com</p>
      </div>
    </div>

    <!-- Logged In Menu Group -->
    <div id="logged-in-menu" class="menu-group hidden">
      <div class="menu-title">Account & Services</div>

      <a href="account-info.html" class="menu-item">
        <div class="menu-item-left">
          <div class="menu-icon"><i class="fa-solid fa-user-gear"></i></div>
          <span class="menu-text">Account Holder Info</span>
        </div>
        <i class="fa-solid fa-chevron-right chevron"></i>
      </a>

      <a href="gol-investing.html" class="menu-item">
        <div class="menu-item-left">
          <div class="menu-icon"><i class="fa-solid fa-crown"></i></div>
          <span class="menu-text">Subscription</span>
        </div>
        <i class="fa-solid fa-chevron-right chevron"></i>
      </a>

      <a href="transaction-history.html" class="menu-item">
        <div class="menu-item-left">
          <div class="menu-icon"><i class="fa-solid fa-receipt"></i></div>
          <span class="menu-text">Transaction History</span>
        </div>
        <i class="fa-solid fa-chevron-right chevron"></i>
      </a>

      <!-- Rating Us (Animated Visual) -->
      <div class="rating-card">
        <div class="rating-header">
          <div class="menu-icon"><i class="fa-solid fa-star"></i></div>
          <span class="menu-text">Rating Us</span>
        </div>
        <div class="stars-container" id="stars-group">
          <i class="fa-solid fa-star" data-rating="1"></i>
          <i class="fa-solid fa-star" data-rating="2"></i>
          <i class="fa-solid fa-star" data-rating="3"></i>
          <i class="fa-solid fa-star" data-rating="4"></i>
          <i class="fa-solid fa-star" data-rating="5"></i>
        </div>
        <div class="rating-feedback" id="rating-feedback"></div>
      </div>
    </div>

    <!-- General Menu Group (Visible for all) -->
    <div class="menu-group">
      <div class="menu-title">Support & Legal</div>

      <a href="contact-us.html" class="menu-item">
        <div class="menu-item-left">
          <div class="menu-icon"><i class="fa-solid fa-headset"></i></div>
          <span class="menu-text">Contact Us</span>
        </div>
        <i class="fa-solid fa-chevron-right chevron"></i>
      </a>

      <a href="privacy-policy.html" class="menu-item">
        <div class="menu-item-left">
          <div class="menu-icon"><i class="fa-solid fa-shield-halved"></i></div>
          <span class="menu-text">Privacy Policy</span>
        </div>
        <i class="fa-solid fa-chevron-right chevron"></i>
      </a>
    </div>

    <!-- Auth Actions -->
    <div id="auth-actions">
      <!-- Sign In Button (Logged out state) -->
      <a href="login.html" id="btn-signin" class="btn-action btn-signin hidden">
        <i class="fa-solid fa-right-to-bracket"></i> Sign In
      </a>

      <!-- Log Out Button (Logged in state) -->
      <button id="btn-logout" class="btn-action btn-logout hidden" onclick="handleLogout()">
        <i class="fa-solid fa-right-from-bracket"></i> Log Out
      </button>
    </div>

    <!-- Bottom Navigation Container -->
    <div id="bottom-nav-container"></div>
  </div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      checkAuthState();
      setupRatingSystem();
      loadBottomNav();
    });

    // Check Supabase Auth State
    async function checkAuthState() {
      const client = window._supabase || window.supabase;

      if (!client) {
        showLoggedOutUI();
        return;
      }

      const { data: { user } } = await client.auth.getUser();

      if (user) {
        // User is Logged In
        document.getElementById('user-profile').classList.remove('hidden');
        document.getElementById('logged-in-menu').classList.remove('hidden');
        document.getElementById('btn-logout').classList.remove('hidden');

        document.getElementById('user-email').innerText = user.email || 'N/A';
        document.getElementById('user-name').innerText = user.user_metadata?.full_name || user.email.split('@')[0];
      } else {
        // User is Logged Out
        showLoggedOutUI();
      }
    }

    function showLoggedOutUI() {
      document.getElementById('user-profile').classList.add('hidden');
      document.getElementById('logged-in-menu').classList.add('hidden');
      document.getElementById('btn-logout').classList.add('hidden');
      document.getElementById('btn-signin').classList.remove('hidden');
    }

    // Interactive Rating System (Fake Animated Rating)
    function setupRatingSystem() {
      const stars = document.querySelectorAll('#stars-group i');
      const feedback = document.getElementById('rating-feedback');

      stars.forEach((star, index) => {
        star.addEventListener('click', () => {
          const rating = index + 1;
          
          stars.forEach((s, idx) => {
            if (idx < rating) {
              s.classList.add('active');
            } else {
              s.classList.remove('active');
            }
          });

          if (rating === 5) {
            feedback.innerText = "Thank you! We appreciate your 5-star rating! ⭐";
          } else {
            feedback.innerText = `Thanks for giving us ${rating} star${rating > 1 ? 's' : ''}!`;
          }
        });
      });
    }

    // Handle Logout
    async function handleLogout() {
      const client = window._supabase || window.supabase;
      if (confirm("Are you sure you want to log out?")) {
        if (client) {
          await client.auth.signOut();
        }
        window.location.href = "login.html";
      }
    }

    // Load Bottom Navigation
    function loadBottomNav() {
      fetch('bottom.html')
        .then(res => res.text())
        .then(html => {
          document.getElementById('bottom-nav-container').innerHTML = html;
        })
        .catch(err => console.log('Error loading bottom.html:', err));
    }
  </script>
</body>
</html>
