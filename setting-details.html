<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Goldmine Digital</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #061913;
      --topbar-bg: #030d0a;
      --card-bg: rgba(12, 38, 29, 0.85);
      --card-border: rgba(245, 207, 102, 0.2);
      --gold-primary: #f5cf66;
      --green-glow: #2ed573;
      --text-main: #ffffff;
      --text-muted: #8da499;
      --red-color: #ff4757;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(245, 207, 102, 0.05) 0%, transparent 20%),
        radial-gradient(circle at 90% 80%, rgba(46, 213, 115, 0.03) 0%, transparent 20%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .mobile-container {
      width: 100%;
      max-width: 480px;
      background-color: var(--bg-dark);
      padding-bottom: 90px;
      position: relative;
      min-height: 100vh;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      background: var(--topbar-bg);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .top-bar .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .top-bar .back-btn {
      color: var(--text-main);
      font-size: 1.1rem;
      text-decoration: none;
      cursor: pointer;
    }

    .top-bar h2 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .menu-toggle-btn {
      background: transparent;
      border: none;
      color: var(--gold-primary);
      font-size: 1.4rem;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .menu-toggle-btn:active {
      transform: scale(0.9);
    }

    /* Top Right Hamburger Dropdown Menu */
    .hamburger-dropdown {
      position: absolute;
      top: 65px;
      right: 20px;
      background: var(--topbar-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      width: 180px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: none;
      flex-direction: column;
      z-index: 101;
      overflow: hidden;
    }

    .hamburger-dropdown.active {
      display: flex;
    }

    .hamburger-dropdown a {
      padding: 12px 16px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: background 0.2s;
    }

    .hamburger-dropdown a:hover {
      background: rgba(245, 207, 102, 0.1);
      color: var(--gold-primary);
    }

    .hamburger-dropdown a:last-child {
      border-bottom: none;
    }

    /* Header Profile Brief */
    .profile-header {
      padding: 24px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--card-bg);
      margin: 15px 20px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
    }

    .profile-avatar {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: rgba(245, 207, 102, 0.15);
      border: 2px solid var(--gold-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-primary);
      font-size: 1.5rem;
    }

    .profile-info h3 {
      font-size: 1.1rem;
      color: var(--text-main);
    }

    .profile-info p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Settings Group List */
    .settings-list {
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .setting-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 16px 18px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .setting-item:hover {
      border-color: var(--gold-primary);
      transform: translateY(-2px);
    }

    .setting-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .setting-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(245, 207, 102, 0.1);
      color: var(--gold-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .setting-title {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .setting-right {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    /* Red Action for Logout */
    .setting-item.logout .setting-icon {
      background: rgba(255, 71, 87, 0.1);
      color: var(--red-color);
    }

    .setting-item.logout .setting-title {
      color: var(--red-color);
    }

    /* Fake Rating Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .rating-card {
      background: var(--topbar-bg);
      border: 1px solid var(--gold-primary);
      width: 85%;
      max-width: 360px;
      border-radius: 20px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .rating-card h4 {
      color: var(--gold-primary);
      font-size: 1.2rem;
      margin-bottom: 8px;
    }

    .rating-card p {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 18px;
    }

    .stars-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .stars-container i {
      font-size: 1.8rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.2s, transform 0.2s;
    }

    .stars-container i.active {
      color: var(--gold-primary);
      transform: scale(1.1);
    }

    .modal-btns {
      display: flex;
      gap: 10px;
    }

    .btn-modal {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-submit {
      background: var(--gold-primary);
      color: var(--topbar-bg);
    }

    .btn-cancel {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    #bottom-nav-container {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <div class="mobile-container">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="title-group">
        <a href="javascript:history.back()" class="back-btn">
          <i class="fa-solid fa-chevron-left"></i>
        </a>
        <h2>Settings</h2>
      </div>
      <button class="menu-toggle-btn" onclick="toggleMenu()">
        <i class="fa-solid fa-bars"></i>
      </button>

      <!-- Right Corner Hamburger Menu -->
      <div class="hamburger-dropdown" id="hamburger-menu">
        <a href="contact-us.html"><i class="fa-solid fa-headset"></i> Contact Us</a>
        <a href="privacy-policy.html"><i class="fa-solid fa-shield-halved"></i> Privacy Policy</a>
      </div>
    </div>

    <!-- User Brief Section -->
    <div class="profile-header" id="user-profile-header">
      <div class="profile-avatar">
        <i class="fa-solid fa-user" id="user-avatar-icon"></i>
      </div>
      <div class="profile-info">
        <h3 id="user-display-name">Checking Auth...</h3>
        <p id="user-display-email">Please wait a moment</p>
      </div>
    </div>

    <!-- Dynamic Settings List -->
    <div class="settings-list" id="settings-options">
      <!-- JavaScript populated buttons will appear here -->
    </div>

    <!-- Bottom Nav Container -->
    <div id="bottom-nav-container"></div>
  </div>

  <!-- Rating Visual Modal -->
  <div class="modal-overlay" id="rating-modal">
    <div class="rating-card">
      <i class="fa-solid fa-award" style="font-size: 2.5rem; color: var(--gold-primary); margin-bottom: 10px;"></i>
      <h4>Rate Goldmine Digital</h4>
      <p>How was your experience using our investment platform?</p>
      
      <div class="stars-container">
        <i class="fa-solid fa-star" onclick="setRating(1)"></i>
        <i class="fa-solid fa-star" onclick="setRating(2)"></i>
        <i class="fa-solid fa-star" onclick="setRating(3)"></i>
        <i class="fa-solid fa-star" onclick="setRating(4)"></i>
        <i class="fa-solid fa-star" onclick="setRating(5)"></i>
      </div>

      <div class="modal-btns">
        <button class="btn-modal btn-cancel" onclick="closeRatingModal()">Cancel</button>
        <button class="btn-modal btn-submit" onclick="submitRating()">Submit</button>
      </div>
    </div>
  </div>

  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Supabase Config Script -->
  <script src="./supabase-config.js"></script>

  <script>
    // Toggle Hamburger Menu
    function toggleMenu() {
      const menu = document.getElementById('hamburger-menu');
      menu.classList.toggle('active');
    }

    // Close menu when clicking outside
    document.addEventListener('click', function(e) {
      const menu = document.getElementById('hamburger-menu');
      const btn = document.querySelector('.menu-toggle-btn');
      if (menu && !menu.contains(e.target) && !btn.contains(e.target)) {
        menu.classList.remove('active');
      }
    });

    // Safe Supabase Instance Retrieval Helper
    async function getSupabaseInstance() {
      let attempts = 0;
      // Wait until _supabase is ready or timeout after 2 seconds
      while ((!window._supabase && !window.supabase) && attempts < 20) {
        await new Promise(resolve => setTimeout(resolve, 100));
        attempts++;
      }

      if (window._supabase) {
        return window._supabase;
      }
      
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        const SUPABASE_URL = "https://pckocwvuxeseumynslwv.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBja29jd3Z1eGVzZXVteW5zbHd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NDc3OTAsImV4cCI6MjEwNjIyMzc5MH0.0VBGW9lgZDritQa7XDoPncu5bl9M6J5W9eup0KSLXIc";
        return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
      
      return null;
    }

    // Check Auth Status & Render Options
    async function initSettings() {
      const settingsContainer = document.getElementById('settings-options');
      const profileName = document.getElementById('user-display-name');
      const profileEmail = document.getElementById('user-display-email');

      const client = await getSupabaseInstance();

      let user = null;
      if (client) {
        try {
          const { data } = await client.auth.getUser();
          user = data?.user || null;
        } catch (err) {
          console.error("Auth check error:", err);
        }
      }

      if (user) {
        // Logged IN View
        profileName.innerText = user.user_metadata?.full_name || user.email.split('@')[0] || "Valued Investor";
        profileEmail.innerText = user.email;

        settingsContainer.innerHTML = `
          <a href="account-info.html" class="setting-item">
            <div class="setting-left">
              <div class="setting-icon"><i class="fa-solid fa-user-gear"></i></div>
              <span class="setting-title">Account Holder Info</span>
            </div>
            <div class="setting-right"><i class="fa-solid fa-chevron-right"></i></div>
          </a>

          <a href="gol-investing-dashborad.html" class="setting-item">
            <div class="setting-left">
              <div class="setting-icon"><i class="fa-solid fa-gem"></i></div>
              <span class="setting-title">Active Invest Plans</span>
            </div>
            <div class="setting-right"><i class="fa-solid fa-chevron-right"></i></div>
          </a>

          <a href="transaction-history.html" class="setting-item">
            <div class="setting-left">
              <div class="setting-icon"><i class="fa-solid fa-receipt"></i></div>
              <span class="setting-title">Transaction History</span>
            </div>
            <div class="setting-right"><i class="fa-solid fa-chevron-right"></i></div>
          </a>

          <div class="setting-item" onclick="openRatingModal()">
            <div class="setting-left">
              <div class="setting-icon"><i class="fa-solid fa-star"></i></div>
              <span class="setting-title">Rating Us</span>
            </div>
            <div class="setting-right"><i class="fa-solid fa-chevron-right"></i></div>
          </div>

          <a href="contact-us.html" class="setting-item">
            <div class="setting-left">
              <div class="setting-icon"><i class="fa-solid fa-headset"></i></div>
              <span class="setting-title">Contact Us</span>
            </div>
            <div class="setting-right"><i class="fa-solid fa-chevron-right"></i></div>
          </a>

          <a href="privacy-policy.html" class="setting-item">
            <div class="setting-left">
              <div class="setting-icon"><i class="fa-solid fa-shield-halved"></i></div>
              <span class="setting-title">Privacy Policy</span>
            </div>
            <div class="setting-right"><i class="fa-solid fa-chevron-right"></i></div>
          </a>

          <div class="setting-item logout" onclick="handleLogout()">
            <div class="setting-left">
              <div class="setting-icon"><i class="fa-solid fa-right-from-bracket"></i></div>
              <span class="setting-title">Log Out</span>
            </div>
            <div class="setting-right"><i class="fa-solid fa-chevron-right"></i></div>
          </div>
        `;
      } else {
        // Logged OUT View
        profileName.innerText = "Guest User";
        profileEmail.innerText = "Please sign in to manage account";

        settingsContainer.innerHTML = `
          <a href="contact-us.html" class="setting-item">
            <div class="setting-left">
              <div class="setting-icon"><i class="fa-solid fa-headset"></i></div>
              <span class="setting-title">Contact Us</span>
            </div>
            <div class="setting-right"><i class="fa-solid fa-chevron-right"></i></div>
          </a>

          <a href="privacy-policy.html" class="setting-item">
            <div class="setting-left">
              <div class="setting-icon"><i class="fa-solid fa-shield-halved"></i></div>
              <span class="setting-title">Privacy Policy</span>
            </div>
            <div class="setting-right"><i class="fa-solid fa-chevron-right"></i></div>
          </a>

          <a href="login-signup.html" class="setting-item">
            <div class="setting-left">
              <div class="setting-icon" style="color: var(--green-glow); background: rgba(46, 213, 115, 0.1);">
                <i class="fa-solid fa-right-to-bracket"></i>
              </div>
              <span class="setting-title" style="color: var(--green-glow);">Sign In</span>
            </div>
            <div class="setting-right"><i class="fa-solid fa-chevron-right"></i></div>
          </a>
        `;
      }
    }

    // Handle Logout
    async function handleLogout() {
      const client = await getSupabaseInstance();
      if (client) {
        await client.auth.signOut();
        alert("Logged out successfully!");
        window.location.reload();
      }
    }

    // Rating Modal Logic
    let selectedRating = 5;

    function openRatingModal() {
      document.getElementById('rating-modal').classList.add('active');
      setRating(5);
    }

    function closeRatingModal() {
      document.getElementById('rating-modal').classList.remove('active');
    }

    function setRating(stars) {
      selectedRating = stars;
      const allStars = document.querySelectorAll('.stars-container i');
      allStars.forEach((star, idx) => {
        if (idx < stars) {
          star.classList.add('active');
        } else {
          star.classList.remove('active');
        }
      });
    }

    function submitRating() {
      alert(`Thank you for rating us ${selectedRating} stars!`);
      closeRatingModal();
    }

    // Load Bottom Nav
    fetch('bottom.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('bottom-nav-container').innerHTML = html;
      })
      .catch(err => console.log('Error loading bottom.html:', err));

    // Initialize Page
    document.addEventListener('DOMContentLoaded', initSettings);
  </script>
</body>
</html>
