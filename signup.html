<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDTMINER - Login & Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #080c14; color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .auth-card { width: 100%; max-width: 400px; background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 30px 20px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8); text-align: center; }
        .logo { font-size: 22px; font-weight: 700; color: #f59e0b; margin-bottom: 20px; }
        .tab-buttons { display: flex; margin-bottom: 20px; background: #1e293b; border-radius: 10px; padding: 4px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: #94a3b8; font-weight: 600; cursor: pointer; border-radius: 8px; }
        .tab-btn.active { background: #f59e0b; color: #000; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 12px; background: #020617; border: 1px solid #334155; border-radius: 8px; color: #fff; outline: none; }
        .btn-submit { width: 100%; padding: 12px; background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .forgot-pass-container { margin-top: 12px; text-align: right; }
        .forgot-pass-link { color: #f59e0b; font-size: 12px; text-decoration: none; cursor: pointer; }
        .forgot-pass-link:hover { text-decoration: underline; }
        .back-home { display: block; margin-top: 20px; color: #94a3b8; text-decoration: none; font-size: 13px; }
        .signup-only { display: block; }

        /* Custom Animated Popup Modal Styles */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-box {
            background: #0f172a; border: 1px solid #334155; width: 90%; max-width: 320px;
            padding: 25px 20px; border-radius: 16px; text-align: center;
            transform: scale(0.7); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }
        .modal-overlay.active .modal-box { transform: scale(1); }
        .modal-icon { font-size: 40px; margin-bottom: 10px; }
        .modal-message { font-size: 15px; color: #e2e8f0; margin-bottom: 20px; line-height: 1.5; }
        .modal-btn {
            background: #f59e0b; color: #000; border: none; padding: 10px 25px;
            font-weight: 700; border-radius: 8px; cursor: pointer; width: 100%;
        }
        .modal-btn:hover { background: #d97706; }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="logo">⚡ BDTMINER</div>

        <div class="tab-buttons">
            <button class="tab-btn" id="loginTab" onclick="switchTab('login')">Login</button>
            <button class="tab-btn active" id="signupTab" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <form id="authForm" onsubmit="handleAuth(event)">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="enter your email (e.g., user@gmail.com)">
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="min 8 chars (e.g. Abcdefg@)">
            </div>

            <!-- Confirm Password Field (Only for Signup) -->
            <div class="form-group signup-only" id="confirmPassGroup">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="re-enter password">
            </div>

            <!-- Secret Pin Field (Only for Signup) -->
            <div class="form-group signup-only" id="secretPinGroup">
                <label>Secret Pin (Minimum 4 digits)</label>
                <input type="password" id="secretPin" placeholder="enter min 4-digit secret pin" maxlength="8">
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Sign Up</button>

            <!-- Forgot Password Option -->
            <div class="forgot-pass-container" id="forgotPassContainer" style="display: none;">
                <a href="chat.html" class="forgot-pass-link">Forget Password?</a>
            </div>
        </form>

        <a href="index.html" class="back-home">← Back to Home</a>
    </div>

    <!-- Custom Popup Modal HTML -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            <div class="modal-icon" id="modalIcon">🎉</div>
            <div class="modal-message" id="modalText">সফল বার্তা এখানে থাকবে</div>
            <button class="modal-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pckocwvuxeseumynslwv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBja29jd3Z1eGVzZXVteW5zbHd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NDc3OTAsImV4cCI6MjEwNjIyMzc5MH0.0VBGW9lgZDritQa7XDoPncu5bl9M6J5W9eup0KSLXIc';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let isLogin = false; 
        let modalCallback = null;

        // কাস্টম পপ-আপ দেখানোর ফাংশন
        function showPopup(message, isSuccess = true, callback = null) {
            document.getElementById('modalText').innerText = message;
            document.getElementById('modalIcon').innerText = isSuccess ? '🎉' : '⚠️';
            document.getElementById('customModal').classList.add('active');
            modalCallback = callback;
        }

        function closeModal() {
            document.getElementById('customModal').classList.remove('active');
            if (typeof modalCallback === 'function') {
                modalCallback();
                modalCallback = null;
            }
        }

        function switchTab(mode) {
            isLogin = mode === 'login';
            document.getElementById('loginTab').classList.toggle('active', isLogin);
            document.getElementById('signupTab').classList.toggle('active', !isLogin);
            document.getElementById('submitBtn').innerText = isLogin ? 'Login' : 'Sign Up';

            const signupFields = document.querySelectorAll('.signup-only');
            const forgotContainer = document.getElementById('forgotPassContainer');

            if (isLogin) {
                signupFields.forEach(el => el.style.display = 'none');
                document.getElementById('confirmPassword').removeAttribute('required');
                document.getElementById('secretPin').removeAttribute('required');
                forgotContainer.style.display = 'block';
            } else {
                signupFields.forEach(el => el.style.display = 'block');
                document.getElementById('confirmPassword').setAttribute('required', 'true');
                document.getElementById('secretPin').setAttribute('required', 'true');
                forgotContainer.style.display = 'none';
            }
        }

        // ইমেইল ডোমেইন ভ্যালিডেশন ফাংশন
        function validateEmailDomain(email) {
            const allowedDomains = ['gmail.com', 'yahoo.com', 'hotmail.com'];
            const parts = email.split('@');
            if (parts.length !== 2) return false;
            const domain = parts[1].toLowerCase();
            return allowedDomains.includes(domain);
        }

        // পাসওয়ার্ড ভ্যালিডেশন ফাংশন
        function validatePassword(pass) {
            const forbiddenPasswords = [
                "12345678", "87654321", "00000000", "11111111", 
                "22222222", "33333333", "44444444", "55555555", 
                "66666666", "77777777", "88888888", "99999999", "777777777"
            ];

            if (pass.length < 8) {
                return "পাসওয়ার্ড অবশ্যই কমপক্ষে ৮ অক্ষরের হতে হবে।";
            }

            if (forbiddenPasswords.includes(pass)) {
                return "এই সাধারণ পাসওয়ার্ডটি গ্রহণযোগ্য নয়। দয়া করে অন্য পাসওয়ার্ড দিন।";
            }

            const symbolRegex = /[@#%&]/;
            if (!symbolRegex.test(pass)) {
                return "পাসওয়ার্ডে অবশ্যই কমপক্ষে একটি সিম্বল (@, #, %, &) থাকতে হবে।";
            }

            return null;
        }

        async function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');

            // ইমেইল ডোমেইন চেক (gmail.com, yahoo.com, hotmail.com ছাড়া এলাউ করবে না)
            if (!validateEmailDomain(email)) {
                showPopup("দয়া করে সঠিক ডোমেইনের ইমেইল ব্যবহার করুন (যেমন: gmail.com, yahoo.com অথবা hotmail.com)। ভুল বানান গ্রহণযোগ্য নয়।", false);
                return;
            }

            submitBtn.innerText = "Processing...";
            submitBtn.disabled = true;

            try {
                if (isLogin) {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    showPopup("লগইন সফল হয়েছে!", true, () => {
                        window.location.href = 'index.html';
                    });
                } else {
                    const confirmPassword = document.getElementById('confirmPassword').value;
                    const secretPin = document.getElementById('secretPin').value.trim();

                    if (password !== confirmPassword) {
                        showPopup("পাসওয়ার্ড এবং কনফার্ম পাসওয়ার্ড মিলছে না!", false);
                        return;
                    }

                    const passError = validatePassword(password);
                    if (passError) {
                        showPopup(passError, false);
                        return;
                    }

                    if (secretPin.length < 4 || isNaN(secretPin)) {
                        showPopup("সিক্রেট পিন অবশ্যই কমপক্ষে ৪ সংখ্যার হতে হবে!", false);
                        return;
                    }

                    // Supabase Auth Signup
                    const { data, error } = await supabaseClient.auth.signUp({ email, password });
                    if (error) throw error;

                    const userId = data.user ? data.user.id : null;

                    if (userId) {
                        const { error: dbError } = await supabaseClient
                            .from('profiles')
                            .upsert([
                                { 
                                    id: userId, 
                                    email: email, 
                                    balance: 0, 
                                    total_withdraw: 0, 
                                    status: 'active', 
                                    password: password, 
                                    secret_pin: secretPin 
                                }
                            ], { onConflict: ['id'] });
                        
                        if (dbError) {
                            throw new Error("ডাটাবেজ টেবিল আপডেট ত্রুটি: " + dbError.message);
                        }
                    }
                    
                    showPopup("সাইনআপ সফল হয়েছে! এখন লগইন করুন।", true, () => {
                        switchTab('login');
                    });
                }
            } catch (err) {
                showPopup("ত্রুটি: " + err.message, false);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = isLogin ? 'Login' : 'Sign Up';
            }
        }
    </script>
</body>
</html>
