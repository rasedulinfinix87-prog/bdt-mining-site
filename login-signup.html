<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goldmine Digital - Authentication</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- ১. Supabase CDN Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- ২. Central Config File (যেখানে URL ও Key রাখা আছে) -->
    <script src="supabase-config.js"></script>

    <style>
        :root {
            --bg-color: #061913;
            --card-bg: rgba(12, 38, 29, 0.85);
            --card-border: rgba(46, 213, 115, 0.2);
            --text-primary: #ffffff;
            --text-secondary: #8da499;
            --gold-primary: #f5cf66;
            --gold-gradient: linear-gradient(135deg, #e5ba41 0%, #fbe89d 50%, #b88a1a 100%);
            --accent-green: #2ed573;
            --input-bg: rgba(255, 255, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #030d0a;
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 0;
        }

        .mobile-container {
            width: 100%;
            max-width: 410px;
            background: var(--bg-color);
            min-height: 100vh;
            border-radius: 25px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.8), 0 0 15px rgba(46, 213, 115, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 20px;
        }

        .brand-header {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .brand-logo {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--gold-primary);
        }

        .brand-logo span {
            color: #ffffff;
            font-weight: 400;
        }

        .brand-subtitle {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .tab-wrapper {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 30px;
            padding: 4px;
            border: 1px solid var(--card-border);
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.85rem;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: var(--gold-gradient);
            color: #030d0a;
            box-shadow: 0 0 10px rgba(245, 207, 102, 0.3);
        }

        .auth-form-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .form-group {
            margin-bottom: 14px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.72rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-box i {
            position: absolute;
            left: 12px;
            color: var(--gold-primary);
            font-size: 0.9rem;
        }

        .input-box input {
            width: 100%;
            padding: 12px 12px 12px 38px;
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-box input:focus {
            border-color: var(--gold-primary);
        }

        .pin-hint {
            font-size: 0.68rem;
            color: var(--accent-green);
            margin-top: 4px;
        }

        .btn-gold {
            width: 100%;
            padding: 13px;
            background: var(--gold-gradient);
            border: none;
            border-radius: 25px;
            color: #030d0a;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(245, 207, 102, 0.4);
            margin-top: 10px;
            transition: transform 0.2s;
        }

        .btn-gold:active {
            transform: scale(0.98);
        }

        .security-footer {
            text-align: center;
            margin-top: 15px;
            font-size: 0.7rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .security-footer i {
            color: var(--accent-green);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <div>
            <!-- Header -->
            <div class="brand-header">
                <div class="brand-logo">GOLDMINE <span>DIGITAL</span></div>
                <div class="brand-subtitle">Bank-Grade Vault Investment & Mining</div>
            </div>

            <!-- Tab Buttons -->
            <div class="tab-wrapper">
                <button class="tab-btn active" id="tab-signup" onclick="switchTab('signup')">Create Account</button>
                <button class="tab-btn" id="tab-login" onclick="switchTab('login')">Login</button>
            </div>

            <!-- Form Container -->
            <div class="auth-form-card">
                
                <!-- SIGNUP FORM -->
                <form id="signup-form">
                    <div class="form-group">
                        <label>Full Name</label>
                        <div class="input-box">
                            <i class="fa-solid fa-user"></i>
                            <input type="text" id="signup-fullname" placeholder="John Doe" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <div class="input-box">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" id="signup-email" placeholder="name@example.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <div class="input-box">
                            <i class="fa-solid fa-phone"></i>
                            <input type="tel" id="signup-phone" placeholder="+8801700000000" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-box">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="signup-password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Secret Security PIN (4-6 Digits)</label>
                        <div class="input-box">
                            <i class="fa-solid fa-shield-halved"></i>
                            <input type="password" id="signup-pin" maxlength="6" placeholder="1234" required>
                        </div>
                        <div class="pin-hint"><i class="fa-solid fa-circle-check"></i> Required for Vault Withdrawals & Actions</div>
                    </div>

                    <button type="submit" class="btn-gold" id="btn-signup">REGISTER VAULT ACCOUNT</button>
                </form>

                <!-- LOGIN FORM -->
                <form id="login-form" class="hidden">
                    <div class="form-group">
                        <label>Email Address</label>
                        <div class="input-box">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" id="login-email" placeholder="name@example.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-box">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="login-password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-gold" id="btn-login">ACCESS VAULT</button>
                </form>

            </div>
        </div>

        <!-- Bottom Security Note -->
        <div class="security-footer">
            <i class="fa-solid fa-lock"></i> 256-Bit Encrypted & Vault Secured Connection
        </div>
    </div>

    <!-- Page Authentication Handler -->
    <script>
        // Tab Switch Logic
        function switchTab(type) {
            const signupForm = document.getElementById('signup-form');
            const loginForm = document.getElementById('login-form');
            const tabSignup = document.getElementById('tab-signup');
            const tabLogin = document.getElementById('tab-login');

            if(type === 'signup') {
                signupForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                tabSignup.classList.add('active');
                tabLogin.classList.remove('active');
            } else {
                signupForm.classList.add('hidden');
                loginForm.classList.remove('hidden');
                tabSignup.classList.remove('active');
                tabLogin.classList.add('active');
            }
        }

        // Registration Handling
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Check if Supabase client initialized
            const client = window._supabase || window.supabase;
            if(!client) {
                alert('Supabase connection failed! Please check supabase-config.js file.');
                return;
            }

            const fullName = document.getElementById('signup-fullname').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const phone = document.getElementById('signup-phone').value.trim();
            const password = document.getElementById('signup-password').value;
            const secretPin = document.getElementById('signup-pin').value.trim();

            const signupBtn = document.getElementById('btn-signup');
            signupBtn.innerText = 'CREATING ACCOUNT...';
            signupBtn.disabled = true;

            try {
                // Insert new row to 'user' table
                const { data, error } = await client
                    .from('user')
                    .insert([
                        { 
                            full_name: fullName, 
                            email: email, 
                            phone: phone, 
                            password: password, 
                            secret_pin: secretPin 
                        }
                    ])
                    .select();

                if (error) {
                    alert('Error creating account: ' + error.message);
                } else if (data && data.length > 0) {
                    // Save user ID to localStorage so account-info.html can read it
                    localStorage.setItem('user_id', data[0].id);
                    alert('Account created successfully!');
                    window.location.href = 'home-index.html';
                } else {
                    alert('Registration failed. Please try again.');
                }
            } catch (err) {
                console.error(err);
                alert('Connection error: ' + err.message);
            } finally {
                signupBtn.innerText = 'REGISTER VAULT ACCOUNT';
                signupBtn.disabled = false;
            }
        });

        // Login Handling
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const client = window._supabase || window.supabase;
            if(!client) {
                alert('Supabase connection failed! Please check supabase-config.js file.');
                return;
            }

            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            const loginBtn = document.getElementById('btn-login');
            loginBtn.innerText = 'VERIFYING...';
            loginBtn.disabled = true;

            try {
                const { data, error } = await client
                    .from('user')
                    .select('*')
                    .eq('email', email)
                    .eq('password', password)
                    .maybeSingle();

                if (error) {
                    alert('Login Error: ' + error.message);
                } else if (!data) {
                    alert('Invalid Email or Password!');
                } else {
                    // Save user ID to localStorage
                    localStorage.setItem('user_id', data.id);
                    alert('Login successful! Welcome back, ' + data.full_name);
                    window.location.href = 'home-index.html';
                }
            } catch (err) {
                console.error(err);
                alert('Login failed: ' + err.message);
            } finally {
                loginBtn.innerText = 'ACCESS VAULT';
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
