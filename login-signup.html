<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goldmine Digital - Authentication</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: #061913;
            --card-bg: rgba(12, 38, 29, 0.85);
            --card-border: rgba(46, 213, 115, 0.2);
            --text-primary: #ffffff;
            --text-secondary: #8da499;
            --gold-primary: #f5cf66;
            --gold-gradient: linear-gradient(135deg, #e5ba41 0%, #fbe89d 50%, #b88a1a 100%);
            --accent-green: #2ed573;
            --input-bg: rgba(255, 255, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #030d0a;
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 0;
        }

        .mobile-container {
            width: 100%;
            max-width: 410px;
            background: var(--bg-color);
            min-height: 100vh;
            border-radius: 25px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.8), 0 0 15px rgba(46, 213, 115, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 20px;
        }

        .brand-header {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .brand-logo {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--gold-primary);
        }

        .brand-logo span {
            color: #ffffff;
            font-weight: 400;
        }

        .brand-subtitle {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .tab-wrapper {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 30px;
            padding: 4px;
            border: 1px solid var(--card-border);
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.85rem;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: var(--gold-gradient);
            color: #030d0a;
            box-shadow: 0 0 10px rgba(245, 207, 102, 0.3);
        }

        .auth-form-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .form-group {
            margin-bottom: 14px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.72rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-box i {
            position: absolute;
            left: 12px;
            color: var(--gold-primary);
            font-size: 0.9rem;
        }

        .input-box input {
            width: 100%;
            padding: 12px 12px 12px 38px;
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-box input:focus {
            border-color: var(--gold-primary);
        }

        .pin-hint {
            font-size: 0.68rem;
            color: var(--accent-green);
            margin-top: 4px;
        }

        .forgot-password-link {
            text-align: right;
            margin-top: -6px;
            margin-bottom: 12px;
        }

        .forgot-password-link a {
            font-size: 0.75rem;
            color: var(--gold-primary);
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .forgot-password-link a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .btn-gold {
            width: 100%;
            padding: 13px;
            background: var(--gold-gradient);
            border: none;
            border-radius: 25px;
            color: #030d0a;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(245, 207, 102, 0.4);
            margin-top: 10px;
            transition: transform 0.2s;
        }

        .btn-gold:active {
            transform: scale(0.98);
        }

        .security-footer {
            text-align: center;
            margin-top: 15px;
            font-size: 0.7rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .security-footer i {
            color: var(--accent-green);
        }

        .hidden {
            display: none;
        }

        /* --- Custom Popup Modal Overlay with Animation --- */
        .auth-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 13, 10, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }

        .auth-modal-card {
            background: linear-gradient(135deg, rgba(12, 38, 29, 0.95) 0%, #030d0a 100%);
            border: 1px solid var(--gold-primary);
            border-radius: 20px;
            padding: 28px 22px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 25px rgba(245, 207, 102, 0.2);
            animation: modalFadeIn 0.3s ease-out;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .auth-modal-icon {
            width: 60px;
            height: 60px;
            background: rgba(245, 207, 102, 0.15);
            border: 1px solid var(--gold-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px auto;
            color: var(--gold-primary);
            font-size: 1.6rem;
            box-shadow: 0 0 15px rgba(245, 207, 102, 0.3);
        }

        .auth-modal-text {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-primary);
            margin-bottom: 22px;
            font-weight: 400;
        }

        .btn-modal-action {
            display: inline-block;
            width: 100%;
            padding: 14px 20px;
            background: var(--gold-gradient);
            color: #030d0a;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(245, 207, 102, 0.3);
            transition: all 0.3s ease;
        }

        .btn-modal-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 207, 102, 0.4);
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <div>
            <!-- Header -->
            <div class="brand-header">
                <div class="brand-logo">GOLDMINE <span>DIGITAL</span></div>
                <div class="brand-subtitle">Bank-Grade Vault Investment & Mining</div>
            </div>

            <!-- Tab Buttons -->
            <div class="tab-wrapper">
                <button class="tab-btn active" id="tab-signup" onclick="switchTab('signup')">Create Account</button>
                <button class="tab-btn" id="tab-login" onclick="switchTab('login')">Login</button>
            </div>

            <!-- Form Container -->
            <div class="auth-form-card">
                
                <!-- SIGNUP FORM -->
                <form id="signup-form">
                    <div class="form-group">
                        <label>Full Name</label>
                        <div class="input-box">
                            <i class="fa-solid fa-user"></i>
                            <input type="text" id="signup-fullname" placeholder="John Doe" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <div class="input-box">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" id="signup-email" placeholder="name@example.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <div class="input-box">
                            <i class="fa-solid fa-phone"></i>
                            <input type="tel" id="signup-phone" placeholder="01700000000" maxlength="11" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Password (Min 8 Characters)</label>
                        <div class="input-box">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="signup-password" placeholder="••••••••" minlength="8" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Confirm Password</label>
                        <div class="input-box">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="signup-confirm-password" placeholder="••••••••" minlength="8" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Secret Security PIN (4 Digits)</label>
                        <div class="input-box">
                            <i class="fa-solid fa-shield-halved"></i>
                            <input type="password" id="signup-pin" maxlength="4" minlength="4" placeholder="****" required>
                        </div>
                        <div class="pin-hint"><i class="fa-solid fa-circle-check"></i> Required for Vault Withdrawals & Actions</div>
                    </div>

                    <button type="submit" class="btn-gold" id="btn-signup">REGISTER VAULT ACCOUNT</button>
                </form>

                <!-- LOGIN FORM -->
                <form id="login-form" class="hidden">
                    <div class="form-group">
                        <label>Email Address</label>
                        <div class="input-box">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" id="login-email" placeholder="name@example.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-box">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="login-password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="forgot-password-link">
                        <a href="reset-password.html">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-gold" id="btn-login">ACCESS VAULT</button>
                </form>

            </div>
        </div>

        <!-- Bottom Security Note -->
        <div class="security-footer">
            <i class="fa-solid fa-lock"></i> 256-Bit Encrypted & Vault Secured Connection
        </div>
    </div>

    <!-- Custom Popup Modal -->
    <div class="auth-modal-overlay" id="customModal">
        <div class="auth-modal-card">
            <div class="auth-modal-icon" id="modalIcon">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <p class="auth-modal-text" id="modalMessage">Message goes here</p>
            <button class="btn-modal-action" id="modalActionBtn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <!-- Supabase Authentication Script -->
    <script>
        const SUPABASE_URL = "https://pckocwvuxeseumynslwv.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBja29jd3Z1eGVzZXVteW5zbHd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NDc3OTAsImV4cCI6MjEwNjIyMzc5MH0.0VBGW9lgZDritQa7XDoPncu5bl9M6J5W9eup0KSLXIc";

        let supabaseClient = null;
        let modalCallback = null;

        // Common weak passwords list
        const commonPasswords = [
            "12345678", "123456789", "1234567890", "password", "password123",
            "012345678", "11111111", "00000000", "qwertyuiop", "admin1234",
            "12344321", "87654321"
        ];

        function getSupabaseClient() {
            if (!supabaseClient && window.supabase && typeof window.supabase.createClient === 'function') {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
            return supabaseClient;
        }

        // Custom Popup Modal Control
        function showPopup(message, iconClass = 'fa-solid fa-circle-check', callback = null) {
            const modal = document.getElementById('customModal');
            const msgEl = document.getElementById('modalMessage');
            const iconEl = document.getElementById('modalIcon');
            
            msgEl.innerText = message;
            iconEl.innerHTML = `<i class="${iconClass}"></i>`;
            modal.style.display = 'flex';
            modalCallback = callback;
        }

        function closeModal() {
            const modal = document.getElementById('customModal');
            modal.style.display = 'none';
            if (typeof modalCallback === 'function') {
                modalCallback();
                modalCallback = null;
            }
        }

        // Tab Switch Logic
        function switchTab(type) {
            const signupForm = document.getElementById('signup-form');
            const loginForm = document.getElementById('login-form');
            const tabSignup = document.getElementById('tab-signup');
            const tabLogin = document.getElementById('tab-login');

            if(type === 'signup') {
                signupForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                tabSignup.classList.add('active');
                tabLogin.classList.remove('active');
            } else {
                signupForm.classList.add('hidden');
                loginForm.classList.remove('hidden');
                tabSignup.classList.remove('active');
                tabLogin.classList.add('active');
            }
        }

        // Registration Handling
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const client = getSupabaseClient();
            if(!client) {
                showPopup('Supabase connection loading... Please try again in 3 seconds.', 'fa-solid fa-triangle-exclamation');
                return;
            }

            const fullName = document.getElementById('signup-fullname').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const phone = document.getElementById('signup-phone').value.trim();
            const password = document.getElementById('signup-password').value;
            const confirmPassword = document.getElementById('signup-confirm-password').value;
            const secretPin = document.getElementById('signup-pin').value.trim();

            // Phone Number Validation (Must start with '01' and be exactly 11 digits)
            const phoneRegex = /^01[3-9]\d{8}$/;
            if (!phoneRegex.test(phone) || phone.length !== 11) {
                showPopup('Please enter a valid 11-digit Bangladeshi phone number starting with 01.', 'fa-solid fa-triangle-exclamation');
                return;
            }

            // Password length validation (Min 8 characters)
            if (password.length < 8) {
                showPopup('Password must be at least 8 characters long.', 'fa-solid fa-triangle-exclamation');
                return;
            }

            // Common Password Check
            if (commonPasswords.includes(password.toLowerCase())) {
                showPopup('This password is too common or easy to guess. Please choose a stronger password.', 'fa-solid fa-triangle-exclamation');
                return;
            }

            // Confirm password match validation
            if (password !== confirmPassword) {
                showPopup('Password and Confirm Password do not match!', 'fa-solid fa-triangle-exclamation');
                return;
            }

            // Secret Pin 4 digit validation
            const pinRegex = /^\d{4}$/;
            if (!pinRegex.test(secretPin)) {
                showPopup('Secret Security PIN must be exactly 4 digits.', 'fa-solid fa-triangle-exclamation');
                return;
            }

            const signupBtn = document.getElementById('btn-signup');
            signupBtn.innerText = 'CREATING ACCOUNT...';
            signupBtn.disabled = true;

            try {
                // 1. Supabase Auth Sign Up
                const { data: authData, error: authError } = await client.auth.signUp({
                    email: email,
                    password: password
                });

                if (authError) {
                    showPopup('Registration Failed: ' + authError.message, 'fa-solid fa-triangle-exclamation');
                    return;
                }

                if (!authData.user) {
                    showPopup('User creation failed.', 'fa-solid fa-triangle-exclamation');
                    return;
                }

                const userId = authData.user.id;

                // 2. Custom User Table Data Insert
                const { error: tableError } = await client
                    .from('user')
                    .insert([
                        { 
                            id: userId,
                            full_name: fullName, 
                            email: email, 
                            phone: phone, 
                            password: password, 
                            secret_pin: secretPin 
                        }
                    ]);

                if (tableError) {
                    console.error("Table insert error:", tableError);
                }

                // LocalStorage-এ ID সেভ
                localStorage.setItem('user_id', userId);

                // Account Created Successful Popup Animation
                showPopup('Account created successfully!', 'fa-solid fa-circle-check', () => {
                    window.location.href = 'index.html';
                });

            } catch (err) {
                console.error(err);
                showPopup('Error: ' + err.message, 'fa-solid fa-triangle-exclamation');
            } finally {
                signupBtn.innerText = 'REGISTER VAULT ACCOUNT';
                signupBtn.disabled = false;
            }
        });

        // Login Handling
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const client = getSupabaseClient();
            if(!client) {
                showPopup('Supabase connection loading... Please try again in 3 seconds.', 'fa-solid fa-triangle-exclamation');
                return;
            }

            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            const loginBtn = document.getElementById('btn-login');
            loginBtn.innerText = 'VERIFYING...';
            loginBtn.disabled = true;

            try {
                const { data: authData, error: authError } = await client.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (authError) {
                    showPopup('Login Failed: ' + authError.message, 'fa-solid fa-triangle-exclamation');
                    return;
                }

                if (authData && authData.user) {
                    localStorage.setItem('user_id', authData.user.id);
                    // Login Successful Popup Animation
                    showPopup('Login successful! Welcome back.', 'fa-solid fa-circle-check', () => {
                        window.location.href = 'index.html';
                    });
                } else {
                    showPopup('Login failed. Please check your credentials.', 'fa-solid fa-triangle-exclamation');
                }

            } catch (err) {
                console.error(err);
                showPopup('Error: ' + err.message, 'fa-solid fa-triangle-exclamation');
            } finally {
                loginBtn.innerText = 'ACCESS VAULT';
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
