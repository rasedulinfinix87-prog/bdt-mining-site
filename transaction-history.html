<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Transaction History - Goldmine Digital</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Your Supabase Config -->
    <script src="supabase-config.js"></script>

    <style>
        :root {
            --bg-color: #061913;
            --dark-bg: #030d0a;
            --card-bg: rgba(12, 38, 29, 0.85);
            --card-border: rgba(46, 213, 115, 0.2);
            --text-primary: #ffffff;
            --text-secondary: #8da499;
            --gold-primary: #f5cf66;
            --gold-gradient: linear-gradient(135deg, #e5ba41 0%, #fbe89d 50%, #b88a1a 100%);
            --accent-green: #2ed573;
            --accent-red: #ff4757;
            --accent-yellow: #ffa502;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: -webkit-fill-available;
        }

        html {
            height: -webkit-fill-available;
        }

        .mobile-container {
            width: 100%;
            max-width: 410px;
            height: 100vh;
            height: 100dvh;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            position: relative;
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        /* Top Header */
        header {
            padding: 20px 18px 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(3, 13, 10, 0.6);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 10;
        }

        .back-btn {
            color: var(--text-primary);
            font-size: 1.1rem;
            text-decoration: none;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .page-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--gold-primary);
            letter-spacing: 0.5px;
        }

        /* Filter Tabs */
        .filter-container {
            display: flex;
            gap: 8px;
            padding: 14px 16px;
            background: var(--dark-bg);
        }

        .filter-btn {
            flex: 1;
            padding: 8px 0;
            background: rgba(12, 38, 29, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn.active {
            background: var(--gold-gradient);
            color: #030d0a;
            border-color: var(--gold-primary);
            font-weight: 700;
            box-shadow: 0 0 12px rgba(245, 207, 102, 0.3);
        }

        /* Transaction List Wrapper */
        .transaction-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 16px 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .transaction-list::-webkit-scrollbar {
            width: 4px;
        }
        .transaction-list::-webkit-scrollbar-thumb {
            background: rgba(245, 207, 102, 0.2);
            border-radius: 4px;
        }

        /* Transaction Item Card */
        .trx-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .trx-card:active {
            transform: scale(0.98);
            border-color: var(--gold-primary);
        }

        .trx-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .trx-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .trx-icon.deposit {
            background: rgba(46, 213, 115, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(46, 213, 115, 0.3);
        }

        .trx-icon.withdraw {
            background: rgba(255, 71, 87, 0.15);
            color: var(--accent-red);
            border: 1px solid rgba(255, 71, 87, 0.3);
        }

        .trx-details h4 {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            text-transform: capitalize;
        }

        .trx-details p {
            font-size: 0.72rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .trx-right {
            text-align: right;
        }

        .trx-amount {
            font-size: 0.95rem;
            font-weight: 700;
        }

        .trx-amount.deposit {
            color: var(--accent-green);
        }

        .trx-amount.withdraw {
            color: var(--accent-red);
        }

        /* Status Badges */
        .status-badge {
            display: inline-block;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 10px;
            margin-top: 4px;
            text-transform: capitalize;
        }

        .status-badge.approved {
            background: rgba(46, 213, 115, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(46, 213, 115, 0.3);
        }

        .status-badge.pending {
            background: rgba(255, 165, 2, 0.15);
            color: var(--accent-yellow);
            border: 1px solid rgba(255, 165, 2, 0.3);
        }

        .status-badge.rejected {
            background: rgba(255, 71, 87, 0.15);
            color: var(--accent-red);
            border: 1px solid rgba(255, 71, 87, 0.3);
        }

        /* Detail Modal Popup */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 13, 10, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 99;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            width: 100%;
            background: #08221a;
            border-top: 1px solid var(--gold-primary);
            border-radius: 24px 24px 0 0;
            padding: 24px 20px 30px 20px;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .modal-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--gold-primary);
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: var(--text-primary);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
        }

        .modal-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.82rem;
        }

        .modal-row span {
            color: var(--text-secondary);
        }

        .modal-row strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* Feedback Box */
        .feedback-box {
            margin-top: 12px;
            padding: 10px 12px;
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid rgba(255, 71, 87, 0.25);
            border-radius: 10px;
            font-size: 0.8rem;
            color: #ff6b81;
            display: none;
        }

        .feedback-box.active {
            display: block;
        }

        .feedback-title {
            font-weight: 600;
            font-size: 0.72rem;
            text-transform: uppercase;
            margin-bottom: 3px;
            letter-spacing: 0.5px;
        }

        .empty-msg {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
            padding: 40px 10px;
        }

        /* Bottom Navigation Holder */
        #bottom-nav-container {
            width: 100%;
            flex-shrink: 0;
        }

        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 0 18px 0;
            background: #061913;
            border-top: 1px solid rgba(46, 213, 115, 0.25);
            width: 100%;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #8da499;
            font-size: 0.72rem;
            text-decoration: none;
        }

        .nav-item:hover, .nav-item.active {
            color: #f5cf66;
        }

        .nav-item i {
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- Top Header -->
        <header>
            <a href="javascript:history.back()" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div class="page-title">Transaction History</div>
            <div style="width: 36px;"></div>
        </header>

        <!-- Filter Tabs -->
        <div class="filter-container">
            <button class="filter-btn active" onclick="filterTrx('all', this)">All</button>
            <button class="filter-btn" onclick="filterTrx('deposit', this)">Deposit</button>
            <button class="filter-btn" onclick="filterTrx('withdraw', this)">Withdraw</button>
        </div>

        <!-- Transaction List -->
        <div class="transaction-list" id="trx-container">
            <div class="empty-msg"><i class="fa-solid fa-spinner fa-spin"></i> Loading transactions...</div>
        </div>

        <!-- Detail Modal Popup -->
        <div class="modal-overlay" id="detailModal">
            <div class="modal-card">
                <div class="modal-header">
                    <div class="modal-title">Transaction Details</div>
                    <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="modal-row">
                    <span>Transaction ID</span>
                    <strong id="m-trxid">-</strong>
                </div>
                <div class="modal-row">
                    <span>Type</span>
                    <strong id="m-type">-</strong>
                </div>
                <div class="modal-row">
                    <span>Method</span>
                    <strong id="m-method">-</strong>
                </div>
                <div class="modal-row">
                    <span>Account / Wallet</span>
                    <strong id="m-account">-</strong>
                </div>
                <div class="modal-row">
                    <span>Amount</span>
                    <strong id="m-amount">-</strong>
                </div>
                <div class="modal-row">
                    <span>Charge / Fee</span>
                    <strong id="m-charge" style="color: var(--accent-red);">-</strong>
                </div>
                <div class="modal-row">
                    <span>Net Amount</span>
                    <strong id="m-net" style="color: var(--gold-primary);">-</strong>
                </div>
                <div class="modal-row">
                    <span>Status</span>
                    <strong id="m-status">-</strong>
                </div>
                <div class="modal-row">
                    <span>Date & Time</span>
                    <strong id="m-date">-</strong>
                </div>

                <!-- Admin Feedback Box -->
                <div class="feedback-box" id="feedbackBox">
                    <div class="feedback-title"><i class="fa-solid fa-circle-info"></i> Admin Remark</div>
                    <div id="m-feedback"></div>
                </div>
            </div>
        </div>

        <!-- Bottom Nav Container Placeholder -->
        <div id="bottom-nav-container">
            <nav class="bottom-nav">
                <a href="home-index.html" class="nav-item">
                    <i class="fa-solid fa-house"></i>
                    <span>Home</span>
                </a>
                <a href="portfolio.html" class="nav-item">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>Portfolio</span>
                </a>
                <a href="wallet.html" class="nav-item">
                    <i class="fa-solid fa-wallet"></i>
                    <span>Wallet</span>
                </a>
                <a href="transaction-history.html" class="nav-item active">
                    <i class="fa-solid fa-receipt"></i>
                    <span>History</span>
                </a>
            </nav>
        </div>
    </div>

    <script>
        // Bottom Nav Dynamic Loader
        fetch('bottom.html?v=' + new Date().getTime())
            .then(response => { if(response.ok) return response.text(); })
            .then(data => { if(data) document.getElementById('bottom-nav-container').innerHTML = data; })
            .catch(error => console.log('Using fallback nav'));

        let allTransactions = [];

        // Supabase Data Fetch Logic
        async function fetchTransactions() {
            const container = document.getElementById('trx-container');

            // Wait until Supabase is ready
            if (!window._supabase) {
                setTimeout(fetchTransactions, 300);
                return;
            }

            try {
                // Get current user id from localStorage or Session
                const userId = localStorage.getItem('user_id');

                let query = window._supabase
                    .from('transactions')
                    .select('*')
                    .order('created_at', { ascending: false });

                // If user_id is saved in localStorage, filter by user
                if (userId) {
                    query = query.eq('user_id', userId);
                }

                const { data, error } = await query;

                if (error) {
                    console.error("Supabase Error:", error);
                    container.innerHTML = `<div class="empty-msg" style="color: var(--accent-red);">Error loading transactions!</div>`;
                    return;
                }

                if (!data || data.length === 0) {
                    container.innerHTML = `<div class="empty-msg">No transactions found.</div>`;
                    return;
                }

                allTransactions = data;
                renderTransactions(allTransactions);

            } catch (err) {
                console.error("Fetch Error:", err);
                container.innerHTML = `<div class="empty-msg" style="color: var(--accent-red);">Failed to fetch data.</div>`;
            }
        }

        // Render Cards into UI
        function renderTransactions(transactions) {
            const container = document.getElementById('trx-container');
            container.innerHTML = '';

            if(transactions.length === 0) {
                container.innerHTML = `<div class="empty-msg">No transactions found for this filter.</div>`;
                return;
            }

            transactions.forEach(item => {
                const isDeposit = (item.type || '').toLowerCase() === 'deposit';
                const typeClass = isDeposit ? 'deposit' : 'withdraw';
                const iconClass = isDeposit ? 'fa-arrow-down-left' : 'fa-arrow-up-right';
                const sign = isDeposit ? '+' : '-';
                const formattedDate = item.created_at ? new Date(item.created_at).toLocaleString() : 'N/A';
                
                const amountVal = parseFloat(item.amount || 0).toFixed(2);
                const chargeVal = parseFloat(item.charge || 0).toFixed(2);
                const netVal = parseFloat(item.net_amount || (amountVal - chargeVal)).toFixed(2);

                const cardHtml = `
                    <div class="trx-card ${typeClass}" onclick="showDetails('${item.id}')">
                        <div class="trx-left">
                            <div class="trx-icon ${typeClass}">
                                <i class="fa-solid ${iconClass}"></i>
                            </div>
                            <div class="trx-details">
                                <h4>${item.type || 'Transaction'} (${item.method || 'N/A'})</h4>
                                <p>${formattedDate}</p>
                            </div>
                        </div>
                        <div class="trx-right">
                            <div class="trx-amount ${typeClass}">${sign}$${amountVal}</div>
                            <span class="status-badge ${(item.status || 'pending').toLowerCase()}">${item.status || 'Pending'}</span>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        // Open Modal with selected item details
        function showDetails(trxId) {
            const item = allTransactions.find(t => t.id === trxId);
            if (!item) return;

            const isDeposit = (item.type || '').toLowerCase() === 'deposit';
            const formattedDate = item.created_at ? new Date(item.created_at).toLocaleString() : 'N/A';

            document.getElementById('m-trxid').innerText = item.trx_id || item.id;
            document.getElementById('m-type').innerText = (item.type || '-').toUpperCase();
            document.getElementById('m-amount').innerText = `$${parseFloat(item.amount || 0).toFixed(2)}`;
            document.getElementById('m-charge').innerText = `$${parseFloat(item.charge || 0).toFixed(2)}`;
            document.getElementById('m-net').innerText = `$${parseFloat(item.net_amount || 0).toFixed(2)}`;
            document.getElementById('m-method').innerText = item.method || 'N/A';
            document.getElementById('m-account').innerText = item.account_number || 'N/A';
            document.getElementById('m-status').innerText = (item.status || 'pending').toUpperCase();
            document.getElementById('m-date').innerText = formattedDate;

            // Admin Feedback
            const feedbackBox = document.getElementById('feedbackBox');
            if (item.admin_feedback && item.admin_feedback.trim() !== '') {
                document.getElementById('m-feedback').innerText = item.admin_feedback;
                feedbackBox.classList.add('active');
            } else {
                feedbackBox.classList.remove('active');
            }

            document.getElementById('detailModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('active');
        }

        // Filter Buttons Function
        function filterTrx(type, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (type === 'all') {
                renderTransactions(allTransactions);
            } else {
                const filtered = allTransactions.filter(t => (t.type || '').toLowerCase() === type);
                renderTransactions(filtered);
            }
        }

        // Execute Fetch on Page Load
        window.addEventListener('DOMContentLoaded', fetchTransactions);
    </script>
</body>
</html>
