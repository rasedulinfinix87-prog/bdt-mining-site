<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Support - BDTMINER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #080c14;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Floating Live Chat Button */
        .telegram-chat-btn {
            position: fixed;
            bottom: 25px;
            right: 20px;
            background: linear-gradient(135deg, #2AABEE, #229ED9);
            color: #ffffff;
            padding: 12px 18px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 8px 25px rgba(42, 171, 238, 0.4);
            z-index: 9999;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: pulse 2s infinite;
        }

        .telegram-chat-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(42, 171, 238, 0.6);
        }

        /* Telegram Icon SVG */
        .telegram-icon {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        /* Pulse Glow Animation */
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(42, 171, 238, 0.7);
            }
            70% {
                box-shadow: 0 0 0 12px rgba(42, 171, 238, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(42, 171, 238, 0);
            }
        }
    </style>
</head>
<body>

    <!-- Telegram Live Chat Widget -->
    <a href="https://t.me/your_telegram_username" target="_blank" class="telegram-chat-btn">
        <svg class="telegram-icon" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.69-.52.36-1 .53-1.42.52-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.24.38-.49 1.07-.75 4.19-1.82 6.98-3.02 8.37-3.6 3.98-1.66 4.81-1.95 5.35-1.96.12 0 .38.03.55.17.14.12.18.28.2.45-.02.07-.02.16-.03.22z"/>
        </svg>
        <span>Live Chat</span>
    </a>

</body>
</html>
