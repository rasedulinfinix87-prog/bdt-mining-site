<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Support - BDTMINER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #080c14;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .redirect-box {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #f59e0b;
            margin-bottom: 15px;
        }

        .message {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Floating Live Chat Button */
        .telegram-chat-btn {
            background: linear-gradient(135deg, #2AABEE, #229ED9);
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 8px 25px rgba(42, 171, 238, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: pulse 2s infinite;
            width: 100%;
        }

        .telegram-chat-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(42, 171, 238, 0.6);
        }

        /* Telegram Icon SVG */
        .telegram-icon {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        /* Pulse Glow Animation */
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(42, 171, 238, 0.7);
            }
            70% {
                box-shadow: 0 0 0 12px rgba(42, 171, 238, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(42, 171, 238, 0);
            }
        }
    </style>
</head>
<body>

    <div class="redirect-box">
        <div class="logo">⚡ BDTMINER Support</div>
        <p class="message">Connecting you to our official Telegram support channel automatically...</p>
        
        <!-- Telegram Live Chat Button (আপনার টেলিগ্রাম লিংক এখানে বসান) -->
        <a href="https://t.me/your_telegram_username" target="_blank" class="telegram-chat-btn" id="telegramLink">
            <svg class="telegram-icon" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.69-.52.36-1 .53-1.42.52-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.24.38-.49 1.07-.75 4.19-1.82 6.98-3.02 8.37-3.6 3.98-1.66 4.81-1.95 5.35-1.96.12 0 .38.03.55.17.14.12.18.28.2.45-.02.07-.02.16-.03.22z"/>
            </svg>
            <span>Open Telegram Chat</span>
        </a>
    </div>

    <script>
        // ইউজার এই পেজে আসার সাথে সাথে অটোমেটিক টেলিগ্রাম লিংকে রিডাইরেক্ট বা ওপেন করার স্ক্রিপ্ট
        window.addEventListener('DOMContentLoaded', () => {
            const telegramUrl = "https://t.me/your_telegram_username"; // এখানে আপনার টেলিগ্রাম ইউজারনেম দিন
            
            // ১.৫ সেকেন্ড পর অটোমেটিক টেলিগ্রাম লিংক ওপেন হবে (যাতে ইউজার লোডিং দেখতে পায়)
            setTimeout(() => {
                window.location.href = telegramUrl;
            }, 1500);
        });
    </script>

</body>
</html>
