<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন প্যানেল - ড্যাশবোর্ড</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Top Navigation Bar -->
    <header class="bg-white shadow-md fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-4 py-3">
        <div class="flex items-center space-x-3">
            <!-- Hamburger Menu Button -->
            <button id="menu-btn" class="text-gray-700 focus:outline-none hover:text-blue-600">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
            <span class="text-xl font-bold text-gray-800">অ্যাডমিন প্যানেল</span>
        </div>
        <div id="admin-email" class="text-sm text-gray-600 font-medium"></div>
    </header>

    <!-- Sidebar / Drawer (Hidden by default, toggled via Hamburger) -->
    <div id="sidebar" class="fixed inset-y-0 left-0 transform -translate-x-full transition-transform duration-300 ease-in-out bg-white w-64 shadow-xl z-50 pt-16">
        <div class="p-4">
            <h2 class="text-lg font-semibold text-gray-700 mb-4 border-b pb-2">মেনু</h2>
            <ul class="space-y-2">
                <li>
                    <a href="#" onclick="loadUserList()" class="block px-4 py-2 rounded-lg bg-blue-50 text-blue-600 font-medium">ইউজার লিস্ট</a>
                </li>
                <!-- ভবিষ্যতে অন্যান্য মেনু এখানে যোগ করা যাবে -->
            </ul>
        </div>
    </div>

    <!-- Main Content Area -->
    <main class="pt-20 px-4 md:px-8 max-w-7xl mx-auto">
        <div class="bg-white rounded-lg shadow p-6 mt-4">
            <h1 class="text-2xl font-bold text-gray-800 mb-4">টোটাল ইউজার লিস্ট</h1>
            
            <!-- Loading State -->
            <div id="loading" class="text-center py-6 text-gray-500">লোড হচ্ছে...</div>

            <!-- User Table -->
            <div class="overflow-x-auto hidden" id="table-container">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">নাম</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ইমেইল</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ফোন</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">রোল</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">যোগদানের সময়</th>
                        </tr>
                    </thead>
                    <tbody id="user-table-body" class="bg-white divide-y divide-gray-200">
                        <!-- JavaScript দিয়ে ডেটা এখানে বসবে -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Supabase Config File Load (Root থেকে) -->
    <script src="../supabase-config.js"></script>
    <script>
        // হ্যামবার্গার মেনু টগল করার স্ক্রিপ্ট
        const menuBtn = document.getElementById('menu-btn');
        const sidebar = document.getElementById('sidebar');

        menuBtn.addEventListener('click', () => {
            sidebar.classList.toggle('-translate-x-full');
        });

        // পেজ লোড হওয়ার পর অথেন্টিকেশন ও অ্যাডমিন চেক
        window.addEventListener('DOMContentLoaded', async () => {
            // একটু সময় দেওয়া যাতে Supabase ইনিশিয়ালাইজ হতে পারে
            setTimeout(async () => {
                if (!window._supabase) {
                    alert('Supabase কানেক্ট হয়নি!');
                    return;
                }

                // ১. বর্তমান লগইন করা ইউজারের সেশন চেক করা
                const { data: { session }, error: sessionError } = await window._supabase.auth.getSession();
                
                if (sessionError || !session) {
                    alert('দয়া করে প্রথমে লগইন করুন!');
                    window.location.href = '../login-signup.html'; // আপনার লগইন পেজের পাথ অনুযায়ী ঠিক করে নিতে পারেন
                    return;
                }

                const userEmail = session.user.email;
                document.getElementById('admin-email').innerText = userEmail;

                // ২. টেবিল থেকে চেক করা এই ইউজারের role 'admin' কি না
                const { data: userData, error: userError } = await window._supabase
                    .from('user')
                    .select('role')
                    .eq('email', userEmail)
                    .single();

                if (userError || !userData || userData.role !== 'admin') {
                    alert('আপনার এই পেজে ঢোকার অনুমতি নেই! আপনি অ্যাডমিন নন।');
                    window.location.href = '../home-index.html'; // সাধারণ হোম পেজে পাঠিয়ে দেওয়া
                    return;
                }

                // যদি অ্যাডমিন হয়, তবে ইউজার লিস্ট লোড করো
                loadUserList();

            }, 500);
        });

        // ইউজার লিস্ট ফেচ করার ফাংশন
        async function loadUserList() {
            const loadingEl = document.getElementById('loading');
            const tableContainer = document.getElementById('table-container');
            const tbody = document.getElementById('user-table-body');

            loadingEl.style.display = 'block';
            tableContainer.classList.add('hidden');

            const { data: users, error } = await window._supabase
                .from('user')
                .select('*')
                .order('created_at', { ascending: false });

            loadingEl.style.display = 'none';

            if (error) {
                console.error('ইউজার ডেটা আনতে সমস্যা হয়েছে:', error.message);
                loadingEl.innerText = 'ডেটা লোড করতে সমস্যা হয়েছে!';
                return;
            }

            tbody.innerHTML = '';
            users.forEach(user => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${user.full_name || 'N/A'}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${user.email}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${user.phone || 'N/A'}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${user.role === 'admin' ? 'bg-purple-100 text-purple-800' : 'bg-green-100 text-green-800'}">
                            ${user.role}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${new Date(user.created_at).toLocaleString()}</td>
                `;
                tbody.appendChild(tr);
            });

            tableContainer.classList.remove('hidden');
        }
    </script>
</body>
</html>
