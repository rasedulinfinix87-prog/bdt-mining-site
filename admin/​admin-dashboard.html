<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Goldmine Digital</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #061913;
      --topbar-bg: rgba(6, 25, 19, 0.98);
      --card-bg: rgba(12, 38, 29, 0.85);
      --card-border: rgba(245, 207, 102, 0.2);
      --gold-primary: #f5cf66;
      --gold-gradient: linear-gradient(135deg, #f5cf66 0%, #b89332 100%);
      --green-glow: #2ed573;
      --red-color: #ff4757;
      --text-main: #ffffff;
      --text-muted: #8da499;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .admin-container {
      width: 100%;
      max-width: 480px;
      background-color: var(--bg-dark);
      padding-bottom: 50px;
      position: relative;
      min-height: 100vh;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: var(--topbar-bg);
      position: sticky;
      top: 0;
      z-index: 999;
      border-bottom: 1px solid var(--card-border);
    }

    .top-bar h2 {
      font-size: 1.15rem;
      color: var(--gold-primary);
    }

    .action-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logout-btn {
      background: rgba(255, 71, 87, 0.15);
      border: 1px solid rgba(255, 71, 87, 0.4);
      color: var(--red-color);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* Direct Fixed Menu Button Styles */
    .menu-btn {
      background: rgba(245, 207, 102, 0.15);
      border: 1px solid var(--card-border);
      color: var(--gold-primary);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
    }

    /* Dropdown Menu */
    .dropdown-menu {
      position: absolute;
      top: 60px;
      right: 20px;
      background: #0b241c;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      width: 180px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      display: none;
      flex-direction: column;
      z-index: 1000;
    }

    .dropdown-menu.show {
      display: flex;
    }

    .dropdown-menu a {
      padding: 12px 16px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .dropdown-menu a:hover {
      background: rgba(245, 207, 102, 0.1);
      color: var(--gold-primary);
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      padding: 20px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      text-align: center;
    }

    .stat-card h3 {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .stat-card p {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--gold-primary);
    }

    /* Section Header */
    .section-header {
      padding: 10px 20px;
      font-size: 1.05rem;
      color: var(--text-main);
      margin-top: 10px;
    }

    /* Transaction List */
    .trx-list {
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .trx-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
    }

    .trx-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .trx-info span.type {
      text-transform: uppercase;
      font-weight: 700;
      color: var(--gold-primary);
    }

    .trx-details {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .trx-actions {
      display: flex;
      gap: 10px;
    }

    .btn-action {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-approve {
      background: rgba(46, 213, 115, 0.15);
      border: 1px solid var(--green-glow);
      color: var(--green-glow);
    }

    .btn-reject {
      background: rgba(255, 71, 87, 0.15);
      border: 1px solid var(--red-color);
      color: var(--red-color);
    }

    .no-data {
      text-align: center;
      color: var(--text-muted);
      padding: 30px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <!-- Top Bar -->
    <div class="top-bar">
      <h2><i class="fa-solid fa-gauge-high"></i> Admin Control</h2>
      
      <div class="action-group">
        <!-- 3-Dot Menu Button -->
        <button class="menu-btn" id="menuToggleBtn">
          <i class="fa-solid fa-ellipsis-vertical"></i>
        </button>
        <button class="logout-btn" onclick="adminLogout()">Logout</button>
      </div>
    </div>

    <!-- Dropdown Menu Box -->
    <div class="dropdown-menu" id="myDropdownMenu">
      <a href="total-user-list.html"><i class="fa-solid fa-users" style="color: var(--gold-primary);"></i> Total User List</a>
    </div>

    <!-- Quick Stats Overview -->
    <div class="stats-grid">
      <div class="stat-card">
        <h3>Total Users</h3>
        <p id="total-users">0</p>
      </div>
      <div class="stat-card">
        <h3>Pending Requests</h3>
        <p id="pending-count">0</p>
      </div>
    </div>

    <!-- Pending Transactions Approval Section -->
    <div class="section-header">
      <span>Pending Transactions</span>
    </div>

    <div class="trx-list" id="pending-transactions-container">
      <div class="no-data">Loading pending transactions...</div>
    </div>
  </div>

  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Supabase Config Script -->
  <script src="../supabase-config.js"></script>

  <script>
    // Pure JavaScript Toggle for Menu
    const menuBtn = document.getElementById('menuToggleBtn');
    const dropdownMenu = document.getElementById('myDropdownMenu');

    menuBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      dropdownMenu.classList.toggle('show');
    });

    // Close dropdown when clicking anywhere outside
    window.addEventListener('click', function() {
      if (dropdownMenu.classList.contains('show')) {
        dropdownMenu.classList.remove('show');
      }
    });

    async function getSupabaseInstance() {
      let attempts = 0;
      while ((!window._supabase && !window.supabase) && attempts < 20) {
        await new Promise(resolve => setTimeout(resolve, 100));
        attempts++;
      }
      if (window._supabase) return window._supabase;
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        const SUPABASE_URL = "https://pckocwvuxeseumynslwv.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBja29jd3Z1eGVzZXVteW5zbHd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NDc3OTAsImV4cCI6MjEwNjIyMzc5MH0.0VBGW9lgZDritQa7XDoPncu5bl9M6J5W9eup0KSLXIc";
        return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
      return null;
    }

    async function checkAdminAuth() {
      const client = await getSupabaseInstance();
      if (!client) {
        window.location.href = 'admin-login.html';
        return;
      }

      const { data: { user } } = await client.auth.getUser();
      if (!user) {
        window.location.href = 'admin-login.html';
        return;
      }

      const { data: profile } = await client
        .from('user')
        .select('role')
        .eq('id', user.id)
        .single();

      if (!profile || profile.role !== 'admin') {
        alert("Unauthorized access!");
        window.location.href = 'admin-login.html';
        return;
      }

      loadAdminDashboard(client);
    }

    async function loadAdminDashboard(client) {
      try {
        const { count: userCount } = await client
          .from('user')
          .select('*', { count: 'exact', head: true });
        document.getElementById('total-users').innerText = userCount || 0;

        const { data: pendingTrx, error } = await client
          .from('transactions')
          .select('*')
          .eq('status', 'pending')
          .order('created_at', { ascending: false });

        if (error) throw error;

        document.getElementById('pending-count').innerText = pendingTrx ? pendingTrx.length : 0;
        const container = document.getElementById('pending-transactions-container');

        if (!pendingTrx || pendingTrx.length === 0) {
          container.innerHTML = `<div class="no-data">No pending requests found.</div>`;
          return;
        }

        container.innerHTML = '';
        pendingTrx.forEach(trx => {
          container.innerHTML += `
            <div class="trx-card" id="trx-card-${trx.id}">
              <div class="trx-info">
                <span class="type">${trx.type} (${trx.method || 'N/A'})</span>
                <span style="color: var(--gold-primary); font-weight: 700;">৳${trx.net_amount || trx.amount}</span>
              </div>
              <div class="trx-details">
                A/C: ${trx.account_number || 'N/A'}<br>
                TrxID: ${trx.trx_id || 'N/A'}<br>
                Time: ${new Date(trx.created_at).toLocaleString()}
              </div>
              <div class="trx-actions" id="trx-actions-${trx.id}">
                <button class="btn-action btn-approve" onclick="processTrx('${trx.id}', '${trx.user_id}', '${trx.type}', ${trx.net_amount || trx.amount}, 'approved')">Approve</button>
                <button class="btn-action btn-reject" onclick="processTrx('${trx.id}', '${trx.user_id}', '${trx.type}', ${trx.net_amount || trx.amount}, 'rejected')">Reject</button>
              </div>
            </div>
          `;
        });

      } catch (err) {
        console.error("Error loading dashboard data:", err);
      }
    }

    async function processTrx(trxId, userId, type, amount, newStatus) {
      const client = await getSupabaseInstance();
      if (!client) return;

      if (!confirm(`Are you sure you want to mark this transaction as ${newStatus}?`)) return;

      const actionContainer = document.getElementById(`trx-actions-${trxId}`);
      if (actionContainer) {
        actionContainer.querySelectorAll('button').forEach(btn => btn.disabled = true);
      }

      try {
        const { data: currentTrx, error: fetchErr } = await client
          .from('transactions')
          .select('status')
          .eq('id', trxId)
          .single();

        if (fetchErr || !currentTrx) {
          throw new Error("Transaction not found.");
        }

        if (currentTrx.status !== 'pending') {
          alert("This transaction has already been processed!");
          loadAdminDashboard(client);
          return;
        }

        const { error: updateError } = await client
          .from('transactions')
          .update({ status: newStatus, updated_at: new Date() })
          .eq('id', trxId);

        if (updateError) throw updateError;

        alert(`Transaction successfully ${newStatus}!`);
        loadAdminDashboard(client);

      } catch (err) {
        alert("Failed to process transaction: " + err.message);
        loadAdminDashboard(client);
      }
    }

    async function adminLogout() {
      const client = await getSupabaseInstance();
      if (client) {
        await client.auth.signOut();
      }
      window.location.href = 'admin-login.html';
    }

    document.addEventListener('DOMContentLoaded', checkAdminAuth);
  </script>
</body>
</html>
