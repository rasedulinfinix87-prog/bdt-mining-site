<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Goldmine Digital</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #061913;
      --card-bg: rgba(12, 38, 29, 0.85);
      --card-border: rgba(245, 207, 102, 0.2);
      --gold-primary: #f5cf66;
      --gold-gradient: linear-gradient(135deg, #f5cf66 0%, #b89332 100%);
      --text-main: #ffffff;
      --text-muted: #8da499;
      --red-color: #ff4757;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(245, 207, 102, 0.05) 0%, transparent 20%),
        radial-gradient(circle at 90% 80%, rgba(46, 213, 115, 0.03) 0%, transparent 20%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 30px 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
    }

    .login-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .login-header .icon-box {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(245, 207, 102, 0.1);
      border: 2px solid var(--gold-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      color: var(--gold-primary);
      font-size: 1.5rem;
    }

    .login-header h2 {
      font-size: 1.4rem;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .login-header p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .input-box {
      position: relative;
    }

    .input-box i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .input-box input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      background: rgba(6, 25, 19, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-box input:focus {
      border-color: var(--gold-primary);
    }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: var(--gold-gradient);
      color: #061913;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s;
    }

    .btn-login:hover {
      opacity: 0.9;
    }

    .error-msg {
      background: rgba(255, 71, 87, 0.1);
      border: 1px solid rgba(255, 71, 87, 0.3);
      color: var(--red-color);
      padding: 10px;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 15px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <div class="icon-box">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h2>Admin Portal</h2>
      <p>Enter your credentials to access control panel</p>
    </div>

    <div class="error-msg" id="error-alert"></div>

    <form id="admin-login-form" onsubmit="handleAdminLogin(event)">
      <div class="form-group">
        <label>Admin Email</label>
        <div class="input-box">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="admin-email" placeholder="admin@example.com" required>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-box">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="admin-password" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn-login" id="login-btn">Secure Login</button>
    </form>
  </div>

  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Supabase Config Script (যদি config ফাইলটি root ফোল্ডারে থাকে তবে "../", আর admin ফোল্ডারে থাকলে "./") -->
  <script src="../supabase-config.js"></script>

  <script>
    async function getSupabaseInstance() {
      let attempts = 0;
      while ((!window._supabase && !window.supabase) && attempts < 20) {
        await new Promise(resolve => setTimeout(resolve, 100));
        attempts++;
      }
      if (window._supabase) return window._supabase;
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        const SUPABASE_URL = "https://pckocwvuxeseumynslwv.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBja29jd3Z1eGVzZXVteW5zbHd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NDc3OTAsImV4cCI6MjEwNjIyMzc5MH0.0VBGW9lgZDritQa7XDoPncu5bl9M6J5W9eup0KSLXIc";
        return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
      return null;
    }

    async function handleAdminLogin(e) {
      e.preventDefault();
      const email = document.getElementById('admin-email').value.trim();
      const password = document.getElementById('admin-password').value;
      const errorAlert = document.getElementById('error-alert');
      const loginBtn = document.getElementById('login-btn');

      errorAlert.style.display = 'none';
      loginBtn.innerText = 'Verifying...';
      loginBtn.disabled = true;

      try {
        const client = await getSupabaseInstance();
        if (!client) throw new Error("Database connection failed!");

        // 1. Supabase Auth Sign In
        const { data: authData, error: authError } = await client.auth.signInWithPassword({
          email,
          password
        });

        if (authError) throw authError;

        const user = authData.user;

        // 2. Check role from 'user' table
        const { data: profileData, error: profileError } = await client
          .from('user')
          .select('role')
          .eq('id', user.id)
          .single();

        if (profileError || !profileData || profileData.role !== 'admin') {
          // যদি অ্যাডমিন না হয়, তবে সাইনআউট করে আটকে দিবে
          await client.auth.signOut();
          throw new Error("Access denied! You are not authorized as an admin.");
        }

        // সফলভাবে লগইন হলে অ্যাডমিন ড্যাশবোর্ডে রিডাইরেক্ট হবে
        window.location.href = 'admin-dashboard.html';

      } catch (err) {
        errorAlert.innerText = err.message || "Invalid login credentials!";
        errorAlert.style.display = 'block';
        loginBtn.innerText = 'Secure Login';
        loginBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
