<style>
    .bottom-nav {
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 12px 0 18px 0;
        background: #061913;
        border-top: 1px solid rgba(46, 213, 115, 0.25);
        width: 100%;
        position: relative;
        z-index: 100;
        box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.4);
    }

    .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        color: #8da499;
        font-size: 0.72rem;
        text-decoration: none;
        position: relative;
        overflow: hidden;
        padding: 6px 12px;
        border-radius: 12px;
        transition: color 0.3s ease, transform 0.15s ease, background-color 0.3s ease;
        -webkit-tap-highlight-color: transparent;
    }

    .nav-item:hover, .nav-item.active {
        color: #f5cf66;
    }

    .nav-item i {
        font-size: 1.2rem;
        transition: transform 0.2s ease;
    }

    /* প্রেস/ক্লিক ইফেক্ট (Click & Touch Feedback Effect) */
    .nav-item:active {
        transform: scale(0.92);
        color: #f5cf66;
        background: rgba(245, 207, 102, 0.12);
    }

    .nav-item:active i {
        transform: translateY(-2px);
    }

    /* গোল্ডেন ও গ্রিন রিপল অ্যানিমেশন (Glow Ripple Effect) */
    .nav-item::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 5px;
        height: 5px;
        background: radial-gradient(circle, rgba(245, 207, 102, 0.8) 0%, rgba(46, 213, 115, 0.4) 100%);
        opacity: 0;
        border-radius: 100%;
        transform: scale(1, 1) translate(-50%, -50%);
        transform-origin: 50% 50%;
    }

    .nav-item:active::after {
        animation: clickGlow 0.4s ease-out;
    }

    @keyframes clickGlow {
        0% {
            opacity: 0.8;
            transform: scale(0, 0) translate(-50%, -50%);
        }
        100% {
            opacity: 0;
            transform: scale(20, 20) translate(-50%, -50%);
        }
    }
</style>

<script>
  // বর্তমান পেজ অনুযায়ী বটম ন্যাভ একটিভ করার স্ক্রিপ্ট
  (function() {
    const currentPath = window.location.pathname.split('/').pop();
    const navItems = document.querySelectorAll('.bottom-nav .nav-item');
    
    navItems.forEach(item => {
      const href = item.getAttribute('href');
      if (href === currentPath || (currentPath === '' && href === 'home-index.html')) {
        item.classList.add('active');
      }
    });
  })();
</script>
