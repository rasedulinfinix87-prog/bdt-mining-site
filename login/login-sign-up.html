<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvestBangla - Sign Up & Login</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Hind Siliguri', sans-serif;
        }

        body {
            background-color: #e3f2fd;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
        }

        /* Mobile Frame Container */
        .app-container {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
        }

        /* Top Hero Header Section */
        .hero-header {
            background: linear-gradient(180deg, #dcfce7 0%, #bbf7d0 40%, #86efac 100%);
            padding: 25px 20px 40px 20px;
            text-align: center;
            position: relative;
            background-image: linear-gradient(to bottom, rgba(255,255,255,0.7), rgba(255,255,255,0.2)), url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=600&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }

        /* Status bar mock */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #1e293b;
        }

        .status-icons i {
            margin-left: 5px;
        }

        /* Logo Branding */
        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: #00b074;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 22px;
            box-shadow: 0 4px 10px rgba(0, 176, 116, 0.3);
        }

        .brand-text h1 {
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
            text-align: left;
            line-height: 1.1;
        }

        .brand-text h1 span {
            color: #00b074;
        }

        .brand-text p {
            font-size: 10px;
            color: #475569;
            text-align: left;
            font-weight: 500;
        }

        /* Hero Text Banner */
        .hero-title {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
            text-align: left;
            line-height: 1.3;
            margin-top: 15px;
            margin-bottom: 8px;
        }

        .hero-subtitle {
            font-size: 12px;
            color: #334155;
            text-align: left;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        /* Form Card Area */
        .form-card {
            background: #ffffff;
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            margin-top: -25px;
            padding: 25px 20px;
            position: relative;
            z-index: 2;
        }

        /* Toggle Tabs */
        .toggle-container {
            display: flex;
            background: #f1f5f9;
            border-radius: 25px;
            padding: 4px;
            margin-bottom: 20px;
        }

        .toggle-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toggle-btn.active {
            background: #00b074;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(0, 176, 116, 0.3);
        }

        /* Input Group Styles */
        .input-group {
            margin-bottom: 15px;
            position: relative;
        }

        .input-box {
            display: flex;
            align-items: center;
            border: 1.5px solid #e2e8f0;
            border-radius: 16px;
            padding: 10px 15px;
            background: #f8fafc;
            transition: border-color 0.3s;
        }

        .input-box:focus-within {
            border-color: #00b074;
            background: #ffffff;
        }

        .input-icon {
            color: #64748b;
            font-size: 16px;
            margin-right: 12px;
            width: 20px;
            text-align: center;
        }

        .input-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .input-content label {
            font-size: 11px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 2px;
        }

        .input-content input {
            border: none;
            outline: none;
            background: transparent;
            font-size: 13px;
            color: #0f172a;
            width: 100%;
        }

        .input-content input::placeholder {
            color: #94a3b8;
            font-size: 12px;
        }

        .password-toggle {
            color: #64748b;
            cursor: pointer;
            padding: 5px;
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            background: #00b074;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 176, 116, 0.3);
            margin-top: 10px;
            margin-bottom: 15px;
            transition: background 0.3s;
        }

        .submit-btn:hover {
            background: #009663;
        }

        /* Footer Link */
        .form-footer {
            text-align: center;
            font-size: 13px;
            color: #64748b;
        }

        .form-footer a {
            color: #00b074;
            text-decoration: none;
            font-weight: 600;
        }

        /* Form Visibility */
        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header Banner Section -->
        <div class="hero-header">
            <div class="status-bar">
                <span>9:46</span>
                <div class="status-icons">
                    <i class="fa-solid fa-signal"></i>
                    <i class="fa-solid fa-wifi"></i>
                    <i class="fa-solid fa-battery-full"></i>
                </div>
            </div>

            <div class="brand-logo">
                <div class="logo-icon">
                    <i class="fa-solid fa-chart-line"></i>
                </div>
                <div class="brand-text">
                    <h1>Invest<span>Bangla</span></h1>
                    <p>Safe investment • Better Tomorrow</p>
                </div>
            </div>

            <div class="hero-title">
                আপনার ভবিষ্যৎ গড়ুন<br>নিরাপদ বিনিয়োগের মাধ্যমে
            </div>
            <div class="hero-subtitle">
                আজই একাউন্ট খুলুন এবং শুরু করুন লাভজনক যাত্রা।
            </div>
        </div>

        <!-- Form Card Section -->
        <div class="form-card">
            <!-- Toggle Buttons -->
            <div class="toggle-container">
                <button class="toggle-btn active" id="signUpTab" onclick="switchTab('signup')">Sign Up</button>
                <button class="toggle-btn" id="loginTab" onclick="switchTab('login')">Login</button>
            </div>

            <!-- Sign Up Form -->
            <form id="signUpForm" class="form-section active" onsubmit="handleSignUp(event)">
                <!-- Full Name -->
                <div class="input-group">
                    <div class="input-box">
                        <i class="fa-regular fa-user input-icon"></i>
                        <div class="input-content">
                            <label>Full Name</label>
                            <input type="text" id="full_name" name="full_name" placeholder="Enter your full name" required>
                        </div>
                    </div>
                </div>

                <!-- Email Address -->
                <div class="input-group">
                    <div class="input-box">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <div class="input-content">
                            <label>Email Address</label>
                            <input type="email" id="email" name="email" placeholder="Enter your email" required>
                        </div>
                    </div>
                </div>

                <!-- Password -->
                <div class="input-group">
                    <div class="input-box">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <div class="input-content">
                            <label>Password</label>
                            <input type="password" id="password" name="password" placeholder="Create a strong password" required>
                        </div>
                        <i class="fa-regular fa-eye password-toggle" onclick="togglePassword('password', this)"></i>
                    </div>
                </div>

                <!-- Secret PIN -->
                <div class="input-group">
                    <div class="input-box">
                        <i class="fa-solid fa-key input-icon"></i>
                        <div class="input-content">
                            <label>Secret PIN (4-6 digits)</label>
                            <input type="password" id="secret_pin" name="secret_pin" maxlength="6" placeholder="Set withdrawal PIN" required>
                        </div>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    Create Account <i class="fa-solid fa-arrow-right"></i>
                </button>

                <div class="form-footer">
                    Already have an account? <a href="#" onclick="switchTab('login')">Login</a>
                </div>
            </form>

            <!-- Login Form -->
            <form id="loginForm" class="form-section" onsubmit="handleLogin(event)">
                <!-- Email Address -->
                <div class="input-group">
                    <div class="input-box">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <div class="input-content">
                            <label>Email Address</label>
                            <input type="email" id="login_email" name="email" placeholder="Enter your email" required>
                        </div>
                    </div>
                </div>

                <!-- Password -->
                <div class="input-group">
                    <div class="input-box">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <div class="input-content">
                            <label>Password</label>
                            <input type="password" id="login_password" name="password" placeholder="Enter your password" required>
                        </div>
                        <i class="fa-regular fa-eye password-toggle" onclick="togglePassword('login_password', this)"></i>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    Login <i class="fa-solid fa-arrow-right"></i>
                </button>

                <div class="form-footer">
                    Don't have an account? <a href="#" onclick="switchTab('signup')">Sign Up</a>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Toggle between Sign Up and Login tabs
        function switchTab(tab) {
            const signUpTab = document.getElementById('signUpTab');
            const loginTab = document.getElementById('loginTab');
            const signUpForm = document.getElementById('signUpForm');
            const loginForm = document.getElementById('loginForm');

            if (tab === 'signup') {
                signUpTab.classList.add('active');
                loginTab.classList.remove('active');
                signUpForm.classList.add('active');
                loginForm.classList.remove('active');
            } else {
                loginTab.classList.add('active');
                signUpTab.classList.remove('active');
                loginForm.classList.add('active');
                signUpForm.classList.remove('active');
            }
        }

        // Toggle Password Visibility
        function togglePassword(fieldId, icon) {
            const input = document.getElementById(fieldId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Form Submit Handler Examples
        function handleSignUp(event) {
            event.preventDefault();
            alert('Sign Up Successful!');
            // Supabase/Backend API Integration logic goes here
        }

        function handleLogin(event) {
            event.preventDefault();
            alert('Login Successful!');
            // Supabase/Backend API Integration logic goes here
        }
    </script>
</body>
</html>
