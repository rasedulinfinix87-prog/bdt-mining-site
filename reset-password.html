<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goldmine Digital - Reset Password</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: #061913;
            --card-bg: rgba(12, 38, 29, 0.85);
            --card-border: rgba(46, 213, 115, 0.2);
            --text-primary: #ffffff;
            --text-secondary: #8da499;
            --gold-primary: #f5cf66;
            --gold-gradient: linear-gradient(135deg, #e5ba41 0%, #fbe89d 50%, #b88a1a 100%);
            --accent-green: #2ed573;
            --input-bg: rgba(255, 255, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #030d0a;
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 0;
        }

        .mobile-container {
            width: 100%;
            max-width: 410px;
            background: var(--bg-color);
            min-height: 100vh;
            border-radius: 25px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.8), 0 0 15px rgba(46, 213, 115, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 20px;
        }

        .brand-header {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 25px;
        }

        .brand-logo {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--gold-primary);
        }

        .brand-logo span {
            color: #ffffff;
            font-weight: 400;
        }

        .brand-subtitle {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .auth-form-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .form-title {
            font-size: 1rem;
            color: var(--gold-primary);
            margin-bottom: 16px;
            text-align: center;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 16px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.72rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-box i {
            position: absolute;
            left: 12px;
            color: var(--gold-primary);
            font-size: 0.9rem;
        }

        .input-box input {
            width: 100%;
            padding: 12px 12px 12px 38px;
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-box input:focus {
            border-color: var(--gold-primary);
        }

        .btn-gold {
            width: 100%;
            padding: 13px;
            background: var(--gold-gradient);
            border: none;
            border-radius: 25px;
            color: #030d0a;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(245, 207, 102, 0.4);
            margin-top: 10px;
            transition: transform 0.2s;
        }

        .btn-gold:active {
            transform: scale(0.98);
        }

        .security-footer {
            text-align: center;
            margin-top: 15px;
            font-size: 0.7rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .security-footer i {
            color: var(--accent-green);
        }

        /* --- Custom Popup Modal Overlay with Animation --- */
        .auth-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 13, 10, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }

        .auth-modal-card {
            background: linear-gradient(135deg, rgba(12, 38, 29, 0.95) 0%, #030d0a 100%);
            border: 1px solid var(--gold-primary);
            border-radius: 20px;
            padding: 28px 22px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 25px rgba(245, 207, 102, 0.2);
            animation: modalFadeIn 0.3s ease-out;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .auth-modal-icon {
            width: 60px;
            height: 60px;
            background: rgba(245, 207, 102, 0.15);
            border: 1px solid var(--gold-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px auto;
            color: var(--gold-primary);
            font-size: 1.6rem;
            box-shadow: 0 0 15px rgba(245, 207, 102, 0.3);
        }

        .auth-modal-text {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-primary);
            margin-bottom: 22px;
            font-weight: 400;
        }

        .btn-modal-action {
            display: inline-block;
            width: 100%;
            padding: 14px 20px;
            background: var(--gold-gradient);
            color: #030d0a;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(245, 207, 102, 0.3);
            transition: all 0.3s ease;
        }

        .btn-modal-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 207, 102, 0.4);
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <div>
            <!-- Header -->
            <div class="brand-header">
                <div class="brand-logo">GOLDMINE <span>DIGITAL</span></div>
                <div class="brand-subtitle">Bank-Grade Vault Investment & Mining</div>
            </div>

            <!-- Form Container -->
            <div class="auth-form-card">
                <div class="form-title">Set New Password</div>
                
                <form id="reset-form">
                    <div class="form-group">
                        <label>New Password (Min 8 Characters)</label>
                        <div class="input-box">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="new-password" placeholder="••••••••" minlength="8" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Confirm New Password</label>
                        <div class="input-box">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="confirm-new-password" placeholder="••••••••" minlength="8" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-gold" id="btn-reset">UPDATE PASSWORD</button>
                </form>
            </div>
        </div>

        <!-- Bottom Security Note -->
        <div class="security-footer">
            <i class="fa-solid fa-lock"></i> 256-Bit Encrypted & Vault Secured Connection
        </div>
    </div>

    <!-- Custom Popup Modal -->
    <div class="auth-modal-overlay" id="customModal">
        <div class="auth-modal-card">
            <div class="auth-modal-icon" id="modalIcon">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <p class="auth-modal-text" id="modalMessage">Message goes here</p>
            <button class="btn-modal-action" id="modalActionBtn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <!-- Supabase Reset Password Script -->
    <script>
        const SUPABASE_URL = "https://pckocwvuxeseumynslwv.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBja29jd3Z1eGVzZXVteW5zbHd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NDc3OTAsImV4cCI6MjEwNjIyMzc5MH0.0VBGW9lgZDritQa7XDoPncu5bl9M6J5W9eup0KSLXIc";

        let supabaseClient = null;
        let modalCallback = null;

        function getSupabaseClient() {
            if (!supabaseClient && window.supabase && typeof window.supabase.createClient === 'function') {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
            return supabaseClient;
        }

        // Custom Popup Modal Control
        function showPopup(message, iconClass = 'fa-solid fa-circle-check', callback = null) {
            const modal = document.getElementById('customModal');
            const msgEl = document.getElementById('modalMessage');
            const iconEl = document.getElementById('modalIcon');
            
            msgEl.innerText = message;
            iconEl.innerHTML = `<i class="${iconClass}"></i>`;
            modal.style.display = 'flex';
            modalCallback = callback;
        }

        function closeModal() {
            const modal = document.getElementById('customModal');
            modal.style.display = 'none';
            if (typeof modalCallback === 'function') {
                modalCallback();
                modalCallback = null;
            }
        }

        // Handle Password Reset Form Submission
        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const client = getSupabaseClient();
            if (!client) {
                showPopup('Supabase connection loading... Please try again.', 'fa-solid fa-triangle-exclamation');
                return;
            }

            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-new-password').value;

            // Password Length Validation
            if (newPassword.length < 8) {
                showPopup('Password must be at least 8 characters long.', 'fa-solid fa-triangle-exclamation');
                return;
            }

            // Confirm Password Match Validation
            if (newPassword !== confirmPassword) {
                showPopup('New Password and Confirm Password do not match!', 'fa-solid fa-triangle-exclamation');
                return;
            }

            const resetBtn = document.getElementById('btn-reset');
            resetBtn.innerText = 'UPDATING...';
            resetBtn.disabled = true;

            try {
                // Supabase Auth Update User Password
                const { data, error } = await client.auth.updateUser({
                    password: newPassword
                });

                if (error) {
                    showPopup('Password Reset Failed: ' + error.message, 'fa-solid fa-triangle-exclamation');
                    return;
                }

                if (data && data.user) {
                    const userId = data.user.id;
                    const currentTime = new Date().toISOString();

                    // Optional: Update password and updated_at in your custom `user` table as well
                    await client
                        .from('user')
                        .update({ 
                            password: newPassword, 
                            updated_at: currentTime 
                        })
                        .eq('id', userId);

                    // Success Popup and Redirect to Auth/Login Page
                    showPopup('Password updated successfully! Please login with your new password.', 'fa-solid fa-circle-check', () => {
                        window.location.href = 'index.html'; // আপনার লগইন পেজের ফাইল নেম এখানে দিন
                    });
                } else {
                    showPopup('Failed to update password. Please try again.', 'fa-solid fa-triangle-exclamation');
                }

            } catch (err) {
                console.error(err);
                showPopup('Error: ' + err.message, 'fa-solid fa-triangle-exclamation');
            } finally {
                resetBtn.innerText = 'UPDATE PASSWORD';
                resetBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
