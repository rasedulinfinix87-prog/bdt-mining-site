<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goldmine Digital - Wallet Gateway</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #061913;
      --topbar-bg: #030d0a;
      --card-bg: rgba(12, 38, 29, 0.85);
      --card-border: rgba(245, 207, 102, 0.25);
      --gold-primary: #f5cf66;
      --gold-gradient: linear-gradient(135deg, #f5cf66 0%, #b89332 100%);
      --card-gradient: linear-gradient(135deg, rgba(12, 38, 29, 0.95) 0%, #030d0a 100%);
      --text-main: #ffffff;
      --text-muted: #8da499;
      --green-glow: #2ed573;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .mobile-container {
      width: 100%;
      max-width: 480px;
      background-color: var(--bg-dark);
      padding-bottom: 70px;
      position: relative;
      min-height: 100vh;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      background: rgba(3, 13, 10, 0.95);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .top-bar .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .top-bar .back-btn {
      color: var(--text-main);
      font-size: 1.1rem;
      text-decoration: none;
      cursor: pointer;
    }

    .top-bar h2 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: 0.5px;
    }

    .card-section {
      padding: 15px 20px;
    }

    .bank-card {
      background: var(--card-gradient);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 22px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(245, 207, 102, 0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 180px;
    }

    .bank-card::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -30%;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(245, 207, 102, 0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .user-info .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .user-info .user-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: 0.5px;
    }

    .card-chip {
      width: 36px;
      height: 26px;
      background: linear-gradient(135deg, #f5cf66, #b89332);
      border-radius: 5px;
      opacity: 0.85;
    }

    .card-bottom {
      margin-top: 25px;
    }

    .balance-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .balance-label .live-dot {
      width: 7px;
      height: 7px;
      background-color: var(--green-glow);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green-glow);
    }

    .balance-amount {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--gold-primary);
      text-shadow: 0 0 10px rgba(245, 207, 102, 0.3);
    }

    /* Action Buttons (Deposit & Withdraw) */
    .action-buttons {
      display: flex;
      gap: 15px;
      padding: 10px 20px 20px 20px;
    }

    .btn-action {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .btn-deposit {
      background: var(--gold-gradient);
      color: #030d0a;
      box-shadow: 0 4px 15px rgba(245, 207, 102, 0.25);
    }

    .btn-withdraw {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    #bottom-nav-container {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <div class="mobile-container">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="title-group">
        <a href="javascript:history.back()" class="back-btn">
          <i class="fa-solid fa-chevron-left"></i>
        </a>
        <h2>Wallet</h2>
      </div>
      <i class="fa-regular fa-bell" style="color: var(--text-muted); font-size: 1.1rem;"></i>
    </div>

    <!-- Bank Card Section -->
    <div class="card-section">
      <div class="bank-card">
        <div class="card-top">
          <div class="user-info">
            <div class="label">Account Holder</div>
            <div class="user-name" id="user-name-display">Loading...</div>
          </div>
          <div class="card-chip"></div>
        </div>

        <div class="card-bottom">
          <div class="balance-label">
            <span class="live-dot"></span> Real Time Balance
          </div>
          <div class="balance-amount" id="user-balance-display">$0.00</div>
        </div>
      </div>
    </div>

    <!-- Quick Action Buttons -->
    <div class="action-buttons">
      <a href="deposit.html" class="btn-action btn-deposit">
        <i class="fa-solid fa-arrow-down-left"></i> Deposit
      </a>
      <a href="withdraw.html" class="btn-action btn-withdraw">
        <i class="fa-solid fa-arrow-up-right"></i> Withdraw
      </a>
    </div>

    <!-- Container where bottom.html will be loaded -->
    <div id="bottom-nav-container"></div>
  </div>

  <!-- 1. Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- 2. Supabase Configuration File -->
  <script src="supabase-config.js"></script>

  <!-- 3. Logic Script -->
  <script>
    let currentUserId = null;

    async function fetchBalanceOnly(client, userId) {
      const { data, error } = await client
        .from('wallets')
        .select('balance')
        .eq('user_id', userId)
        .single();

      if (data) {
        document.getElementById('user-balance-display').innerText = '$' + parseFloat(data.balance).toFixed(2);
      } else if (error) {
        console.error("Balance fetch error:", error.message);
      }
    }

    async function loadWalletData() {
      // supabase-config.js থেকে _supabase ক্লায়েন্ট চেক
      const client = window._supabase || window.supabase;

      if (!client) {
        console.error("Supabase client properly initialized পাওয়া যায়নি!");
        return;
      }

      // ১. লগইন ইউজার ফেচ করা
      const { data: { user }, error: userError } = await client.auth.getUser();

      if (userError || !user) {
        document.getElementById('user-name-display').innerText = "Guest";
        return;
      }

      currentUserId = user.id;

      // ২. ইউজারের নাম সেট
      const userName = user.user_metadata?.full_name || user.email.split('@')[0];
      document.getElementById('user-name-display').innerText = userName;

      // ৩. 'wallets' টেবিল থেকে আসল রিয়েল-টাইম ব্যালেন্স আনা
      await fetchBalanceOnly(client, currentUserId);

      // ৪. Realtime Listener (wallets টেবিল ট্র্যাকিং)
      client
        .channel('wallet-balance-changes')
        .on(
          'postgres_changes',
          {
            event: '*',
            schema: 'public',
            table: 'wallets',
            filter: `user_id=eq.${currentUserId}`
          },
          (payload) => {
            if (payload.new && payload.new.balance !== undefined) {
              document.getElementById('user-balance-display').innerText = '$' + parseFloat(payload.new.balance).toFixed(2);
            }
          }
        )
        .subscribe();

      // ৫. Realtime Listener (transactions স্ট্যাটাস approved ট্র্যাকিং)
      client
        .channel('transactions-status-changes')
        .on(
          'postgres_changes',
          {
            event: 'UPDATE',
            schema: 'public',
            table: 'transactions',
            filter: `user_id=eq.${currentUserId}`
          },
          (payload) => {
            if (payload.new && payload.new.status === 'approved') {
              // স্ট্যাটাস অ্যাপ্রুভ হলেই নতুন ব্যালেন্স রিলোড করবে
              fetchBalanceOnly(client, currentUserId);
            }
          }
        )
        .subscribe();
    }

    // bottom.html লোড করা
    fetch('bottom.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('bottom-nav-container').innerHTML = html;
      })
      .catch(err => console.log('Error loading bottom.html:', err));

    // পেজ লোড হলে কল হবে
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(loadWalletData, 100);
    });
  </script>
</body>
</html>
