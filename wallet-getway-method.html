<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goldmine Digital - Wallet Gateway</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Global Styles & Variables */
    :root {
      --bg-dark: #040d08;
      --card-bg: rgba(14, 34, 25, 0.85);
      --card-border: rgba(212, 175, 55, 0.25);
      --gold-primary: #f5c518;
      --gold-gradient: linear-gradient(135deg, #f5c518 0%, #a67c1e 100%);
      --card-gradient: linear-gradient(135deg, #112a1f 0%, #08150f 100%);
      --text-main: #ffffff;
      --text-muted: #8ca398;
      --green-glow: rgba(0, 255, 136, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    /* Mobile Container Wrapper */
    .mobile-container {
      width: 100%;
      max-width: 480px;
      background-color: var(--bg-dark);
      padding-bottom: 70px; /* Space for fixed bottom menu */
      position: relative;
      min-height: 100vh;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      background: rgba(4, 13, 8, 0.95);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .top-bar .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .top-bar .back-btn {
      color: var(--text-main);
      font-size: 1.1rem;
      text-decoration: none;
      cursor: pointer;
    }

    .top-bar h2 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: 0.5px;
    }

    /* Bank Card Container */
    .card-section {
      padding: 15px 20px;
    }

    .bank-card {
      background: var(--card-gradient);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 22px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(245, 197, 24, 0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 180px;
    }

    /* Decorative Card Elements */
    .bank-card::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -30%;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(245, 197, 24, 0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .user-info .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .user-info .user-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: 0.5px;
    }

    .card-chip {
      width: 36px;
      height: 26px;
      background: linear-gradient(135deg, #ffd700, #b8860b);
      border-radius: 5px;
      opacity: 0.85;
    }

    .card-bottom {
      margin-top: 25px;
    }

    .balance-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .balance-label .live-dot {
      width: 7px;
      height: 7px;
      background-color: #00ff88;
      border-radius: 50%;
      box-shadow: 0 0 8px #00ff88;
    }

    .balance-amount {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--gold-primary);
      text-shadow: 0 0 10px rgba(245, 197, 24, 0.3);
    }

    /* Placeholder for Page Content */
    .content-area {
      padding: 10px 20px;
    }

    .section-title {
      font-size: 1rem;
      margin-bottom: 15px;
      color: var(--text-muted);
    }

    /* Bottom Navigation Placeholder/Container */
    #bottom-nav-container {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <div class="mobile-container">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="title-group">
        <a href="javascript:history.back()" class="back-btn">
          <i class="fa-solid fa-chevron-left"></i>
        </a>
        <h2>Wallet</h2>
      </div>
      <i class="fa-regular fa-bell" style="color: var(--text-muted); font-size: 1.1rem;"></i>
    </div>

    <!-- Bank Card Section -->
    <div class="card-section">
      <div class="bank-card">
        <!-- Card Top: User Name -->
        <div class="card-top">
          <div class="user-info">
            <div class="label">Account Holder</div>
            <div class="user-name" id="user-name-display">Loading...</div>
          </div>
          <div class="card-chip"></div>
        </div>

        <!-- Card Bottom: Real-Time Balance -->
        <div class="card-bottom">
          <div class="balance-label">
            <span class="live-dot"></span> Real Time Balance
          </div>
          <div class="balance-amount" id="user-balance-display">$0.00</div>
        </div>
      </div>
    </div>

    <!-- Payment Gateways Content Section -->
    <div class="content-area">
      <div class="section-title">Select Payment Gateway</div>
      <!-- গেটওয়ে মেথডগুলো এখানে থাকবে -->
    </div>

    <!-- Container where bottom.html will be loaded -->
    <div id="bottom-nav-container"></div>
  </div>

  <!-- 1. Supabase CDN Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- 2. Your Supabase Config File -->
  <script src="supabase-config.js"></script>

  <!-- 3. Logic Execution Script -->
  <script>
    // supabase-config.js ফাইল থেকে supabase বা client ইনস্ট্যান্স নিবে
    const supabaseClient = window.supabaseClient || window.supabase;

    async function loadWalletData() {
      if (!supabaseClient) {
        console.error("Supabase client is not initialized in supabase-config.js");
        return;
      }

      // 1. Get Logged in User
      const { data: { user }, error: userError } = await supabaseClient.auth.getUser();

      if (userError || !user) {
        console.warn("User not logged in or error:", userError);
        document.getElementById('user-name-display').innerText = "Guest User";
        return;
      }

      // 2. Display User Name (Metadata or Email Prefix)
      const userName = user.user_metadata?.full_name || user.email.split('@')[0];
      document.getElementById('user-name-display').innerText = userName;

      // 3. Fetch Balance from 'wallets' table
      const { data, error } = await supabaseClient
        .from('wallets')
        .select('balance')
        .eq('user_id', user.id)
        .single();

      if (data) {
        document.getElementById('user-balance-display').innerText = '$' + parseFloat(data.balance).toFixed(2);
      } else if (error) {
        console.error("Error fetching balance:", error.message);
      }
    }

    // Include bottom.html file dynamically
    fetch('bottom.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('bottom-nav-container').innerHTML = data;
      })
      .catch(err => console.log('Error loading bottom.html:', err));

    // Page Load Action
    window.addEventListener('DOMContentLoaded', loadWalletData);
  </script>
</body>
</html>
