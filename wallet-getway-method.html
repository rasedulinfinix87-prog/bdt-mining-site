<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Goldmine Digital - Deposit</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #061913;
      --topbar-bg: rgba(6, 25, 19, 0.85);
      --card-bg: rgba(12, 38, 29, 0.85);
      --card-border: rgba(245, 207, 102, 0.25);
      --gold-primary: #f5cf66;
      --gold-gradient: linear-gradient(135deg, #f5cf66 0%, #b89332 100%);
      --card-gradient: linear-gradient(135deg, rgba(12, 38, 29, 0.95) 0%, #030d0a 100%);
      --text-main: #ffffff;
      --text-muted: #8da499;
      --green-glow: #2ed573;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Fixed Layout setup (Non-scrollable) */
    html, body {
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      touch-action: none;
    }

    .mobile-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background-color: var(--bg-dark);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Top Bar - Glass Effect */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: var(--topbar-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      z-index: 100;
    }

    .top-bar .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .top-bar .back-btn {
      color: var(--gold-primary);
      font-size: 1.1rem;
      text-decoration: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(245, 207, 102, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(245, 207, 102, 0.2);
    }

    .top-bar h2 {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .main-content {
      flex: 1;
      padding: 15px 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      overflow-y: auto; /* Internal scrolling if screen height is too small */
    }

    /* Gateway Method Selection Cards (3 Items Layout) */
    .gateway-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .method-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
    }

    .method-card.active {
      background: var(--card-gradient);
      border-color: var(--gold-primary);
      box-shadow: 0 0 15px rgba(245, 207, 102, 0.25);
      transform: translateY(-2px);
    }

    .method-card i {
      font-size: 1.4rem;
      color: var(--gold-primary);
    }

    .method-card span {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-main);
    }

    /* Info Box & Inputs (Empty Boxes / Cards) */
    .details-card {
      background: var(--card-gradient);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .details-title {
      font-size: 0.85rem;
      color: var(--gold-primary);
      font-weight: 600;
      border-bottom: 1px dashed rgba(245, 207, 102, 0.2);
      padding-bottom: 6px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }

    .info-label {
      color: var(--text-muted);
    }

    .info-value {
      color: var(--text-main);
      font-weight: 600;
      font-family: monospace;
    }

    /* Form Fields */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .input-field {
      width: 100%;
      padding: 12px 14px;
      background: rgba(3, 13, 10, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 8px rgba(245, 207, 102, 0.2);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: var(--gold-gradient);
      color: #030d0a;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 5px;
      box-shadow: 0 4px 15px rgba(245, 207, 102, 0.25);
    }

    #bottom-nav-container {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <div class="mobile-container">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="title-group">
        <a href="wallet-getway-method.html" class="back-btn">
          <i class="fa-solid fa-chevron-left"></i>
        </a>
        <h2>Deposit Gateway</h2>
      </div>
      <i class="fa-solid fa-shield-halved" style="color: var(--gold-primary); font-size: 1.1rem;"></i>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- 3 Gateway Selection Cards -->
      <div class="gateway-selector">
        <div class="method-card active" onclick="selectMethod('bkash')">
          <i class="fa-solid fa-mobile-screen-button"></i>
          <span>bKash</span>
        </div>
        <div class="method-card" onclick="selectMethod('usdt')">
          <i class="fa-solid fa-coins"></i>
          <span>USDT (TRC20)</span>
        </div>
        <div class="method-card" onclick="selectMethod('bank')">
          <i class="fa-solid fa-building-columns"></i>
          <span>Bank</span>
        </div>
      </div>

      <!-- Payment Details Card (Dynamically Loaded from Supabase) -->
      <div class="details-card">
        <div class="details-title" id="gateway-title">Payment Info</div>
        <div id="dynamic-info-container">
          <div style="text-align: center; color: var(--text-muted); font-size: 0.85rem;">Loading details...</div>
        </div>
      </div>

      <!-- Deposit Form -->
      <form id="deposit-form" onsubmit="handleDeposit(event)">
        <div class="details-card">
          <div class="input-group">
            <label>Amount ($)</label>
            <input type="number" step="0.01" class="input-field" placeholder="Enter Deposit Amount" required>
          </div>
          <div class="input-group">
            <label>Transaction ID / Account No.</label>
            <input type="text" class="input-field" placeholder="Enter Trx ID or Sender No." required>
          </div>
          <button type="submit" class="submit-btn">Submit Deposit</button>
        </div>
      </form>
    </div>

    <!-- Bottom Nav Container -->
    <div id="bottom-nav-container"></div>
  </div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <script>
    let activeMethod = 'bkash';
    let methodsData = {};

    // Supabase থেকে মেথডের তথ্য নিয়ে আসা
    async function fetchGatewayDetails() {
      const client = window._supabase || window.supabase;
      if(!client) return;

      const { data, error } = await client.from('payment_methods').select('*').eq('is_active', true);

      if(data) {
        data.forEach(item => {
          methodsData[item.method_code] = item;
        });
        renderDetails('bkash');
      } else {
        console.error('Error loading gateway info:', error);
      }
    }

    // মেথড অনুযায়ী কার্ড রেন্ডার
    function renderDetails(code) {
      const infoContainer = document.getElementById('dynamic-info-container');
      const titleElem = document.getElementById('gateway-title');
      const data = methodsData[code];

      if (!data) {
        infoContainer.innerHTML = '<div style="color:var(--text-muted);">Information unavailable</div>';
        return;
      }

      titleElem.innerText = data.method_name + ' Details';
      let html = '';

      const details = data.account_details;
      if (code === 'bkash') {
        html = `
          <div class="info-row"><span class="info-label">Number:</span><span class="info-value">${details.number || 'N/A'}</span></div>
          <div class="info-row"><span class="info-label">Type:</span><span class="info-value">${details.type || 'Personal'}</span></div>
        `;
      } else if (code === 'usdt') {
        html = `
          <div class="info-row"><span class="info-label">Address:</span><span class="info-value" style="font-size:0.75rem;">${details.wallet_address || 'N/A'}</span></div>
          <div class="info-row"><span class="info-label">Network:</span><span class="info-value">${details.network || 'TRC20'}</span></div>
        `;
      } else if (code === 'bank') {
        html = `
          <div class="info-row"><span class="info-label">Bank:</span><span class="info-value">${details.bank_name || 'N/A'}</span></div>
          <div class="info-row"><span class="info-label">Account No:</span><span class="info-value">${details.account_number || 'N/A'}</span></div>
          <div class="info-row"><span class="info-label">Branch:</span><span class="info-value">${details.branch || 'N/A'}</span></div>
        `;
      }

      if(data.instructions) {
        html += `<div style="margin-top:8px; font-size:0.75rem; color:var(--gold-primary);">${data.instructions}</div>`;
      }

      infoContainer.innerHTML = html;
    }

    function selectMethod(code) {
      activeMethod = code;
      document.querySelectorAll('.method-card').forEach(card => card.classList.remove('active'));
      event.currentTarget.classList.add('active');
      renderDetails(code);
    }

    async function handleDeposit(e) {
      e.preventDefault();
      alert("Deposit request submitted successfully!");
    }

    // bottom.html লোড করা
    fetch('bottom.html')
      .then(res => res.text())
      .then(html => { document.getElementById('bottom-nav-container').innerHTML = html; })
      .catch(err => console.log('Error loading bottom.html:', err));

    window.addEventListener('DOMContentLoaded', fetchGatewayDetails);
  </script>
</body>
</html>
