<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goldmine Digital - Wallet Gateway</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #061913;
      --topbar-bg: rgba(6, 25, 19, 0.85); /* সাইটের প্রাইমারি থিম কালারের গ্লাস গ্রীন ইফেক্ট */
      --card-bg: rgba(12, 38, 29, 0.85);
      --card-border: rgba(245, 207, 102, 0.25);
      --gold-primary: #f5cf66;
      --gold-gradient: linear-gradient(135deg, #ffe082 0%, #f5cf66 40%, #b89332 100%);
      --gold-btn-gradient: linear-gradient(135deg, #ffe28a 0%, #f5cf66 45%, #d4a328 75%, #99741d 100%);
      --card-gradient: linear-gradient(135deg, rgba(12, 38, 29, 0.95) 0%, #030d0a 100%);
      --text-main: #ffffff;
      --text-muted: #8da499;
      --green-glow: #2ed573;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Page Loader Screen (1.2 sec) */
    .page-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-dark);
      z-index: 3000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .page-loader.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loader-icon-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loader-icon-wrapper i {
      font-size: 2.2rem;
      color: var(--gold-primary);
      filter: drop-shadow(0 0 12px rgba(245, 207, 102, 0.8));
      animation: pulseGlow 1.2s infinite alternate;
    }

    .loader-spinner {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 3px solid rgba(245, 207, 102, 0.15);
      border-top: 3px solid var(--gold-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.95); opacity: 0.8; }
      100% { transform: scale(1.08); opacity: 1; }
    }

    .mobile-container {
      width: 100%;
      max-width: 480px;
      background-color: var(--bg-dark);
      padding-bottom: 70px;
      position: relative;
      min-height: 100vh;
    }

    /* Top Bar - সাইটের কালার কম্বিনেশন ও গ্লাস গ্লো ইফেক্ট সহ */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      background: var(--topbar-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--card-border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .top-bar .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .top-bar .back-btn {
      color: var(--gold-primary);
      font-size: 1.1rem;
      text-decoration: none;
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(245, 207, 102, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(245, 207, 102, 0.2);
      transition: all 0.3s ease;
    }

    .top-bar .back-btn:hover {
      background: rgba(245, 207, 102, 0.2);
    }

    .top-bar h2 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: 0.5px;
    }

    .top-bar .notification-icon {
      color: var(--gold-primary);
      font-size: 1.1rem;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(245, 207, 102, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(245, 207, 102, 0.2);
      cursor: pointer;
    }

    .card-section {
      padding: 20px;
    }

    .bank-card {
      background: var(--card-gradient);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 22px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(245, 207, 102, 0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 180px;
    }

    .bank-card::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -30%;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(245, 207, 102, 0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .user-info .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .user-info .user-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: 0.5px;
    }

    .card-chip {
      width: 36px;
      height: 26px;
      background: linear-gradient(135deg, #f5cf66, #b89332);
      border-radius: 5px;
      opacity: 0.85;
      box-shadow: 0 2px 8px rgba(245, 207, 102, 0.3);
    }

    .card-bottom {
      margin-top: 25px;
    }

    .balance-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .balance-label .live-dot {
      width: 7px;
      height: 7px;
      background-color: var(--green-glow);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green-glow);
    }

    .balance-amount {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--gold-primary);
      text-shadow: 0 0 10px rgba(245, 207, 102, 0.3);
    }

    /* Action Buttons (Deposit & Withdraw) - Gold Glowing Upgrade */
    .action-buttons {
      display: flex;
      gap: 15px;
      padding: 0 20px 20px 20px;
    }

    .btn-action {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    /* Gold Glowing Gradient Effect */
    .btn-deposit {
      background: var(--gold-btn-gradient);
      color: #030d0a;
      box-shadow: 0 4px 18px rgba(245, 207, 102, 0.4), 0 0 10px rgba(245, 207, 102, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .btn-deposit::after, .btn-withdraw::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 40%;
      height: 200%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      transform: rotate(30deg);
      transition: all 0.6s ease;
      animation: goldShine 3s infinite;
    }

    @keyframes goldShine {
      0% { left: -60%; }
      20% { left: 140%; }
      100% { left: 140%; }
    }

    .btn-deposit:hover {
      box-shadow: 0 6px 25px rgba(245, 207, 102, 0.6), 0 0 15px rgba(245, 207, 102, 0.4);
      transform: translateY(-2px);
    }

    .btn-withdraw {
      background: rgba(12, 38, 29, 0.8);
      color: var(--gold-primary);
      border: 1px solid var(--gold-primary);
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3), inset 0 0 10px rgba(245, 207, 102, 0.05);
    }

    .btn-withdraw:hover {
      background: rgba(245, 207, 102, 0.15);
      border-color: #ffe082;
      box-shadow: 0 6px 20px rgba(245, 207, 102, 0.25);
      transform: translateY(-2px);
    }

    /* Dot Spinning Loader inside Buttons */
    .dot-loader {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .dot-loader span {
      width: 6px;
      height: 6px;
      background-color: currentColor;
      border-radius: 50%;
      display: inline-block;
      animation: dotBounce 1.4s infinite ease-in-out both;
    }

    .dot-loader span:nth-child(1) { animation-delay: -0.32s; }
    .dot-loader span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes dotBounce {
      0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }

    .btn-action.loading .btn-content {
      display: none;
    }

    .btn-action.loading .dot-loader {
      display: flex;
    }

    #bottom-nav-container {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      z-index: 1000;
    }

    /* --- Auth Warning Modal Overlay --- */
    .auth-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(3, 13, 10, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none; /* ডিফল্টভাবে হাইড থাকবে */
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 20px;
    }

    .auth-modal-card {
      background: var(--card-gradient);
      border: 1px solid var(--gold-primary);
      border-radius: 20px;
      padding: 28px 22px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 25px rgba(245, 207, 102, 0.2);
      animation: modalFadeIn 0.3s ease-out;
    }

    @keyframes modalFadeIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .auth-modal-icon {
      width: 60px;
      height: 60px;
      background: rgba(245, 207, 102, 0.15);
      border: 1px solid var(--gold-primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px auto;
      color: var(--gold-primary);
      font-size: 1.6rem;
      box-shadow: 0 0 15px rgba(245, 207, 102, 0.3);
    }

    .auth-modal-text {
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text-main);
      margin-bottom: 22px;
      font-weight: 400;
    }

    .btn-get-started {
      display: inline-block;
      width: 100%;
      padding: 14px 20px;
      background: var(--gold-gradient);
      color: #030d0a;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 12px;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(245, 207, 102, 0.3);
      transition: all 0.3s ease;
    }

    .btn-get-started:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(245, 207, 102, 0.4);
    }
  </style>
</head>
<body>

  <!-- 1.2s Page Loading Overlay -->
  <div class="page-loader" id="pageLoader">
    <div class="loader-icon-wrapper">
      <div class="loader-spinner"></div>
      <i class="fa-solid fa-wallet"></i>
    </div>
  </div>

  <div class="mobile-container">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="title-group">
        <a href="javascript:history.back()" class="back-btn">
          <i class="fa-solid fa-chevron-left"></i>
        </a>
        <h2>Wallet</h2>
      </div>
      <div class="notification-icon">
        <i class="fa-regular fa-bell"></i>
      </div>
    </div>

    <!-- Bank Card Section -->
    <div class="card-section">
      <div class="bank-card">
        <div class="card-top">
          <div class="user-info">
            <div class="label">Account Holder</div>
            <div class="user-name" id="user-name-display">Loading...</div>
          </div>
          <div class="card-chip"></div>
        </div>

        <div class="card-bottom">
          <div class="balance-label">
            <span class="live-dot"></span> Real Time Balance
          </div>
          <div class="balance-amount" id="user-balance-display">$0.00</div>
        </div>
      </div>
    </div>

    <!-- Quick Action Buttons -->
    <div class="action-buttons">
      <a href="deposit.html" class="btn-action btn-deposit" onclick="handleButtonClick(event, 'deposit.html', this)">
        <span class="btn-content">
          <i class="fa-solid fa-circle-arrow-down"></i> Deposit
        </span>
        <span class="dot-loader">
          <span></span><span></span><span></span>
        </span>
      </a>
      <a href="withdraw.html" class="btn-action btn-withdraw" onclick="handleButtonClick(event, 'withdraw.html', this)">
        <span class="btn-content">
          <i class="fa-solid fa-circle-arrow-up"></i> Withdraw
        </span>
        <span class="dot-loader">
          <span></span><span></span><span></span>
        </span>
      </a>
    </div>

    <!-- Container where bottom.html will be loaded -->
    <div id="bottom-nav-container"></div>
  </div>

  <!-- Auth Required Modal -->
  <div class="auth-modal-overlay" id="authModal">
    <div class="auth-modal-card">
      <div class="auth-modal-icon">
        <i class="fa-solid fa-user-lock"></i>
      </div>
      <p class="auth-modal-text">
        আপনার অ্যাকাউন্টটি লগইন করা নেই লগইন করুন অথবা নতুন অ্যাকাউন্ট তৈরি করুন স্বল্প মেয়াদ ইনভেস্ট করতে চাইলে
      </p>
      <a href="login-signup.html" class="btn-get-started">Get Started</a>
    </div>
  </div>

  <!-- 1. Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- 2. Supabase Configuration File -->
  <script src="supabase-config.js"></script>

  <!-- 3. Logic Script -->
  <script>
    let currentUserId = null;

    // ১.২ সেকেন্ড পেজ লোডিং অ্যানিমেশন নিয়ন্ত্রণ
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loader = document.getElementById('pageLoader');
        if (loader) {
          loader.classList.add('hidden');
        }
      }, 1200); // ১.২ সেকেন্ড (1200ms)
    });

    // ডট স্পিনিং অ্যানিমেশন সহ নেভিগেশন
    function handleButtonClick(e, targetUrl, btnElement) {
      e.preventDefault();
      btnElement.classList.add('loading');
      setTimeout(() => {
        window.location.href = targetUrl;
      }, 600); // 600ms স্পিনিং দেখিয়ে পেজ ট্রানজিশন হবে
    }

    // 'wallets' টেবিল থেকে শুধুই ব্যালেন্স আনার ফাংশন
    async function fetchBalanceOnly(client, userId) {
      const { data, error } = await client
        .from('wallets')
        .select('balance')
        .eq('user_id', userId)
        .single();

      if (data) {
        document.getElementById('user-balance-display').innerText = '$' + parseFloat(data.balance || 0).toFixed(2);
      } else {
        document.getElementById('user-balance-display').innerText = '$0.00';
        if (error) console.log("Balance fetch error:", error.message);
      }
    }

    async function loadWalletData() {
      const client = window._supabase || window.supabase;

      if (!client) {
        console.error("Supabase client properly initialized পাওয়া যায়নি!");
        return;
      }

      // ১. বর্তমান সেশনের অথেন্টিকেটেড ইউজার নেওয়া
      const { data: { user }, error: userError } = await client.auth.getUser();

      // ইউজার লগইন না থাকলে মডাল পপআপ দেখাবে
      if (userError || !user) {
        document.getElementById('user-name-display').innerText = "Guest";
        document.getElementById('authModal').style.display = 'flex';
        return;
      }

      currentUserId = user.id;

      // ২. কাস্টম 'user' টেবিল থেকে ইউজারের full_name লোড করা
      const { data: userData, error: userDataError } = await client
        .from('user')
        .select('full_name')
        .eq('id', currentUserId)
        .single();

      if (userData && userData.full_name) {
        document.getElementById('user-name-display').innerText = userData.full_name;
      } else {
        document.getElementById('user-name-display').innerText = user.email ? user.email.split('@')[0] : "User";
      }

      // ৩. প্রাথমিক ব্যালেন্স ফেচ করা
      await fetchBalanceOnly(client, currentUserId);

      // ৪. Realtime Listener: 'wallets' টেবিলে কোনো পরিবর্তন হলেই সাথে সাথে স্ক্রিনে আপডেট হবে
      client
        .channel('wallet-balance-changes')
        .on(
          'postgres_changes',
          {
            event: '*',
            schema: 'public',
            table: 'wallets',
            filter: `user_id=eq.${currentUserId}`
          },
          (payload) => {
            if (payload.new && payload.new.balance !== undefined) {
              document.getElementById('user-balance-display').innerText = '$' + parseFloat(payload.new.balance).toFixed(2);
            }
          }
        )
        .subscribe();

      // ৫. Realtime Listener: 'transactions' টেবিল আপডেট হয়ে status = 'approved' হলেই ব্যালেন্স রিলোড হবে
      client
        .channel('transactions-status-changes')
        .on(
          'postgres_changes',
          {
            event: 'UPDATE',
            schema: 'public',
            table: 'transactions',
            filter: `user_id=eq.${currentUserId}`
          },
          (payload) => {
            if (payload.new && payload.new.status === 'approved') {
              fetchBalanceOnly(client, currentUserId);
            }
          }
        )
        .subscribe();
    }

    // bottom.html লোড করা
    fetch('bottom.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('bottom-nav-container').innerHTML = html;
      })
      .catch(err => console.log('Error loading bottom.html:', err));

    // পেজ লোড সম্পন্ন হলে ফায়ার করবে
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(loadWalletData, 100);
    });
  </script>
</body>
</html>
