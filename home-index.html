<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goldmine Digital - Mining & Investment</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-color: #061913;
            --card-bg: rgba(12, 38, 29, 0.85);
            --card-border: rgba(46, 213, 115, 0.25);
            --text-primary: #ffffff;
            --text-secondary: #8da499;
            --gold-primary: #f5cf66;
            --gold-gradient: linear-gradient(135deg, #e5ba41 0%, #fbe89d 50%, #b88a1a 100%);
            --accent-green: #2ed573;
            --accent-cyan: #00e5ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden; /* Fix landing page without unwanted scroll */
            background-color: #030d0a;
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Mobile Container Frame */
        .mobile-container {
            width: 100%;
            max-width: 410px;
            height: 100vh;
            max-height: 890px;
            background: var(--bg-color);
            border-radius: 25px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.9), 0 0 15px rgba(46, 213, 115, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Header */
        header {
            padding: 18px 20px 8px 20px;
            text-align: center;
        }

        .brand-logo {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            color: var(--gold-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-shadow: 0 0 10px rgba(245, 207, 102, 0.3);
        }

        .brand-logo span {
            color: #ffffff;
            font-weight: 400;
        }

        /* Main Content Fixed Layout */
        .content {
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-grow: 1;
            justify-content: center;
        }

        /* Card Container with Premium Glow */
        .dashboard-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 14px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .card-title {
            font-size: 0.72rem;
            color: var(--text-secondary);
            font-weight: 600;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }

        .price-badge {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
        }

        .badge-green {
            color: var(--accent-green);
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 5px;
        }

        /* Enhanced High-End Chart Wrapper */
        .chart-box {
            width: 100%;
            height: 110px;
            margin-top: 6px;
            position: relative;
        }

        /* Crypto Section with Live Chart */
        .crypto-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .crypto-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .crypto-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.82rem;
            font-weight: 600;
        }

        .crypto-info i {
            color: var(--gold-primary);
            font-size: 1rem;
        }

        .crypto-val {
            font-size: 0.88rem;
            font-weight: 700;
        }

        /* Holdings Section */
        .holdings-box {
            padding: 0 4px;
        }

        .holdings-title {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .progress-bar-bg {
            width: 100%;
            height: 7px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 68%;
            height: 100%;
            background: var(--accent-green);
            border-radius: 10px;
            box-shadow: 0 0 10px var(--accent-green);
        }

        /* CTA Button */
        .btn-gold {
            width: 100%;
            padding: 13px;
            background: var(--gold-gradient);
            border: none;
            border-radius: 25px;
            color: #030d0a;
            font-weight: 700;
            font-size: 0.92rem;
            letter-spacing: 0.6px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(245, 207, 102, 0.45);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-gold:active {
            transform: scale(0.98);
        }

        /* External Bottom Nav Placeholder */
        #bottom-nav-container {
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- Header -->
        <header>
            <div class="brand-logo">
                GOLDMINE <span>DIGITAL</span>
            </div>
        </header>

        <!-- Main Dashboard Content -->
        <div class="content">
            
            <!-- Box 1: Premium Real-time Gold Price & Graph -->
            <div class="dashboard-card">
                <div class="card-title">CURRENT GOLD PRICE</div>
                <div class="price-badge">
                    $<span id="gold-price">2,180.35</span>/oz 
                    <span class="badge-green">(UP +<span id="gold-change">1.4</span>%)</span>
                </div>
                <div class="chart-box">
                    <canvas id="goldChart"></canvas>
                </div>
            </div>

            <!-- Box 2: Crypto Rates with Dedicated Live Chart -->
            <div class="dashboard-card">
                <div class="card-header">
                    <div class="card-title">MARKET RATES (CRYPTO LIVE GRAPH)</div>
                    <span class="badge-green" style="font-size:0.65rem;"><i class="fa-solid fa-circle" style="font-size:0.4rem;"></i> LIVE</span>
                </div>
                
                <div class="crypto-container">
                    <div class="crypto-row">
                        <div class="crypto-info">
                            <i class="fa-brands fa-bitcoin"></i>
                            <span>BTC / USD</span>
                        </div>
                        <div class="crypto-val">$<span id="btc-price">65,420.00</span></div>
                    </div>

                    <!-- Crypto Real-time Graph Box -->
                    <div class="chart-box" style="height: 75px;">
                        <canvas id="cryptoChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Holdings Section -->
            <div class="holdings-box">
                <div class="holdings-title">
                    <span>MY HOLDINGS</span>
                    <span style="color:var(--gold-primary)">15.3 oz</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill"></div>
                </div>
            </div>

            <!-- Start Investing CTA Button -->
            <button class="btn-gold" onclick="window.location.href='login-signup.html'">START INVESTING</button>

        </div>

        <!-- Dynamic Bottom Nav Connection -->
        <div id="bottom-nav-container"></div>
    </div>

    <!-- Script Section -->
    <script>
        // 1. Fetch & Append bottom.html dynamically
        fetch('bottom.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('bottom-nav-container').innerHTML = data;
            })
            .catch(error => console.error('Error loading bottom navigation:', error));

        // 2. High-End Gold Chart Implementation
        const goldCtx = document.getElementById('goldChart').getContext('2d');
        const goldGradient = goldCtx.createLinearGradient(0, 0, 0, 110);
        goldGradient.addColorStop(0, 'rgba(245, 207, 102, 0.45)');
        goldGradient.addColorStop(1, 'rgba(245, 207, 102, 0.0)');

        const goldChart = new Chart(goldCtx, {
            type: 'line',
            data: {
                labels: ['1', '2', '3', '4', '5', '6', '7', '8'],
                datasets: [{
                    data: [2165, 2170, 2168, 2176, 2172, 2179, 2180.35, 2184],
                    borderColor: '#f5cf66',
                    borderWidth: 2.5,
                    fill: true,
                    backgroundColor: goldGradient,
                    tension: 0.45, // Extra smooth curves
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { display: false },
                    y: { display: false }
                }
            }
        });

        // 3. Crypto Live Chart Implementation
        const cryptoCtx = document.getElementById('cryptoChart').getContext('2d');
        const cryptoGradient = cryptoCtx.createLinearGradient(0, 0, 0, 75);
        cryptoGradient.addColorStop(0, 'rgba(46, 213, 115, 0.35)');
        cryptoGradient.addColorStop(1, 'rgba(46, 213, 115, 0.0)');

        const cryptoChart = new Chart(cryptoCtx, {
            type: 'line',
            data: {
                labels: ['1', '2', '3', '4', '5', '6'],
                datasets: [{
                    data: [64800, 65100, 64950, 65300, 65200, 65420],
                    borderColor: '#2ed573',
                    borderWidth: 2,
                    fill: true,
                    backgroundColor: cryptoGradient,
                    tension: 0.4,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { display: false },
                    y: { display: false }
                }
            }
        });

        // Live Real-time Price Update Simulation
        setInterval(() => {
            // Gold price update
            let currentGold = parseFloat(document.getElementById('gold-price').innerText.replace(',', ''));
            let newGold = (currentGold + (Math.random() - 0.47) * 1.8).toFixed(2);
            document.getElementById('gold-price').innerText = Number(newGold).toLocaleString('en-US', {minimumFractionDigits: 2});
            
            goldChart.data.datasets[0].data.shift();
            goldChart.data.datasets[0].data.push(newGold);
            goldChart.update();

            // Crypto BTC price update
            let btcPrice = parseFloat(document.getElementById('btc-price').innerText.replace(',', ''));
            let newBtc = (btcPrice + (Math.random() - 0.48) * 35).toFixed(2);
            document.getElementById('btc-price').innerText = Number(newBtc).toLocaleString('en-US', {minimumFractionDigits: 2});

            cryptoChart.data.datasets[0].data.shift();
            cryptoChart.data.datasets[0].data.push(newBtc);
            cryptoChart.update();
        }, 3000);
    </script>
</body>
</html>
