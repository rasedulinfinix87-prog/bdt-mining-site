<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Goldmine Digital - Mining & Investment</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-color: #061913;
            --card-bg: rgba(12, 38, 29, 0.85);
            --card-border: rgba(46, 213, 115, 0.25);
            --text-primary: #ffffff;
            --text-secondary: #8da499;
            --gold-primary: #f5cf66;
            --gold-gradient: linear-gradient(135deg, #e5ba41 0%, #fbe89d 50%, #b88a1a 100%);
            --accent-green: #2ed573;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #030d0a;
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            overflow: hidden;
        }

        html {
            height: -webkit-fill-available;
        }

        /* Loader Overlay */
        #loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #030d0a;
            background-image: radial-gradient(circle at 50% 45%, #061913 0%, #030d0a 85%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #loader-overlay.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .loader-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ring-outer {
            position: absolute;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--gold-primary);
            border-bottom-color: var(--accent-green);
            animation: spinRing 2.5s linear infinite;
            filter: drop-shadow(0 0 10px rgba(245, 207, 102, 0.5));
        }

        .ring-inner {
            position: absolute;
            width: 85px;
            height: 85px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-left-color: var(--gold-primary);
            border-right-color: var(--accent-green);
            animation: spinRingReverse 1.8s linear infinite;
            opacity: 0.8;
        }

        .gold-icon-box {
            width: 60px;
            height: 60px;
            background: rgba(12, 38, 29, 0.9);
            border: 1px solid var(--gold-primary);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6rem;
            color: var(--gold-primary);
            box-shadow: 0 0 20px rgba(245, 207, 102, 0.4), inset 0 0 10px rgba(245, 207, 102, 0.2);
            animation: pulseIcon 1.5s ease-in-out infinite alternate;
        }

        .loader-brand {
            margin-top: 25px;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--gold-primary);
            text-shadow: 0 0 12px rgba(245, 207, 102, 0.4);
        }

        .loader-brand span {
            color: #ffffff;
            font-weight: 400;
        }

        .loader-subtext {
            font-size: 0.72rem;
            color: var(--text-secondary);
            margin-top: 6px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            animation: pulseSubtext 1.2s ease-in-out infinite alternate;
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spinRingReverse {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes pulseIcon {
            0% { transform: scale(0.92); box-shadow: 0 0 12px rgba(245, 207, 102, 0.3); }
            100% { transform: scale(1.05); box-shadow: 0 0 25px rgba(245, 207, 102, 0.7); }
        }

        @keyframes pulseSubtext {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Mobile Container */
        .mobile-container {
            width: 100%;
            max-width: 410px;
            height: 100vh;
            height: 100dvh;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        header {
            padding: 25px 20px 10px 20px;
            text-align: center;
            flex-shrink: 0;
        }

        .brand-logo {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--gold-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-shadow: 0 0 12px rgba(245, 207, 102, 0.35);
        }

        .brand-logo span {
            color: #ffffff;
            font-weight: 400;
        }

        .content {
            padding: 10px 16px 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            flex: 1;
            justify-content: space-evenly;
        }

        .dashboard-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 14px 16px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .card-title {
            font-size: 0.72rem;
            color: var(--text-secondary);
            font-weight: 600;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }

        .price-badge {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
        }

        .badge-green {
            color: var(--accent-green);
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 5px;
        }

        .chart-box {
            width: 100%;
            height: 100px;
            margin-top: 8px;
        }

        .crypto-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .crypto-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .crypto-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.82rem;
            font-weight: 600;
        }

        .crypto-info i {
            color: var(--gold-primary);
            font-size: 1rem;
        }

        .crypto-val {
            font-size: 0.88rem;
            font-weight: 700;
        }

        .cta-wrapper {
            margin-top: 10px;
            padding: 0 4px;
        }

        .btn-gold {
            width: 100%;
            padding: 14px;
            background: var(--gold-gradient);
            border: none;
            border-radius: 25px;
            color: #030d0a;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.8px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(245, 207, 102, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-gold:active {
            transform: scale(0.98);
        }

        #bottom-nav-container {
            width: 100%;
            flex-shrink: 0;
        }

        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 0 18px 0;
            background: #061913;
            border-top: 1px solid rgba(46, 213, 115, 0.25);
            width: 100%;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #8da499;
            font-size: 0.72rem;
            text-decoration: none;
        }

        .nav-item:hover, .nav-item.active {
            color: #f5cf66;
        }

        .nav-item i {
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <!-- Premium Fullscreen Loading Overlay -->
    <div id="loader-overlay">
        <div class="loader-wrapper">
            <div class="ring-outer"></div>
            <div class="ring-inner"></div>
            <div class="gold-icon-box">
                <i class="fa-solid fa-coins"></i>
            </div>
        </div>
        <div class="loader-brand">GOLDMINE <span>DIGITAL</span></div>
        <div class="loader-subtext">Securing Asset Vault...</div>
    </div>

    <div class="mobile-container">
        <!-- Header -->
        <header>
            <div class="brand-logo">
                GOLDMINE <span>DIGITAL</span>
            </div>
        </header>

        <!-- Main Dashboard Content -->
        <div class="content">
            
            <!-- Box 1: Gold Price & 15-Day Trend Graph -->
            <div class="dashboard-card">
                <div class="card-header">
                    <div class="card-title">CURRENT GOLD PRICE</div>
                    <span style="font-size: 0.65rem; color: var(--gold-primary); font-weight: 600;">15 DAYS TREND</span>
                </div>
                <div class="price-badge">
                    $<span id="gold-price">2,184.65</span>/oz 
                    <span class="badge-green">(UP +<span id="gold-change">1.4</span>%)</span>
                </div>
                <div class="chart-box">
                    <canvas id="goldChart"></canvas>
                </div>
            </div>

            <!-- Box 2: Crypto Rates & 15-Day Trend Graph -->
            <div class="dashboard-card">
                <div class="card-header">
                    <div class="card-title">MARKET RATES (CRYPTO)</div>
                    <span class="badge-green" style="font-size:0.65rem;"><i class="fa-solid fa-circle" style="font-size:0.4rem;"></i> LIVE</span>
                </div>
                
                <div class="crypto-container">
                    <div class="crypto-row">
                        <div class="crypto-info">
                            <i class="fa-brands fa-bitcoin"></i>
                            <span>BTC / USD</span>
                        </div>
                        <div class="crypto-val">$<span id="btc-price">65,411.58</span></div>
                    </div>

                    <!-- Crypto 15 Days Dynamic Graph Box -->
                    <div class="chart-box" style="height: 75px;">
                        <canvas id="cryptoChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Start Investing Button -->
            <div class="cta-wrapper">
                <button class="btn-gold" onclick="window.location.href='login-signup.html'">START INVESTING</button>
            </div>

        </div>

        <!-- Dynamic / Fallback Bottom Nav Container -->
        <div id="bottom-nav-container">
            <nav class="bottom-nav">
                <a href="javascript:history.back()" class="nav-item">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Back</span>
                </a>
                <a href="portfolio.html" class="nav-item">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>Portfolio</span>
                </a>
                <a href="wallet.html" class="nav-item">
                    <i class="fa-solid fa-wallet"></i>
                    <span>Wallet</span>
                </a>
                <a href="settings.html" class="nav-item">
                    <i class="fa-solid fa-gear"></i>
                    <span>Settings</span>
                </a>
            </nav>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const minAnimationDuration = 2500;
        const pageStartTime = Date.now();

        window.addEventListener('load', function() {
            const elapsedTime = Date.now() - pageStartTime;
            const remainingTime = Math.max(0, minAnimationDuration - elapsedTime);

            setTimeout(function() {
                const loader = document.getElementById('loader-overlay');
                if (loader) {
                    loader.classList.add('fade-out');
                    document.body.style.overflow = 'auto';
                }
            }, remainingTime);
        });

        fetch('bottom.html?v=' + new Date().getTime())
            .then(response => {
                if(response.ok) return response.text();
            })
            .then(data => {
                if(data) document.getElementById('bottom-nav-container').innerHTML = data;
            })
            .catch(error => console.log('Using default bottom nav'));

        // রিয়েল মার্কেটের মতো ওঠানামা (Zig-Zag / Fluctuating) করার জন্য মিক্সড ডেটা পয়েন্ট
        const goldPoints = [
            2160, 2175, 2150, 2182, 2170, 2195, 2180, 2210, 2190, 2205, 
            2185, 2200, 2175, 2190, 2165, 2185, 2170, 2192, 2178, 2202,
            2188, 2215, 2195, 2220, 2200, 2212, 2198, 2185, 2180, 2184
        ];
        const daysLabels = Array.from({length: goldPoints.length}, (_, i) => `Point ${i + 1}`);

        // Gold Chart Implementation
        const goldCtx = document.getElementById('goldChart').getContext('2d');
        const goldGradient = goldCtx.createLinearGradient(0, 0, 0, 100);
        goldGradient.addColorStop(0, 'rgba(245, 207, 102, 0.4)');
        goldGradient.addColorStop(1, 'rgba(245, 207, 102, 0.0)');

        const goldChart = new Chart(goldCtx, {
            type: 'line',
            data: {
                labels: daysLabels,
                datasets: [{
                    data: goldPoints,
                    borderColor: '#f5cf66',
                    borderWidth: 2,
                    fill: true,
                    backgroundColor: goldGradient,
                    tension: 0.25,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { x: { display: false }, y: { display: false } }
            }
        });

        // Crypto Chart Implementation (Fluctuating market data)
        const cryptoPoints = [
            64000, 65200, 63800, 65500, 64200, 66100, 64900, 66800, 65200, 66400, 
            64800, 65900, 64300, 65600, 63900, 65100, 64400, 65800, 64700, 66200,
            65100, 66700, 65300, 67000, 65500, 66300, 65000, 64800, 64200, 65400
        ];
        const cryptoCtx = document.getElementById('cryptoChart').getContext('2d');
        const cryptoGradient = cryptoCtx.createLinearGradient(0, 0, 0, 75);
        cryptoGradient.addColorStop(0, 'rgba(46, 213, 115, 0.35)');
        cryptoGradient.addColorStop(1, 'rgba(46, 213, 115, 0.0)');

        const cryptoChart = new Chart(cryptoCtx, {
            type: 'line',
            data: {
                labels: daysLabels,
                datasets: [{
                    data: cryptoPoints,
                    borderColor: '#2ed573',
                    borderWidth: 2,
                    fill: true,
                    backgroundColor: cryptoGradient,
                    tension: 0.25,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { x: { display: false }, y: { display: false } }
            }
        });

        // Real-time market update simulation
        setInterval(() => {
            let currentGold = parseFloat(document.getElementById('gold-price').innerText.replace(',', ''));
            let newGold = (currentGold + (Math.random() - 0.49) * 2.0).toFixed(2);
            document.getElementById('gold-price').innerText = Number(newGold).toLocaleString('en-US', {minimumFractionDigits: 2});
            
            goldChart.data.datasets[0].data.shift();
            goldChart.data.datasets[0].data.push(newGold);
            goldChart.update();

            let btcPrice = parseFloat(document.getElementById('btc-price').innerText.replace(',', ''));
            let newBtc = (btcPrice + (Math.random() - 0.49) * 45).toFixed(2);
            document.getElementById('btc-price').innerText = Number(newBtc).toLocaleString('en-US', {minimumFractionDigits: 2});

            cryptoChart.data.datasets[0].data.shift();
            cryptoChart.data.datasets[0].data.push(newBtc);
            cryptoChart.update();
        }, 3000);
    </script>
</body>
</html>
