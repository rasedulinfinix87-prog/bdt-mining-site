<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Goldmine Digital - Mining & Investment</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-color: #061913;
            --card-bg: rgba(12, 38, 29, 0.85);
            --card-border: rgba(46, 213, 115, 0.25);
            --text-primary: #ffffff;
            --text-secondary: #8da499;
            --gold-primary: #f5cf66;
            --gold-gradient: linear-gradient(135deg, #e5ba41 0%, #fbe89d 50%, #b88a1a 100%);
            --accent-green: #2ed573;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            background-color: #030d0a;
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Responsive Mobile Container Frame */
        .mobile-container {
            width: 100%;
            max-width: 410px;
            height: 100vh;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
        }

        /* Header Fix */
        header {
            padding: 15px 20px 5px 20px;
            text-align: center;
            flex-shrink: 0;
        }

        .brand-logo {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            color: var(--gold-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-shadow: 0 0 10px rgba(245, 207, 102, 0.3);
        }

        .brand-logo span {
            color: #ffffff;
            font-weight: 400;
        }

        /* Main Content Layout Adjustments */
        .content {
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 1;
            justify-content: flex-start;
            overflow-y: auto;
        }

        /* Card Container with Premium Glow */
        .dashboard-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 14px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .card-title {
            font-size: 0.72rem;
            color: var(--text-secondary);
            font-weight: 600;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }

        .price-badge {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
        }

        .badge-green {
            color: var(--accent-green);
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 5px;
        }

        /* 15 Days Trend Graph Box */
        .chart-box {
            width: 100%;
            height: 115px;
            margin-top: 6px;
        }

        /* Crypto Live Container */
        .crypto-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .crypto-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .crypto-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.82rem;
            font-weight: 600;
        }

        .crypto-info i {
            color: var(--gold-primary);
            font-size: 1rem;
        }

        .crypto-val {
            font-size: 0.88rem;
            font-weight: 700;
        }

        /* Start Investing CTA Button Spacing */
        .cta-wrapper {
            margin-top: auto;
            padding-top: 10px;
            padding-bottom: 5px;
        }

        .btn-gold {
            width: 100%;
            padding: 14px;
            background: var(--gold-gradient);
            border: none;
            border-radius: 25px;
            color: #030d0a;
            font-weight: 700;
            font-size: 0.92rem;
            letter-spacing: 0.6px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(245, 207, 102, 0.45);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-gold:active {
            transform: scale(0.98);
        }

        #bottom-nav-container {
            width: 100%;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- Header -->
        <header>
            <div class="brand-logo">
                GOLDMINE <span>DIGITAL</span>
            </div>
        </header>

        <!-- Main Dashboard Content -->
        <div class="content">
            
            <!-- Box 1: Gold Price & 15-Day Trend Graph -->
            <div class="dashboard-card">
                <div class="card-header">
                    <div class="card-title">CURRENT GOLD PRICE</div>
                    <span style="font-size: 0.65rem; color: var(--gold-primary); font-weight: 600;">15 DAYS TREND</span>
                </div>
                <div class="price-badge">
                    $<span id="gold-price">2,184.00</span>/oz 
                    <span class="badge-green">(UP +<span id="gold-change">1.4</span>%)</span>
                </div>
                <div class="chart-box">
                    <canvas id="goldChart"></canvas>
                </div>
            </div>

            <!-- Box 2: Crypto Rates & 15-Day Trend Graph -->
            <div class="dashboard-card">
                <div class="card-header">
                    <div class="card-title">MARKET RATES (CRYPTO)</div>
                    <span class="badge-green" style="font-size:0.65rem;"><i class="fa-solid fa-circle" style="font-size:0.4rem;"></i> LIVE</span>
                </div>
                
                <div class="crypto-container">
                    <div class="crypto-row">
                        <div class="crypto-info">
                            <i class="fa-brands fa-bitcoin"></i>
                            <span>BTC / USD</span>
                        </div>
                        <div class="crypto-val">$<span id="btc-price">65,432.03</span></div>
                    </div>

                    <!-- Crypto 15 Days Dynamic Graph Box -->
                    <div class="chart-box" style="height: 85px;">
                        <canvas id="cryptoChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Start Investing Button Container -->
            <div class="cta-wrapper">
                <button class="btn-gold" onclick="window.location.href='login-signup.html'">START INVESTING</button>
            </div>

        </div>

        <!-- Dynamic Bottom Nav Connection -->
        <div id="bottom-nav-container"></div>
    </div>

    <!-- JavaScript Section -->
    <script>
        // 1. Fetch & Append bottom.html dynamically
        fetch('bottom.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('bottom-nav-container').innerHTML = data;
            })
            .catch(error => console.error('Error loading bottom navigation:', error));

        // 15 Days Labels Array
        const daysLabels = ['Day 1', 'Day 2', 'Day 3', 'Day 4', 'Day 5', 'Day 6', 'Day 7', 'Day 8', 'Day 9', 'Day 10', 'Day 11', 'Day 12', 'Day 13', 'Day 14', 'Day 15'];

        // 2. High-End 15-Day Gold Chart
        const goldCtx = document.getElementById('goldChart').getContext('2d');
        const goldGradient = goldCtx.createLinearGradient(0, 0, 0, 115);
        goldGradient.addColorStop(0, 'rgba(245, 207, 102, 0.45)');
        goldGradient.addColorStop(1, 'rgba(245, 207, 102, 0.0)');

        const goldChart = new Chart(goldCtx, {
            type: 'line',
            data: {
                labels: daysLabels,
                datasets: [{
                    data: [2110, 2115, 2108, 2125, 2130, 2128, 2140, 2148, 2142, 2155, 2160, 2168, 2175, 2180, 2184],
                    borderColor: '#f5cf66',
                    borderWidth: 2.5,
                    fill: true,
                    backgroundColor: goldGradient,
                    tension: 0.4,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { display: false },
                    y: { display: false }
                }
            }
        });

        // 3. High-End 15-Day Crypto Chart
        const cryptoCtx = document.getElementById('cryptoChart').getContext('2d');
        const cryptoGradient = cryptoCtx.createLinearGradient(0, 0, 0, 85);
        cryptoGradient.addColorStop(0, 'rgba(46, 213, 115, 0.35)');
        cryptoGradient.addColorStop(1, 'rgba(46, 213, 115, 0.0)');

        const cryptoChart = new Chart(cryptoCtx, {
            type: 'line',
            data: {
                labels: daysLabels,
                datasets: [{
                    data: [61200, 61800, 61500, 62400, 62100, 63000, 62800, 63500, 64200, 63900, 64500, 64800, 65100, 65000, 65432],
                    borderColor: '#2ed573',
                    borderWidth: 2,
                    fill: true,
                    backgroundColor: cryptoGradient,
                    tension: 0.4,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { display: false },
                    y: { display: false }
                }
            }
        });

        // Live Real-time Price Updates
        setInterval(() => {
            let currentGold = parseFloat(document.getElementById('gold-price').innerText.replace(',', ''));
            let newGold = (currentGold + (Math.random() - 0.47) * 1.5).toFixed(2);
            document.getElementById('gold-price').innerText = Number(newGold).toLocaleString('en-US', {minimumFractionDigits: 2});
            
            goldChart.data.datasets[0].data.shift();
            goldChart.data.datasets[0].data.push(newGold);
            goldChart.update();

            let btcPrice = parseFloat(document.getElementById('btc-price').innerText.replace(',', ''));
            let newBtc = (btcPrice + (Math.random() - 0.48) * 30).toFixed(2);
            document.getElementById('btc-price').innerText = Number(newBtc).toLocaleString('en-US', {minimumFractionDigits: 2});

            cryptoChart.data.datasets[0].data.shift();
            cryptoChart.data.datasets[0].data.push(newBtc);
            cryptoChart.update();
        }, 3000);
    </script>
</body>
</html>
