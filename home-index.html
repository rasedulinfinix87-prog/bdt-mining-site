<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goldmine Digital - Mining & Investment</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js CDN for Real-time Chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-color: #061913;
            --card-bg: rgba(12, 38, 29, 0.75);
            --card-border: rgba(46, 213, 115, 0.2);
            --text-primary: #ffffff;
            --text-secondary: #8da499;
            --gold-primary: #f5cf66;
            --gold-gradient: linear-gradient(135deg, #e5ba41 0%, #fbe89d 50%, #b88a1a 100%);
            --accent-green: #2ed573;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #030d0a;
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 0;
        }

        /* Mobile Container Frame */
        .mobile-container {
            width: 100%;
            max-width: 410px;
            background: var(--bg-color);
            min-height: 100vh;
            border-radius: 25px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.8), 0 0 15px rgba(46, 213, 115, 0.15);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Header */
        header {
            padding: 20px 20px 10px 20px;
            text-align: center;
        }

        .brand-logo {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--gold-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .brand-logo span {
            color: #ffffff;
            font-weight: 400;
        }

        /* Main Content */
        .content {
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Card Container */
        .dashboard-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 14px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .card-title {
            font-size: 0.72rem;
            color: var(--text-secondary);
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .price-badge {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
        }

        .badge-green {
            color: var(--accent-green);
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 5px;
        }

        /* Chart Wrapper */
        .chart-box {
            width: 100%;
            height: 100px;
            margin-top: 5px;
        }

        /* Crypto & Dollar Grid inside second box */
        .crypto-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 6px;
        }

        .crypto-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .crypto-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .crypto-info i {
            color: var(--gold-primary);
        }

        .crypto-val {
            font-size: 0.85rem;
            font-weight: 700;
        }

        /* Holdings Section */
        .holdings-box {
            margin-top: 2px;
        }

        .holdings-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 65%;
            height: 100%;
            background: var(--accent-green);
            border-radius: 10px;
            box-shadow: 0 0 8px var(--accent-green);
        }

        /* CTA Button */
        .btn-gold {
            width: 100%;
            padding: 13px;
            background: var(--gold-gradient);
            border: none;
            border-radius: 25px;
            color: #030d0a;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(245, 207, 102, 0.4);
            margin-top: 5px;
            transition: transform 0.2s;
        }

        .btn-gold:active {
            transform: scale(0.98);
        }

        /* Bottom Nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 0 16px 0;
            background: rgba(3, 13, 10, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: var(--text-secondary);
            font-size: 0.65rem;
            text-decoration: none;
        }

        .nav-item.active {
            color: var(--gold-primary);
        }

        .nav-item i {
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- Header -->
        <header>
            <div class="brand-logo">
                GOLDMINE <span>DIGITAL</span>
            </div>
        </header>

        <!-- Main Dashboard Content -->
        <div class="content">
            
            <!-- Box 1: Real-time Gold Price & Graph -->
            <div class="dashboard-card">
                <div class="card-title">CURRENT GOLD PRICE:</div>
                <div class="price-badge">
                    $<span id="gold-price">2,180.35</span>/oz 
                    <span class="badge-green">(UP +<span id="gold-change">1.2</span>%)</span>
                </div>
                <div class="chart-box">
                    <canvas id="goldChart"></canvas>
                </div>
            </div>

            <!-- Box 2: Crypto & Dollar Market Rates -->
            <div class="dashboard-card">
                <div class="card-header">
                    <div class="card-title">MARKET RATES (CRYPTO & DOLLAR)</div>
                    <span class="badge-green" style="font-size:0.65rem;"><i class="fa-solid fa-circle" style="font-size:0.4rem;"></i> LIVE</span>
                </div>
                
                <div class="crypto-grid">
                    <!-- Bitcoin Rate -->
                    <div class="crypto-item">
                        <div class="crypto-info">
                            <i class="fa-brands fa-bitcoin"></i>
                            <span>Bitcoin (BTC)</span>
                        </div>
                        <div class="crypto-val">$<span id="btc-price">65,420.00</span></div>
                    </div>

                    <!-- Ethereum Rate -->
                    <div class="crypto-item">
                        <div class="crypto-info">
                            <i class="fa-brands fa-ethereum"></i>
                            <span>Ethereum (ETH)</span>
                        </div>
                        <div class="crypto-val">$<span id="eth-price">3,480.50</span></div>
                    </div>

                    <!-- USDT / Dollar Index Rate -->
                    <div class="crypto-item">
                        <div class="crypto-info">
                            <i class="fa-solid fa-dollar-sign"></i>
                            <span>USD / USDT Rate</span>
                        </div>
                        <div class="crypto-val">$<span id="usdt-price">1.00</span></div>
                    </div>
                </div>
            </div>

            <!-- Holdings Section -->
            <div class="holdings-box">
                <div class="holdings-title">MY HOLDINGS: 15.3 oz</div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill"></div>
                </div>
            </div>

            <!-- Start Investing CTA Button -->
            <button class="btn-gold" onclick="window.location.href='signup.html'">START INVESTING</button>

        </div>

        <!-- Bottom Navigation Bar -->
        <nav class="bottom-nav">
            <a href="#" class="nav-item active">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fa-solid fa-vault"></i>
                <span>Vault</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fa-solid fa-chart-pie"></i>
                <span>Portfolio</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fa-solid fa-store"></i>
                <span>Market</span>
            </a>
        </nav>
    </div>

    <!-- JavaScript Logic for Live Updating Chart & Prices -->
    <script>
        // Setup Chart.js Real-time Gold Chart
        const ctx = document.getElementById('goldChart').getContext('2d');
        
        // Gradient background under line
        const gradient = ctx.createLinearGradient(0, 0, 0, 100);
        gradient.addColorStop(0, 'rgba(245, 207, 102, 0.35)');
        gradient.addColorStop(1, 'rgba(245, 207, 102, 0)');

        const goldData = [2170, 2172, 2168, 2175, 2173, 2178, 2180.35];

        const goldChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['1', '2', '3', '4', '5', '6', '7'],
                datasets: [{
                    data: goldData,
                    borderColor: '#f5cf66',
                    borderWidth: 2,
                    fill: true,
                    backgroundColor: gradient,
                    tension: 0.4,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { display: false },
                    y: { display: false }
                }
            }
        });

        // Real-time Dynamic Data Update Simulation Logic
        function updateMarketData() {
            // Gold Price Fluctuation Logic
            let currentGold = parseFloat(document.getElementById('gold-price').innerText.replace(',', ''));
            let randomGoldChange = (Math.random() - 0.48) * 1.5;
            let newGoldPrice = (currentGold + randomGoldChange).toFixed(2);
            document.getElementById('gold-price').innerText = Number(newGoldPrice).toLocaleString('en-US', {minimumFractionDigits: 2});

            // Update Chart Dataset dynamically
            goldChart.data.datasets[0].data.shift();
            goldChart.data.datasets[0].data.push(newGoldPrice);
            goldChart.update();

            // Bitcoin Price Fluctuation
            let btcPrice = parseFloat(document.getElementById('btc-price').innerText.replace(',', ''));
            let newBtc = (btcPrice + (Math.random() - 0.49) * 20).toFixed(2);
            document.getElementById('btc-price').innerText = Number(newBtc).toLocaleString('en-US', {minimumFractionDigits: 2});

            // Ethereum Price Fluctuation
            let ethPrice = parseFloat(document.getElementById('eth-price').innerText.replace(',', ''));
            let newEth = (ethPrice + (Math.random() - 0.49) * 3).toFixed(2);
            document.getElementById('eth-price').innerText = Number(newEth).toLocaleString('en-US', {minimumFractionDigits: 2});
        }

        // Trigger market updates every 3 seconds
        setInterval(updateMarketData, 3000);
    </script>
</body>
</html>
