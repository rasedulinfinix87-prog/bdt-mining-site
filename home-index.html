<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Goldmine Digital - Mining & Investment</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-color: #061913;
            --card-bg: rgba(12, 38, 29, 0.85);
            --card-border: rgba(46, 213, 115, 0.25);
            --text-primary: #ffffff;
            --text-secondary: #8da499;
            --gold-primary: #f5cf66;
            --gold-gradient: linear-gradient(135deg, #e5ba41 0%, #fbe89d 50%, #b88a1a 100%);
            --accent-green: #2ed573;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #030d0a;
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            overflow: hidden; /* Prevent scroll while loading */
        }

        html {
            height: -webkit-fill-available;
        }

        /* Fullscreen Loading Overlay */
        #loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #030d0a;
            background-image: radial-gradient(circle at 50% 40%, #061913 0%, #030d0a 80%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #loader-overlay.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        /* Monument Loader Styling */
        .monument-container {
            position: relative;
            width: 200px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .monument-svg {
            width: 100%;
            height: 100%;
        }

        /* Smooth 2.5s Drawing & Glowing Animation */
        .monument-path polygon, .monument-path path {
            stroke-dasharray: 800;
            stroke-dashoffset: 800;
            animation: drawMonument 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
        }

        @keyframes drawMonument {
            0% {
                stroke-dashoffset: 800;
                fill: rgba(245, 207, 102, 0.0);
                stroke: rgba(245, 207, 102, 0.3);
                filter: drop-shadow(0 0 2px rgba(46, 213, 115, 0.2));
            }
            50% {
                fill: rgba(245, 207, 102, 0.15);
                stroke: #f5cf66;
                filter: drop-shadow(0 0 10px rgba(245, 207, 102, 0.5));
            }
            100% {
                stroke-dashoffset: 0;
                fill: rgba(245, 207, 102, 0.3);
                stroke: #f5cf66;
                filter: drop-shadow(0 0 20px rgba(245, 207, 102, 0.8));
            }
        }

        /* Glowing Loader Text */
        .loader-brand {
            margin-top: 25px;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--gold-primary);
            text-shadow: 0 0 12px rgba(245, 207, 102, 0.4);
            animation: pulseText 2.5s infinite alternate;
        }

        .loader-subtext {
            font-size: 0.72rem;
            color: var(--text-secondary);
            margin-top: 6px;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        @keyframes pulseText {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* Mobile Container Layout Fix */
        .mobile-container {
            width: 100%;
            max-width: 410px;
            height: 100vh;
            height: 100dvh;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Header Safe Zone */
        header {
            padding: 25px 20px 10px 20px;
            text-align: center;
            flex-shrink: 0;
        }

        .brand-logo {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--gold-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-shadow: 0 0 12px rgba(245, 207, 102, 0.35);
        }

        .brand-logo span {
            color: #ffffff;
            font-weight: 400;
        }

        /* Content Wrapper */
        .content {
            padding: 10px 16px 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            flex: 1;
            justify-content: space-evenly;
        }

        /* Premium Card Style */
        .dashboard-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 14px 16px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .card-title {
            font-size: 0.72rem;
            color: var(--text-secondary);
            font-weight: 600;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }

        .price-badge {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
        }

        .badge-green {
            color: var(--accent-green);
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 5px;
        }

        /* 15 Days Trend Graph Box */
        .chart-box {
            width: 100%;
            height: 100px;
            margin-top: 8px;
        }

        /* Crypto Container */
        .crypto-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .crypto-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .crypto-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.82rem;
            font-weight: 600;
        }

        .crypto-info i {
            color: var(--gold-primary);
            font-size: 1rem;
        }

        .crypto-val {
            font-size: 0.88rem;
            font-weight: 700;
        }

        /* Start Investing CTA Button Spacing */
        .cta-wrapper {
            margin-top: 10px;
            padding: 0 4px;
        }

        .btn-gold {
            width: 100%;
            padding: 14px;
            background: var(--gold-gradient);
            border: none;
            border-radius: 25px;
            color: #030d0a;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.8px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(245, 207, 102, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-gold:active {
            transform: scale(0.98);
        }

        /* Bottom Nav Container Placeholder */
        #bottom-nav-container {
            width: 100%;
            flex-shrink: 0;
        }

        /* Built-in Fallback Nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 0 18px 0;
            background: #061913;
            border-top: 1px solid rgba(46, 213, 115, 0.25);
            width: 100%;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #8da499;
            font-size: 0.72rem;
            text-decoration: none;
        }

        .nav-item:hover, .nav-item.active {
            color: #f5cf66;
        }

        .nav-item i {
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <!-- Fullscreen National Monument Loading Overlay -->
    <div id="loader-overlay">
        <div class="monument-container">
            <svg class="monument-svg" viewBox="0 0 200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- National Monument Structure Strips -->
                <g class="monument-path" stroke="#f5cf66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <!-- Base Foundation -->
                    <path d="M 10 230 L 190 230" stroke="#2ed573" stroke-width="2.5" />
                    <!-- Spire 1 (Center Highest) -->
                    <polygon points="100,10 93,225 107,225" />
                    <!-- Spire 2 Left & Right -->
                    <polygon points="100,10 78,225 90,225" />
                    <polygon points="100,10 110,225 122,225" />
                    <!-- Spire 3 Left & Right -->
                    <polygon points="100,10 62,225 75,225" />
                    <polygon points="100,10 125,225 138,225" />
                    <!-- Spire 4 Left & Right -->
                    <polygon points="100,10 45,225 59,225" />
                    <polygon points="100,10 141,225 155,225" />
                    <!-- Spire 5 Left & Right -->
                    <polygon points="100,10 30,225 42,225" />
                    <polygon points="100,10 158,225 170,225" />
                    <!-- Outer Base Flanks -->
                    <polygon points="100,10 15,225 27,225" />
                    <polygon points="100,10 173,225 185,225" />
                </g>
            </svg>
        </div>
        <div class="loader-brand">GOLDMINE DIGITAL</div>
        <div class="loader-subtext">Securing Vault Assets...</div>
    </div>

    <div class="mobile-container">
        <!-- Header -->
        <header>
            <div class="brand-logo">
                GOLDMINE <span>DIGITAL</span>
            </div>
        </header>

        <!-- Main Dashboard Content -->
        <div class="content">
            
            <!-- Box 1: Gold Price & 15-Day Trend Graph -->
            <div class="dashboard-card">
                <div class="card-header">
                    <div class="card-title">CURRENT GOLD PRICE</div>
                    <span style="font-size: 0.65rem; color: var(--gold-primary); font-weight: 600;">15 DAYS TREND</span>
                </div>
                <div class="price-badge">
                    $<span id="gold-price">2,184.00</span>/oz 
                    <span class="badge-green">(UP +<span id="gold-change">1.4</span>%)</span>
                </div>
                <div class="chart-box">
                    <canvas id="goldChart"></canvas>
                </div>
            </div>

            <!-- Box 2: Crypto Rates & 15-Day Trend Graph -->
            <div class="dashboard-card">
                <div class="card-header">
                    <div class="card-title">MARKET RATES (CRYPTO)</div>
                    <span class="badge-green" style="font-size:0.65rem;"><i class="fa-solid fa-circle" style="font-size:0.4rem;"></i> LIVE</span>
                </div>
                
                <div class="crypto-container">
                    <div class="crypto-row">
                        <div class="crypto-info">
                            <i class="fa-brands fa-bitcoin"></i>
                            <span>BTC / USD</span>
                        </div>
                        <div class="crypto-val">$<span id="btc-price">65,432.03</span></div>
                    </div>

                    <!-- Crypto 15 Days Dynamic Graph Box -->
                    <div class="chart-box" style="height: 75px;">
                        <canvas id="cryptoChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Start Investing Button -->
            <div class="cta-wrapper">
                <button class="btn-gold" onclick="window.location.href='login-signup.html'">START INVESTING</button>
            </div>

        </div>

        <!-- Dynamic / Fallback Bottom Nav Container -->
        <div id="bottom-nav-container">
            <nav class="bottom-nav">
                <a href="javascript:history.back()" class="nav-item">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Back</span>
                </a>
                <a href="portfolio.html" class="nav-item">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>Portfolio</span>
                </a>
                <a href="wallet.html" class="nav-item">
                    <i class="fa-solid fa-wallet"></i>
                    <span>Wallet</span>
                </a>
                <a href="settings.html" class="nav-item">
                    <i class="fa-solid fa-gear"></i>
                    <span>Settings</span>
                </a>
            </nav>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Set exact minimum animation duration to 2.5 Seconds (2500 ms)
        const animationMinDuration = 2500; 
        const pageStartTime = Date.now();

        window.addEventListener('load', function() {
            const elapsedTime = Date.now() - pageStartTime;
            const remainingTime = Math.max(0, animationMinDuration - elapsedTime);

            setTimeout(function() {
                const loader = document.getElementById('loader-overlay');
                if (loader) {
                    loader.classList.add('fade-out');
                    document.body.style.overflow = 'auto'; // Restore scroll
                }
            }, remainingTime);
        });

        // Dynamic bottom.html loader with cache bypass
        fetch('bottom.html?v=' + new Date().getTime())
            .then(response => {
                if(response.ok) return response.text();
            })
            .then(data => {
                if(data) document.getElementById('bottom-nav-container').innerHTML = data;
            })
            .catch(error => console.log('Using default bottom nav'));

        // 15 Days Dynamic Curves Data
        const daysLabels = Array.from({length: 15}, (_, i) => `Day ${i + 1}`);

        // Gold Chart Implementation
        const goldCtx = document.getElementById('goldChart').getContext('2d');
        const goldGradient = goldCtx.createLinearGradient(0, 0, 0, 100);
        goldGradient.addColorStop(0, 'rgba(245, 207, 102, 0.4)');
        goldGradient.addColorStop(1, 'rgba(245, 207, 102, 0.0)');

        const goldChart = new Chart(goldCtx, {
            type: 'line',
            data: {
                labels: daysLabels,
                datasets: [{
                    data: [2140, 2145, 2138, 2150, 2158, 2152, 2165, 2160, 2172, 2168, 2175, 2170, 2178, 2181, 2184],
                    borderColor: '#f5cf66',
                    borderWidth: 2.5,
                    fill: true,
                    backgroundColor: goldGradient,
                    tension: 0.45,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { x: { display: false }, y: { display: false } }
            }
        });

        // Crypto Chart Implementation
        const cryptoCtx = document.getElementById('cryptoChart').getContext('2d');
        const cryptoGradient = cryptoCtx.createLinearGradient(0, 0, 0, 75);
        cryptoGradient.addColorStop(0, 'rgba(46, 213, 115, 0.35)');
        cryptoGradient.addColorStop(1, 'rgba(46, 213, 115, 0.0)');

        const cryptoChart = new Chart(cryptoCtx, {
            type: 'line',
            data: {
                labels: daysLabels,
                datasets: [{
                    data: [62000, 62400, 62100, 63000, 62800, 63500, 63200, 64000, 64500, 64200, 64800, 65000, 64900, 65200, 65432],
                    borderColor: '#2ed573',
                    borderWidth: 2,
                    fill: true,
                    backgroundColor: cryptoGradient,
                    tension: 0.45,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { x: { display: false }, y: { display: false } }
            }
        });

        // Real-time market update simulation
        setInterval(() => {
            let currentGold = parseFloat(document.getElementById('gold-price').innerText.replace(',', ''));
            let newGold = (currentGold + (Math.random() - 0.48) * 1.5).toFixed(2);
            document.getElementById('gold-price').innerText = Number(newGold).toLocaleString('en-US', {minimumFractionDigits: 2});
            
            goldChart.data.datasets[0].data.shift();
            goldChart.data.datasets[0].data.push(newGold);
            goldChart.update();

            let btcPrice = parseFloat(document.getElementById('btc-price').innerText.replace(',', ''));
            let newBtc = (btcPrice + (Math.random() - 0.48) * 25).toFixed(2);
            document.getElementById('btc-price').innerText = Number(newBtc).toLocaleString('en-US', {minimumFractionDigits: 2});

            cryptoChart.data.datasets[0].data.shift();
            cryptoChart.data.datasets[0].data.push(newBtc);
            cryptoChart.update();
        }, 3000);
    </script>
</body>
</html>
