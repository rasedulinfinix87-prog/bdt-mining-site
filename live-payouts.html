<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Payouts - Goldmine Digital</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #061913;
      --bg-darker: #030d0a;
      --card-bg: rgba(12, 38, 29, 0.85);
      --card-border: rgba(245, 207, 102, 0.3);
      --gold-primary: #f5cf66;
      --gold-gradient: linear-gradient(135deg, #f5cf66 0%, #b89332 50%, #f5cf66 100%);
      --green-glow: #2ed573;
      --text-main: #ffffff;
      --text-muted: #8da499;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .admin-container {
      width: 100%;
      max-width: 480px;
      background-color: var(--bg-dark);
      padding-bottom: 40px;
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar - সাইটের মূল ব্যাকগ্রাউন্ড কালার দিয়ে আপডেট করা */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: var(--bg-dark);
      position: sticky;
      top: 0;
      z-index: 999;
      border-bottom: 1px solid var(--card-border);
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      color: var(--gold-primary);
      font-size: 1.1rem;
      text-decoration: none;
      background: rgba(245, 207, 102, 0.15);
      border: 1px solid var(--card-border);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .top-bar h2 {
      font-size: 1.15rem;
      background: var(--gold-gradient);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 4s linear infinite;
    }

    @keyframes shine {
      to {
        background-position: 200% center;
      }
    }

    /* Total Counter Banner - সোনার উজ্জ্বল গ্রাডিয়েন্ট বর্ডার অ্যানিমেশন সহ */
    .counter-card {
      margin: 20px;
      background: var(--card-bg);
      border: 2px solid transparent;
      border-image: var(--gold-gradient) 1;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }

    .counter-card::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(245,207,102,0.1), transparent);
      animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
      100% { left: 100%; }
    }

    .counter-card h3 {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .counter-card .total-amount {
      font-size: 2rem;
      font-weight: 800;
      background: var(--gold-gradient);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 4s linear infinite;
    }

    /* Live Feed Box */
    .feed-section-header {
      padding: 0 20px 10px;
      font-size: 0.95rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--green-glow);
      font-size: 0.8rem;
      font-weight: 600;
      background: rgba(46, 213, 115, 0.1);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(46, 213, 115, 0.3);
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: var(--green-glow);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green-glow);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 12px var(--green-glow); }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    .payout-scroll-wrapper {
      margin: 0 20px;
      height: 420px;
      overflow: hidden;
      position: relative;
      background: var(--bg-darker);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: inset 0 5px 15px rgba(0,0,0,0.5);
    }

    .payout-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 15px;
      position: absolute;
      width: 100%;
      will-change: transform;
      transition: transform 0.5s ease-out;
    }

    /* Payout Item Card - সোনার উজ্জ্বল গ্রাডিয়েন্ট বর্ডার সহ */
    .payout-item {
      background: var(--card-bg);
      border: 1px solid;
      border-image: var(--gold-gradient) 1;
      border-radius: 12px;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      animation: fadeIn 0.4s ease-out;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .user-info-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-avatar {
      width: 38px;
      height: 38px;
      background: rgba(245, 207, 102, 0.1);
      border: 1px solid var(--card-border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-primary);
      font-size: 0.9rem;
    }

    .user-details h4 {
      font-size: 0.9rem;
      color: var(--text-main);
      margin-bottom: 2px;
    }

    .user-details p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .payout-amount {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--green-glow);
      background: rgba(46, 213, 115, 0.1);
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid rgba(46, 213, 115, 0.2);
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="title-group">
        <a href="admin-dashboard.html" class="back-btn">
          <i class="fa-solid fa-chevron-left"></i>
        </a>
        <h2>Live Payouts</h2>
      </div>
    </div>

    <!-- Total Counter Banner -->
    <div class="counter-card">
      <h3>Total Payouts Distributed</h3>
      <div class="total-amount" id="total-payout-counter">$14,892.50</div>
    </div>

    <!-- Live Stream Header -->
    <div class="feed-section-header">
      <span>Real-time Feed</span>
      <div class="live-badge">
        <div class="live-dot"></div> Live
      </div>
    </div>

    <!-- Payout Scrollable Area -->
    <div class="payout-scroll-wrapper">
      <div class="payout-list" id="payout-container">
        <!-- Dynamic items injected via JS -->
      </div>
    </div>
  </div>

  <script>
    const firstNames = ["Rashed", "Karim", "Tanvir", "Rahim", "Mehedi", "Sakib", "Imran", "Nayeem", "Farhan", "Al-Amin", "Hasan", "Sumon", "Arif", "Rakibul", "Tanvir"];
    const lastNames = ["Ahmed", "Hossain", "Khan", "Chowdhury", "Talukder", "Sarker", "Mahmud", "Uddin", "Mridha", "Bhuiyan"];

    const payoutPool = [
      11.80, 13.60, 15.40, 63.50, 77.00, 90.50, 133.00, 166.00, 
      11.80, 15.40, 77.00, 63.50, 199.00, 90.50, 13.60, 166.00,
      355.00, 460.00, 199.00, 565.00, 355.00, 460.00,
      762.50, 902.00, 1025.00, 1287.50
    ];

    let totalAmountVal = 14892.50;
    const container = document.getElementById('payout-container');
    const counterDisplay = document.getElementById('total-payout-counter');

    function getRandomItem(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function getRandomName() {
      const f = firstNames[Math.floor(Math.random() * firstNames.length)];
      const l = lastNames[Math.floor(Math.random() * lastNames.length)];
      return `${f} ${l}`;
    }

    function formatCurrency(amount) {
      return '$' + amount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function initPayouts() {
      for (let i = 0; i < 8; i++) {
        addPayoutItem(false);
      }
    }

    function addPayoutItem(isAnimate = true) {
      const name = getRandomName();
      const amount = getRandomItem(payoutPool);
      
      if(isAnimate) {
        totalAmountVal += amount;
        counterDisplay.innerText = formatCurrency(totalAmountVal);
      }

      const itemHTML = `
        <div class="payout-item">
          <div class="user-info-box">
            <div class="user-avatar">
              <i class="fa-solid fa-user-check"></i>
            </div>
            <div class="user-details">
              <h4>${name}</h4>
              <p>Just now via Payout System</p>
            </div>
          </div>
          <div class="payout-amount">+${formatCurrency(amount)}</div>
        </div>
      `;

      if (isAnimate) {
        container.insertAdjacentHTML('afterbegin', itemHTML);
        if (container.children.length > 12) {
          container.removeChild(container.lastElementChild);
        }
      } else {
        container.insertAdjacentHTML('beforeend', itemHTML);
      }
    }

    initPayouts();

    setInterval(() => {
      addPayoutItem(true);
    }, 2800);
  </script>
</body>
</html>
