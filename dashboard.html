<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - BDTMINER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #080c14; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 10px; }
        .dashboard-card { width: 100%; max-width: 420px; background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 20px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8); }
        .user-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #1e293b; padding-bottom: 12px; }
        .user-email { font-weight: 600; color: #f59e0b; font-size: 14px; }
        .btn-logout { background: #ef4444; color: #fff; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; }
        .balance-box { background: rgba(30, 41, 59, 0.7); border: 1px solid #334155; border-radius: 12px; padding: 15px; text-align: center; margin-bottom: 20px; }
        .balance-title { font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
        .balance-amount { font-size: 26px; font-weight: 700; color: #10b981; }
        .action-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-action { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; text-align: center; font-size: 13px; }
        .btn-deposit { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
        .btn-withdraw { background: #1e293b; color: #fff; border: 1px solid #334155; }
        .selected-plan { background: rgba(245, 158, 11, 0.1); border: 1px dashed #f59e0b; border-radius: 10px; padding: 12px; text-align: center; font-size: 13px; color: #f59e0b; margin-bottom: 15px; display: none; }
        .back-home { display: block; text-align: center; color: #94a3b8; text-decoration: none; font-size: 13px; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="dashboard-card">
        <div class="user-header">
            <span class="user-email" id="userEmail">Loading...</span>
            <button class="btn-logout" onclick="handleLogout()">Logout</button>
        </div>

        <div id="planBanner" class="selected-plan"></div>

        <div class="balance-box">
            <div class="balance-title">Main Account Balance</div>
            <div class="balance-amount" id="userBalance">৳ 0.00</div>
        </div>

        <div class="action-buttons">
            <button class="btn-action btn-deposit" onclick="alert('ডিপোজিট অপশন শীঘ্রই চালু হচ্ছে!')">Deposit</button>
            <button class="btn-action btn-withdraw" onclick="alert('উইথড্র অপশন শীঘ্রই চালু হচ্ছে!')">Withdraw</button>
        </div>

        <a href="index.html" class="back-home">← Back to Home</a>
    </div>

    <script>
        const SUPABASE_URL = 'https://pckocwvuxeseumynslwv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBja29jd3Z1eGVzZXVteW5zbHd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NDc3OTAsImV4cCI6MjEwNjIyMzc5MH0.0VBGW9lgZDritQa7XDoPncu5bl9M6J5W9eup0KSLXIc';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function initDashboard() {
            const { data: { user } } = await supabaseClient.auth.getUser();

            if (!user) {
                window.location.href = 'signup.html';
                return;
            }

            document.getElementById('userEmail').innerText = user.email;

            // URL থেকে সিলেক্ট করা প্ল্যান চেক করা
            const urlParams = new URLSearchParams(window.location.search);
            const plan = urlParams.get('plan');
            const amount = urlParams.get('amount');

            if (plan && amount) {
                const banner = document.getElementById('planBanner');
                banner.style.display = 'block';
                banner.innerText = `Selected Plan: ${plan} (৳ ${amount})`;
            }

            // Supabase থেকে ব্যালেন্স লোড করা
            const { data: profile } = await supabaseClient
                .from('profiles')
                .select('balance')
                .eq('id', user.id)
                .single();

            if (profile) {
                document.getElementById('userBalance').innerText = `৳ ${profile.balance.toFixed(2)}`;
            }
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'signup.html';
        }

        initDashboard();
    </script>
</body>
</html>
