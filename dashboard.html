<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - BDTMINER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #080c14; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 10px; }
        .dashboard-card { width: 100%; max-width: 440px; background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 20px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8); }
        .user-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #1e293b; padding-bottom: 12px; }
        .user-email { font-weight: 600; color: #f59e0b; font-size: 14px; }
        .btn-logout { background: #ef4444; color: #fff; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; }
        
        .balance-box { background: rgba(30, 41, 59, 0.7); border: 1px solid #334155; border-radius: 12px; padding: 15px; text-align: center; margin-bottom: 20px; }
        .balance-title { font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
        .balance-amount { font-size: 26px; font-weight: 700; color: #10b981; font-family: 'Orbitron', sans-serif; }
        
        .action-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-action { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; text-align: center; font-size: 13px; text-decoration: none; display: inline-block; }
        .btn-deposit { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
        .btn-withdraw { background: #1e293b; color: #fff; border: 1px solid #334155; }
        
        /* Activate Selected Plan Box */
        .selected-plan-box { background: rgba(245, 158, 11, 0.1); border: 1px dashed #f59e0b; border-radius: 12px; padding: 15px; text-align: center; margin-bottom: 20px; display: none; }
        .plan-info { color: #f59e0b; font-size: 14px; font-weight: 600; margin-bottom: 10px; }
        .btn-activate { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; width: 100%; }

        /* Mining Section */
        .section-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; color: #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
        .active-plans-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        
        .mining-card { background: rgba(30, 41, 59, 0.5); border: 1px solid #334155; border-radius: 12px; padding: 12px; position: relative; }
        .mining-card-header { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: #f59e0b; margin-bottom: 8px; }
        .mining-status { background: rgba(16, 185, 129, 0.2); color: #10b981; padding: 2px 8px; border-radius: 10px; font-size: 10px; text-transform: uppercase; }
        
        .progress-bar-bg { width: 100%; background: #1e293b; height: 8px; border-radius: 4px; overflow: hidden; margin: 8px 0; }
        .progress-bar-fill { background: linear-gradient(90deg, #f59e0b, #10b981); height: 100%; width: 0%; transition: width 0.5s ease; }
        
        .mining-stats { display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; }
        .mining-profit { font-weight: 700; color: #10b981; font-family: 'Orbitron', sans-serif; }

        .no-plans { text-align: center; font-size: 12px; color: #64748b; padding: 15px; background: rgba(30, 41, 59, 0.2); border-radius: 10px; }

        .back-home { display: block; text-align: center; color: #94a3b8; text-decoration: none; font-size: 13px; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="dashboard-card">
        <!-- User Header -->
        <div class="user-header">
            <span class="user-email" id="userEmail">Loading...</span>
            <button class="btn-logout" onclick="handleLogout()">Logout</button>
        </div>

        <!-- Confirm Plan Box (Show only if redirected from home page with params) -->
        <div id="planActivationBox" class="selected-plan-box">
            <div id="planInfoText" class="plan-info">Selected Plan: -</div>
            <button id="activateBtn" class="btn-activate" onclick="activatePlan()">Confirm & Activate Plan</button>
        </div>

        <!-- Main Balance -->
        <div class="balance-box">
            <div class="balance-title">Main Account Balance</div>
            <div class="balance-amount" id="userBalance">$ 0.00</div>
        </div>

        <!-- Action Buttons connected to deposit-withdraw.html -->
        <div class="action-buttons">
            <button class="btn-action btn-deposit" onclick="window.location.href='deposit-withdraw.html?type=deposit'">Deposit</button>
            <button class="btn-action btn-withdraw" onclick="window.location.href='deposit-withdraw.html?type=withdraw'">Withdraw</button>
        </div>

        <!-- Active Mining Plans Section -->
        <div class="section-title">
            <span>⚡ Active Mining Rigs</span>
            <span id="activePlanCount" style="font-size: 12px; color: #f59e0b;">(0)</span>
        </div>

        <div id="activePlansContainer" class="active-plans-container">
            <div class="no-plans">No active mining plan right now.</div>
        </div>

        <a href="index.html" class="back-home">← Back to Home</a>
    </div>

    <script>
        const SUPABASE_URL = 'https://pckocwvuxeseumynslwv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBja29jd3Z1eGVzZXVteW5zbHd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NDc3OTAsImV4cCI6MjEwNjIyMzc5MH0.0VBGW9lgZDritQa7XDoPncu5bl9M6J5W9eup0KSLXIc';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let selectedPlanData = null;
        let userActivePlans = [];

        // predefined plan configs
        const planConfigs = {
            '5 Airdrop': { daily_profit: 1.0, duration: 15, total_return: 15 },
            '30 AirDrop': { daily_profit: 2.26, duration: 30, total_return: 68 },
            '60 AirDrop': { daily_profit: 3.11, duration: 45, total_return: 140 }
        };

        async function initDashboard() {
            const { data: { user } } = await supabaseClient.auth.getUser();

            if (!user) {
                window.location.href = 'signup.html';
                return;
            }

            currentUser = user;
            document.getElementById('userEmail').innerText = user.email;

            // URL থেকে প্ল্যান চেক করা
            const urlParams = new URLSearchParams(window.location.search);
            const planName = urlParams.get('plan');
            const amount = parseFloat(urlParams.get('amount'));

            if (planName && amount) {
                selectedPlanData = {
                    plan_name: planName,
                    invested_amount: amount,
                    ...(planConfigs[planName] || { daily_profit: (amount * 0.1), duration: 15, total_return: (amount * 1.5) })
                };

                const box = document.getElementById('planActivationBox');
                const infoText = document.getElementById('planInfoText');
                box.style.display = 'block';
                infoText.innerText = `Selected Plan: ${planName} ($${amount})`;
            }

            loadUserBalance();
            loadActivePlans();
        }

        async function loadUserBalance() {
            try {
                const { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('balance')
                    .eq('id', currentUser.id)
                    .single();

                if (profile && profile.balance !== undefined) {
                    document.getElementById('userBalance').innerText = `$ ${profile.balance.toFixed(2)}`;
                }
            } catch (e) {
                console.log("Balance fetch error/fallback handled.");
            }
        }

        // new plan activation into Supabase user_plan table
        async function activatePlan() {
            if (!selectedPlanData || !currentUser) return;

            const btn = document.getElementById('activateBtn');
            btn.innerText = "Activating...";
            btn.disabled = true;

            const startDate = new Date();
            const endDate = new Date();
            endDate.setDate(startDate.getDate() + selectedPlanData.duration);

            const { error } = await supabaseClient
                .from('user_plan')
                .insert([
                    {
                        user_id: currentUser.id,
                        plan_name: selectedPlanData.plan_name,
                        invested_amount: selectedPlanData.invested_amount,
                        daily_profit: selectedPlanData.daily_profit,
                        total_return: selectedPlanData.total_return,
                        duration_days: selectedPlanData.duration,
                        start_date: startDate.toISOString(),
                        end_date: endDate.toISOString(),
                        status: 'active'
                    }
                ]);

            if (error) {
                alert("Error activating plan: " + error.message);
                btn.innerText = "Confirm & Activate Plan";
                btn.disabled = false;
            } else {
                alert("Plan activated successfully!");
                // Clear URL params and hide activation box
                window.history.replaceState({}, document.title, window.location.pathname);
                document.getElementById('planActivationBox').style.display = 'none';
                loadActivePlans();
            }
        }

        // load all active plans of current user
        async function loadActivePlans() {
            const { data: plans, error } = await supabaseClient
                .from('user_plan')
                .select('*')
                .eq('user_id', currentUser.id)
                .eq('status', 'active');

            const container = document.getElementById('activePlansContainer');
            const countLabel = document.getElementById('activePlanCount');

            if (error || !plans || plans.length === 0) {
                container.innerHTML = `<div class="no-plans">No active mining plan right now.</div>`;
                countLabel.innerText = `(0)`;
                userActivePlans = [];
                return;
            }

            userActivePlans = plans;
            countLabel.innerText = `(${plans.length})`;
            renderPlans();
        }

        // Render multiple plans & dynamic calculations
        function renderPlans() {
            const container = document.getElementById('activePlansContainer');
            container.innerHTML = '';

            const now = new Date().getTime();

            userActivePlans.forEach((plan, index) => {
                const startTime = new Date(plan.start_date).getTime();
                const endTime = new Date(plan.end_date).getTime();
                
                const totalDurationSec = (endTime - startTime) / 1000;
                const elapsedSec = Math.max(0, (now - startTime) / 1000);

                // calculate percentage completion
                let progressPercent = ((elapsedSec / totalDurationSec) * 100).toFixed(2);
                if (progressPercent > 100) progressPercent = 100;

                // calculate earned profit so far (daily profit / 86400 sec per day)
                const profitPerSec = plan.daily_profit / 86400;
                const earnedProfit = (profitPerSec * elapsedSec).toFixed(5);

                const cardHtml = `
                    <div class="mining-card">
                        <div class="mining-card-header">
                            <span>${plan.plan_name} ($${plan.invested_amount})</span>
                            <span class="mining-status">Mining</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" id="progress-${index}" style="width: ${progressPercent}%;"></div>
                        </div>
                        <div class="mining-stats">
                            <span>Mined: <strong class="mining-profit" id="profit-${index}">+$${earnedProfit}</strong></span>
                            <span>Progress: <strong id="percent-${index}">${progressPercent}%</strong></span>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        // Realtime mining ticker effect
        setInterval(() => {
            if (userActivePlans.length > 0) {
                const now = new Date().getTime();
                userActivePlans.forEach((plan, index) => {
                    const startTime = new Date(plan.start_date).getTime();
                    const endTime = new Date(plan.end_date).getTime();

                    const totalDurationSec = (endTime - startTime) / 1000;
                    const elapsedSec = Math.max(0, (now - startTime) / 1000);

                    let progressPercent = ((elapsedSec / totalDurationSec) * 100).toFixed(2);
                    if (progressPercent > 100) progressPercent = 100;

                    const profitPerSec = plan.daily_profit / 86400;
                    const earnedProfit = (profitPerSec * elapsedSec).toFixed(5);

                    const progressEl = document.getElementById(`progress-${index}`);
                    const profitEl = document.getElementById(`profit-${index}`);
                    const percentEl = document.getElementById(`percent-${index}`);

                    if (progressEl) progressEl.style.width = `${progressPercent}%`;
                    if (profitEl) profitEl.innerText = `+$${earnedProfit}`;
                    if (percentEl) percentEl.innerText = `${progressPercent}%`;
                });
            }
        }, 1000);

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'signup.html';
        }

        initDashboard();
    </script>
</body>
</html>
