<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - BDTMINER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background: #060913; 
            background-image: 
                radial-gradient(at 10% 10%, rgba(16, 185, 129, 0.08) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(59, 130, 246, 0.08) 0px, transparent 50%);
            color: #f3f4f6; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 24px 12px; 
        }

        .dashboard-card { 
            width: 100%; 
            max-width: 440px; 
            background: rgba(15, 23, 42, 0.75); 
            border: 1px solid rgba(255, 255, 255, 0.12); 
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px);
            border-radius: 28px; 
            padding: 24px; 
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8), 0 0 30px rgba(16, 185, 129, 0.05); 
        }

        /* User Header */
        .user-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            padding-bottom: 16px; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.08); 
        }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar-box {
            width: 42px; height: 42px;
            border-radius: 14px;
            background: linear-gradient(135deg, #10b981, #047857);
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; color: #fff; font-size: 18px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .user-meta { display: flex; flex-direction: column; }
        .user-email { 
            font-weight: 700; 
            color: #f9fafb; 
            font-size: 14px; 
            max-width: 190px; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            white-space: nowrap; 
        }
        .trust-badge {
            font-size: 10px;
            color: #34d399;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
            letter-spacing: 0.3px;
        }

        .btn-logout { 
            background: rgba(239, 68, 68, 0.12); 
            color: #f87171; 
            border: 1px solid rgba(239, 68, 68, 0.25); 
            padding: 8px 14px; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 12px; 
            font-weight: 700; 
            transition: all 0.3s ease;
        }
        .btn-logout:hover { background: #ef4444; color: #fff; transform: translateY(-1px); }

        /* Security Bar */
        .security-banner {
            background: rgba(16, 185, 129, 0.06);
            border: 1px solid rgba(16, 185, 129, 0.15);
            border-radius: 12px;
            padding: 8px 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: #9ca3af;
        }
        .security-banner span { color: #34d399; font-weight: 600; }

        /* Main Balance Box */
        .balance-box { 
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.9)); 
            border: 1px solid rgba(255, 255, 255, 0.12); 
            border-radius: 22px; 
            padding: 22px; 
            text-align: center; 
            margin-bottom: 20px; 
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }
        .balance-box::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, transparent 60%);
            pointer-events: none;
        }
        .balance-title { font-size: 11px; color: #9ca3af; text-transform: uppercase; letter-spacing: 1.2px; font-weight: 700; margin-bottom: 8px; }
        .balance-amount { 
            font-size: 34px; 
            font-weight: 800; 
            color: #10b981; 
            text-shadow: 0 0 25px rgba(16, 185, 129, 0.4); 
            letter-spacing: -0.5px;
        }

        /* Action Buttons */
        .action-buttons { display: flex; gap: 12px; margin-bottom: 24px; }
        .btn-action { 
            flex: 1; padding: 14px; border: none; border-radius: 14px; font-weight: 700; 
            cursor: pointer; text-align: center; font-size: 13px; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-deposit { 
            background: linear-gradient(135deg, #10b981, #059669); 
            color: #fff; 
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3); 
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-withdraw { 
            background: rgba(30, 41, 59, 0.8); 
            color: #f3f4f6; 
            border: 1px solid rgba(255, 255, 255, 0.12); 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .btn-action:hover { transform: translateY(-2px); filter: brightness(1.1); }

        /* Plan Selection Banner */
        .selected-plan-card { 
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.18), rgba(217, 119, 6, 0.08)); 
            border: 1px solid rgba(245, 158, 11, 0.5); 
            border-radius: 20px; 
            padding: 18px; 
            margin-bottom: 24px; 
            display: none; 
            box-shadow: 0 10px 30px rgba(245, 158, 11, 0.1);
        }
        .plan-header-title { font-size: 11px; color: #f59e0b; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
        .plan-details { font-size: 17px; font-weight: 800; color: #fff; margin-bottom: 14px; }
        .btn-activate { 
            width: 100%; padding: 13px; 
            background: linear-gradient(135deg, #f59e0b, #d97706); 
            border: none; border-radius: 12px; 
            color: #000; font-weight: 800; font-size: 14px; 
            cursor: pointer; box-shadow: 0 6px 20px rgba(245, 158, 11, 0.35);
            transition: all 0.3s ease;
        }
        .btn-activate:hover { filter: brightness(1.15); transform: translateY(-1px); }

        /* Mining Rig Section */
        .mining-card {
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.8));
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 22px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
            box-shadow: 0 10px 35px rgba(59, 130, 246, 0.15);
            display: none;
        }
        .mining-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .mining-title { font-weight: 800; font-size: 15px; color: #60a5fa; display: flex; align-items: center; gap: 8px; }
        .status-badge { 
            background: rgba(16, 185, 129, 0.15); 
            color: #34d399; 
            font-size: 10px; 
            padding: 5px 12px; 
            border-radius: 20px; 
            border: 1px solid rgba(16, 185, 129, 0.4); 
            font-weight: 800; 
            letter-spacing: 0.5px;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
        }

        /* Animated Mining Rig Icon */
        .mining-animation-box {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 16px 0;
            padding: 16px;
            background: rgba(6, 9, 19, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
        }
        .gear-spin {
            width: 42px; height: 42px;
            border: 3px solid rgba(59, 130, 246, 0.2);
            border-top: 3px solid #f59e0b;
            border-right: 3px solid #10b981;
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .mining-stats-text { font-size: 12px; color: #9ca3af; line-height: 1.6; }
        .mining-stats-text strong { color: #fff; font-size: 15px; font-weight: 700; }

        /* Progress Bar */
        .progress-container { margin-top: 16px; }
        .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: #9ca3af; font-weight: 600; margin-bottom: 8px; }
        .progress-bar-bg { width: 100%; height: 10px; background: rgba(30, 41, 59, 0.9); border-radius: 10px; overflow: hidden; padding: 2px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #3b82f6, #10b981); border-radius: 10px; transition: width 0.5s ease; box-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }

        .back-home { display: block; text-align: center; color: #6b7280; text-decoration: none; font-size: 13px; margin-top: 18px; font-weight: 600; transition: color 0.3s; }
        .back-home:hover { color: #9ca3af; }
    </style>
</head>
<body>

    <div class="dashboard-card">
        <!-- Header -->
        <div class="user-header">
            <div class="user-info">
                <div class="avatar-box" id="avatarLetter">U</div>
                <div class="user-meta">
                    <span class="user-email" id="userEmail">Loading...</span>
                    <div class="trust-badge">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        VERIFIED ACCOUNT
                    </div>
                </div>
            </div>
            <button class="btn-logout" onclick="handleLogout()">Logout</button>
        </div>

        <!-- Security Badge Banner -->
        <div class="security-banner">
            <div>🔒 256-Bit SSL Encrypted</div>
            <div>Status: <span>Active Node</span></div>
        </div>

        <!-- Plan Activation Request (When Plan URL Param Exists) -->
        <div id="planBanner" class="selected-plan-card">
            <div class="plan-header-title">⚡ Ready to Activate</div>
            <div class="plan-details" id="planDetailsText">Starter Plan (৳ 5000)</div>
            <button class="btn-activate" id="activateBtn" onclick="activatePlan()">Activate Plan Now</button>
        </div>

        <!-- Main Balance Box -->
        <div class="balance-box">
            <div class="balance-title">Main Account Balance</div>
            <div class="balance-amount" id="userBalance">৳ 0.00</div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button class="btn-action btn-deposit" onclick="window.location.href='deposit-withdraw.html'">
                <span>↓</span> Deposit
            </button>
            <button class="btn-action btn-withdraw" onclick="window.location.href='deposit-withdraw.html'">
                <span>↑</span> Withdraw
            </button>
        </div>

        <!-- Active Mining Rig Display -->
        <div class="mining-card" id="activeMiningCard">
            <div class="mining-header">
                <div class="mining-title">
                    <span>⛏️</span> <span id="activePlanTitle">Mining Rig</span>
                </div>
                <span class="status-badge">MINING ACTIVE</span>
            </div>

            <div class="mining-animation-box">
                <div class="gear-spin"></div>
                <div class="mining-stats-text">
                    Total Return: <strong id="totalReturnText">৳ 0.00</strong><br>
                    Time Left: <strong id="timeLeftText">--</strong>
                </div>
            </div>

            <div class="progress-container">
                <div class="progress-label">
                    <span>Mining Progress</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressFill"></div>
                </div>
            </div>
        </div>

        <a href="index.html" class="back-home">← Back to Home</a>
    </div>

    <script>
        const SUPABASE_URL = 'https://pckocwvuxeseumynslwv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBja29jd3Z1eGVzZXVteW5zbHd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NDc3OTAsImV4cCI6MjEwNjIyMzc5MH0.0VBGW9lgZDritQa7XDoPncu5bl9M6J5W9eup0KSLXIc';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let currentBalance = 0;
        let selectedPlanData = null;

        // Plan Configurations (Name, Amount, Duration in Days, Total Profit Multiplier/Return)
        const PLAN_CONFIGS = {
            'Starter Plan': { amount: 5000, duration: 15, returnAmount: 7500 },
            'Standard Plan': { amount: 10000, duration: 15, returnAmount: 16000 },
            'Premium Plan': { amount: 25000, duration: 20, returnAmount: 42500 }
        };

        async function initDashboard() {
            const { data: { user } } = await supabaseClient.auth.getUser();

            if (!user) {
                window.location.href = 'signup.html';
                return;
            }

            currentUser = user;
            document.getElementById('userEmail').innerText = user.email;
            document.getElementById('avatarLetter').innerText = user.email.charAt(0).toUpperCase();

            // Load Balance
            await loadBalance();

            // Check URL Params for Plan Selection
            const urlParams = new URLSearchParams(window.location.search);
            const planName = urlParams.get('plan');
            const planAmount = parseFloat(urlParams.get('amount'));

            if (planName && planAmount) {
                selectedPlanData = PLAN_CONFIGS[planName] || { amount: planAmount, duration: 15, returnAmount: planAmount * 1.5 };
                selectedPlanData.name = planName;

                const banner = document.getElementById('planBanner');
                banner.style.display = 'block';
                document.getElementById('planDetailsText').innerText = `${planName} - ৳ ${selectedPlanData.amount.toLocaleString()} (${selectedPlanData.duration} Days)`;
            }

            // Check Active Mining Plans
            checkActivePlan();
        }

        async function loadBalance() {
            const { data: profile } = await supabaseClient
                .from('profiles')
                .select('balance')
                .eq('id', currentUser.id)
                .single();

            if (profile && profile.balance !== null) {
                currentBalance = profile.balance;
                document.getElementById('userBalance').innerText = `৳ ${currentBalance.toFixed(2)}`;
            }
        }

        async function activatePlan() {
            if (!selectedPlanData) return;

            if (currentBalance < selectedPlanData.amount) {
                alert(`অপর্যাপ্ত ব্যালেন্স! প্ল্যান অ্যাক্টিভ করতে ৳ ${selectedPlanData.amount} টাকা প্রয়োজন। অনুগ্রহ করে আগে ডিপোজিট করুন।`);
                window.location.href = 'deposit-withdraw.html';
                return;
            }

            const btn = document.getElementById('activateBtn');
            btn.disabled = true;
            btn.innerText = 'Activating...';

            // 1. Deduct Main Balance
            const newBalance = currentBalance - selectedPlanData.amount;
            const { error: balError } = await supabaseClient
                .from('profiles')
                .update({ balance: newBalance })
                .eq('id', currentUser.id);

            if (balError) {
                alert('ব্যালেন্স আপডেট করতে সমস্যা হয়েছে: ' + balError.message);
                btn.disabled = false;
                btn.innerText = 'Activate Plan Now';
                return;
            }

            // 2. Set Plan Dates
            const startDate = new Date();
            const endDate = new Date(startDate.getTime() + (selectedPlanData.duration * 24 * 60 * 60 * 1000));

            // 3. Insert Plan Record
            const { error: planError } = await supabaseClient
                .from('user_plans')
                .insert([{
                    user_id: currentUser.id,
                    plan_name: selectedPlanData.name,
                    invested_amount: selectedPlanData.amount,
                    total_return: selectedPlanData.returnAmount,
                    duration_days: selectedPlanData.duration,
                    start_date: startDate.toISOString(),
                    end_date: endDate.toISOString(),
                    status: 'active'
                }]);

            if (planError) {
                alert('প্ল্যান চালু করতে সমস্যা হয়েছে: ' + planError.message);
            } else {
                alert('অভিনন্দন! আপনার মাইনিং প্ল্যানটি সফলভাবে অ্যাক্টিভ করা হয়েছে।');
                // Remove URL Params and Reload Page
                window.location.href = 'dashboard.html';
            }
        }

        async function checkActivePlan() {
            const { data: activePlans } = await supabaseClient
                .from('user_plans')
                .select('*')
                .eq('user_id', currentUser.id)
                .eq('status', 'active')
                .order('id', { ascending: false });

            if (activePlans && activePlans.length > 0) {
                const plan = activePlans[0];
                document.getElementById('planBanner').style.display = 'none'; // Hide banner if already active
                document.getElementById('activeMiningCard').style.display = 'block';
                document.getElementById('activePlanTitle').innerText = plan.plan_name;
                document.getElementById('totalReturnText').innerText = `৳ ${parseFloat(plan.total_return).toLocaleString()}`;

                startMiningTimer(plan);
            }
        }

        function startMiningTimer(plan) {
            const startDate = new Date(plan.start_date).getTime();
            const endDate = new Date(plan.end_date).getTime();
            const totalDuration = endDate - startDate;

            const timerInterval = setInterval(async () => {
                const now = new Date().getTime();
                const timePassed = now - startDate;
                const timeLeft = endDate - now;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    await completeMiningPlan(plan);
                } else {
                    // Calculate Progress Percentage
                    let percent = Math.min(100, Math.max(0, (timePassed / totalDuration) * 100));
                    document.getElementById('progressFill').style.width = percent.toFixed(1) + '%';
                    document.getElementById('progressPercent').innerText = percent.toFixed(1) + '%';

                    // Format Time Remaining
                    const daysLeft = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
                    const hoursLeft = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minsLeft = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                    const secsLeft = Math.floor((timeLeft % (1000 * 60)) / 1000);

                    document.getElementById('timeLeftText').innerText = `${daysLeft}d ${hoursLeft}h ${minsLeft}m ${secsLeft}s`;
                }
            }, 1000);
        }

        async function completeMiningPlan(plan) {
            document.getElementById('timeLeftText').innerText = 'Completed!';
            document.getElementById('progressFill').style.width = '100%';
            document.getElementById('progressPercent').innerText = '100%';

            // 1. Update Plan Status to Completed
            await supabaseClient
                .from('user_plans')
                .update({ status: 'completed' })
                .eq('id', plan.id);

            // 2. Add Profit + Investment to Main Balance
            const newBalance = currentBalance + parseFloat(plan.total_return);
            await supabaseClient
                .from('profiles')
                .update({ balance: newBalance })
                .eq('id', currentUser.id);

            alert(`🎉 আপনার ${plan.plan_name} প্ল্যানটির মেয়াদ পূর্ণ হয়েছে! মুনাফাসহ ৳ ${plan.total_return} টাকা আপনার মেইন ব্যালেন্সে জমা করা হয়েছে।`);
            location.reload();
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'signup.html';
        }

        initDashboard();
    </script>
</body>
</html>
