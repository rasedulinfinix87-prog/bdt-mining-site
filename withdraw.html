<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Withdraw - Goldmine Digital</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #040d08;
      --card-bg: rgba(14, 34, 25, 0.85);
      --card-border: rgba(245, 207, 102, 0.3);
      --gold-primary: #f5cf66;
      --gold-gradient: linear-gradient(135deg, #ffe082 0%, #f5cf66 35%, #b89332 70%, #e6a100 100%);
      --card-gradient: linear-gradient(135deg, rgba(16, 48, 37, 0.9) 0%, rgba(3, 13, 10, 0.95) 100%);
      --text-main: #ffffff;
      --text-muted: #8ca398;
      --green-glow: #2ed573;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    html, body { 
      background-color: var(--bg-dark); 
      color: var(--text-main); 
      display: flex; 
      justify-content: center; 
      min-height: 100vh; 
      width: 100%;
      overflow-x: hidden; 
    }

    .mobile-container {
      width: 100%; max-width: 480px; background-color: var(--bg-dark); padding: 20px; padding-bottom: 90px; position: relative; min-height: 100vh;
    }

    /* Top Bar Full Width Fix */
    .top-bar {
      display: flex; align-items: center; justify-content: space-between; 
      margin-left: -20px; margin-right: -20px; padding-left: 20px; padding-right: 20px;
      margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid var(--card-border);
    }
    .top-bar-left { display: flex; align-items: center; gap: 12px; }
    .top-bar a { color: var(--gold-primary); text-decoration: none; font-size: 1.1rem; width: 36px; height: 36px; border-radius: 50%; background: rgba(245, 207, 102, 0.1); display: flex; align-items: center; justify-content: center; border: 1px solid rgba(245, 207, 102, 0.25); }
    .top-bar h2 { font-size: 1.04rem; font-weight: 700; color: #fff; margin: 0; }

    .section-title { font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; margin-bottom: 12px; }

    /* Method Selector Grid */
    .method-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    .method-card {
      background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 14px 8px; text-align: center; cursor: pointer; transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .method-card i { font-size: 1.5rem; color: var(--text-muted); }
    .method-card span { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }

    .method-card.active {
      background: var(--card-gradient); border-color: var(--gold-primary); box-shadow: 0 0 15px rgba(245, 207, 102, 0.3); transform: translateY(-2px);
    }
    .method-card.active i, .method-card.active span { color: var(--gold-primary); }

    /* Form Fields */
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; font-weight: 600; }
    
    .input-wrapper { position: relative; display: flex; align-items: center; }
    .form-control {
      width: 100%; padding: 14px; border-radius: 12px; background: var(--card-bg); border: 1px solid var(--card-border); color: #fff; font-size: 1rem; outline: none; transition: all 0.3s ease;
    }
    .form-control:focus { border-color: var(--gold-primary); box-shadow: 0 0 10px rgba(245, 207, 102, 0.2); }

    /* Amount conversion badge inside/below input */
    .rate-badge {
      position: absolute; right: 12px; font-size: 0.82rem; color: var(--gold-primary); font-weight: 700; background: rgba(245, 207, 102, 0.15); padding: 4px 8px; border-radius: 6px; pointer-events: none; border: 1px solid rgba(245, 207, 102, 0.3);
    }

    .limit-info { font-size: 0.75rem; color: #ff6b6b; margin-top: 4px; display: block; }
    .fee-info { font-size: 0.78rem; color: var(--gold-primary); margin-top: 6px; display: block; font-weight: 600; }

    /* Shimmer Gold Submit Button */
    @keyframes goldShimmer { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    .btn-submit {
      width: 100%; padding: 16px; border-radius: 14px; border: none; background: linear-gradient(270deg, #ffe082, #f5cf66, #b89332, #ffe082); background-size: 300% 300%; animation: goldShimmer 4s ease infinite; color: #000; font-weight: 800; font-size: 1rem; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 20px rgba(245, 207, 102, 0.35); transition: all 0.3s ease; text-transform: uppercase;
    }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; animation: none; }

    /* Custom Animated Popup Modal */
    .popup-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(3, 13, 10, 0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 2000; opacity: 0; visibility: hidden; transition: all 0.3s ease;
    }
    .popup-overlay.active { opacity: 1; visibility: visible; }
    .popup-card {
      background: linear-gradient(145deg, #0c261d 0%, #030d0a 100%); border: 1px solid var(--gold-primary); padding: 25px 20px; border-radius: 20px; width: 85%; max-width: 360px; text-align: center; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(245, 207, 102, 0.25); transform: scale(0.7); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .popup-overlay.active .popup-card { transform: scale(1); }
    .popup-icon { width: 60px; height: 60px; margin: 0 auto 15px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; }
    .popup-icon.success { background: rgba(46, 213, 115, 0.15); border: 1px solid var(--green-glow); color: var(--green-glow); }
    .popup-icon.error { background: rgba(255, 71, 87, 0.15); border: 1px solid #ff4757; color: #ff4757; }
    .popup-title { font-size: 1.2rem; font-weight: 700; color: #fff; margin-bottom: 8px; }
    .popup-msg { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 20px; line-height: 1.4; }
    .popup-btn { width: 100%; padding: 12px; border-radius: 10px; border: none; background: var(--gold-gradient); color: #000; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <div class="mobile-container">
    <div class="top-bar">
      <div class="top-bar-left">
        <a href="wallet-getway-method.html"><i class="fa-solid fa-chevron-left"></i></a>
        <h2>Withdraw Money</h2>
      </div>
      <i class="fa-solid fa-shield-halved" style="color: var(--gold-primary); font-size: 1.2rem;"></i>
    </div>

    <!-- Select Withdraw Method -->
    <div class="section-title">Select Withdraw Method</div>
    <div class="method-grid">
      <div class="method-card active" data-method="bkash" onclick="switchMethod('bkash')">
        <i class="fa-solid fa-mobile-screen-button"></i>
        <span>bKash</span>
      </div>
      <div class="method-card" data-method="usd" onclick="switchMethod('usd')">
        <i class="fa-solid fa-coins"></i>
        <span>USD (Bep20)</span>
      </div>
      <div class="method-card" data-method="bank" onclick="switchMethod('bank')">
        <i class="fa-solid fa-building-columns"></i>
        <span>Bank</span>
      </div>
    </div>

    <form id="withdraw-form">
      <!-- Amount Input (Common) -->
      <div class="form-group">
        <label>Amount ($)</label>
        <div class="input-wrapper">
          <input type="number" class="form-control" id="amount" placeholder="Enter Amount" step="any" required min="10" oninput="calculateBdtAndFee()">
          <span class="rate-badge" id="bdt-rate-badge">≈ ৳ 0.00</span>
        </div>
        <span class="limit-info" id="limit-info">* Minimum withdrawal amount: $10</span>
        <span class="fee-info" id="fee-info">Fee: $0.00 | Total Deduction: $0.00</span>
      </div>

      <!-- Dynamic Method Fields Area -->
      <div id="dynamic-fields">
        <!-- Default: bKash Fields -->
        <div class="form-group">
          <label>bKash Number</label>
          <input type="text" class="form-control" id="bkash_number" placeholder="01..." required maxlength="11">
        </div>
      </div>

      <!-- Secret PIN Input (Common) -->
      <div class="form-group">
        <label>Secret PIN</label>
        <input type="password" class="form-control" id="secret_pin" placeholder="Enter 4-digit PIN" required maxlength="4" inputmode="numeric">
      </div>

      <button type="submit" class="btn-submit" id="btn-submit">Submit Withdraw Request</button>
    </form>
  </div>

  <!-- Custom Popup Modal -->
  <div class="popup-overlay" id="custom-popup">
    <div class="popup-card">
      <div class="popup-icon success" id="popup-icon"><i class="fa-solid fa-check"></i></div>
      <div class="popup-title" id="popup-title">Notification</div>
      <div class="popup-msg" id="popup-msg">Message text here...</div>
      <button class="popup-btn" onclick="closePopup()">OK</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    let currentMethod = 'bkash';
    let usdToBdtRate = 120; // Default Rate
    let cashoutFeeRate = 2.3125; // Default Fee Percentage
    let minBkashUsd = 10;
    let minUsdUsd = 10;
    let minBankUsd = 500;
    let isRedirecting = false;

    // ১. payment_gateways টেবিল থেকে usd_rate, cashout_fee ও লিমিট ডাটা রিড করা
    async function fetchGatewayData() {
      const client = window._supabase || window.supabase;
      if (!client) return;

      try {
        const { data, error } = await client
          .from('payment_gateways')
          .select('method_key, usd_rate, cashout_fee, minimum_deposit_usd, is_active');

        if (!error && data && data.length > 0) {
          const bkashGateway = data.find(g => g.method_key === 'bkash') || data[0];
          
          if (bkashGateway) {
            if (bkashGateway.usd_rate) usdToBdtRate = parseFloat(bkashGateway.usd_rate);
            if (bkashGateway.cashout_fee !== null && bkashGateway.cashout_fee !== undefined) {
              cashoutFeeRate = parseFloat(bkashGateway.cashout_fee);
            }
            if (bkashGateway.minimum_deposit_usd) minBkashUsd = parseFloat(bkashGateway.minimum_deposit_usd);
          }

          const usdGateway = data.find(g => g.method_key === 'usd');
          if (usdGateway && usdGateway.minimum_deposit_usd) {
            minUsdUsd = parseFloat(usdGateway.minimum_deposit_usd);
          }

          const bankGateway = data.find(g => g.method_key === 'bank');
          if (bankGateway && bankGateway.minimum_deposit_usd) {
            minBankUsd = parseFloat(bankGateway.minimum_deposit_usd);
          }
        }
      } catch (err) {
        console.log("Error fetching payment gateways data, using defaults:", err);
      }
      
      switchMethod(currentMethod);
      calculateBdtAndFee();
    }

    // ২. BDT রেট এবং ফি হিসাব করা
    function calculateBdtAndFee() {
      const amount = parseFloat(document.getElementById('amount').value) || 0;
      
      const totalBdt = amount * usdToBdtRate;
      document.getElementById('bdt-rate-badge').innerText = `≈ ৳ ${totalBdt.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;

      const calculatedFee = (amount * cashoutFeeRate) / 100;
      const totalDeductions = amount + calculatedFee;

      const feeInfoElem = document.getElementById('fee-info');
      if (feeInfoElem) {
        feeInfoElem.innerText = `Fee (${cashoutFeeRate}%): $${calculatedFee.toFixed(4)} | Total Deduction: $${totalDeductions.toFixed(4)}`;
      }
    }

    // ৩. মেথড স্যুইচ করা (bKash, USD, Bank)
    function switchMethod(method) {
      currentMethod = method;

      document.querySelectorAll('.method-card').forEach(card => {
        card.classList.toggle('active', card.dataset.method === method);
      });

      const fieldsContainer = document.getElementById('dynamic-fields');
      const amountInput = document.getElementById('amount');
      const limitInfo = document.getElementById('limit-info');

      if (method === 'bkash') {
        amountInput.min = minBkashUsd.toString();
        limitInfo.innerText = `* Minimum withdrawal amount: $${minBkashUsd}`;
        fieldsContainer.innerHTML = `
          <div class="form-group">
            <label>bKash Number</label>
            <input type="text" class="form-control" id="bkash_number" placeholder="01..." required maxlength="11">
          </div>
        `;
      } else if (method === 'usd') {
        amountInput.min = minUsdUsd.toString();
        limitInfo.innerText = `* Minimum withdrawal amount: $${minUsdUsd}`;
        fieldsContainer.innerHTML = `
          <div class="form-group">
            <label>Your BSC BEP20 Wallet Address</label>
            <input type="text" class="form-control" id="bsc_address" placeholder="0x..." required>
          </div>
        `;
      } else if (method === 'bank') {
        amountInput.min = minBankUsd.toString();
        limitInfo.innerText = `* Minimum withdrawal amount: $${minBankUsd} for Bank Transfer`;
        fieldsContainer.innerHTML = `
          <div class="form-group">
            <label>Bank Name</label>
            <input type="text" class="form-control" id="bank_name" placeholder="e.g. Dutch Bangla Bank" required>
          </div>
          <div class="form-group">
            <label>Account Name</label>
            <input type="text" class="form-control" id="account_name" placeholder="Account Holder Name" required>
          </div>
          <div class="form-group">
            <label>Account Number</label>
            <input type="text" class="form-control" id="account_number_bank" placeholder="Bank Account Number" required>
          </div>
          <div class="form-group">
            <label>Branch Name</label>
            <input type="text" class="form-control" id="branch_name" placeholder="Branch Name" required>
          </div>
          <div class="form-group">
            <label>Routing Number</label>
            <input type="text" class="form-control" id="router_number" placeholder="Routing Number" required>
          </div>
        `;
      }
      calculateBdtAndFee();
    }

    // ৪. কাস্টম পপআপ
    function showPopup(title, msg, type = 'success', redirect = false) {
      const popup = document.getElementById('custom-popup');
      const icon = document.getElementById('popup-icon');
      document.getElementById('popup-title').innerText = title;
      document.getElementById('popup-msg').innerText = msg;
      isRedirecting = redirect;

      if (type === 'success') {
        icon.className = "popup-icon success";
        icon.innerHTML = `<i class="fa-solid fa-check"></i>`;
      } else {
        icon.className = "popup-icon error";
        icon.innerHTML = `<i class="fa-solid fa-exclamation"></i>`;
      }
      popup.classList.add('active');
    }

    function closePopup() {
      document.getElementById('custom-popup').classList.remove('active');
      if (isRedirecting) {
        window.location.href = "wallet-getway-method.html";
      }
    }

    // ৫. ফর্ম সাবমিশন ও ভ্যালিডেশন
    document.getElementById('withdraw-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const client = window._supabase || window.supabase;
      const submitBtn = document.getElementById('btn-submit');
      const amountVal = parseFloat(document.getElementById('amount').value);
      const inputPin = document.getElementById('secret_pin').value.trim();

      // bKash মোবাইল নাম্বার ভ্যালিডেশন
      if (currentMethod === 'bkash') {
        const bkashNum = document.getElementById('bkash_number').value.trim();
        if (!bkashNum.startsWith('01')) {
          showPopup("Invalid Mobile Number", "মোবাইল নম্বরটি অবশ্যই 01 দিয়ে শুরু হতে হবে।", "error");
          return;
        }
        if (bkashNum.length !== 11 || !/^\d+$/.test(bkashNum)) {
          showPopup("Invalid Mobile Number", "মোবাইল নম্বরটি অবশ্যই ঠিক ১১ ডিজিটের হতে হবে।", "error");
          return;
        }
      }

      // Secret PIN ভ্যালিডেশন (অবশ্যই ৪ ডিজিটের সংখ্যা হতে হবে)
      if (inputPin.length !== 4 || !/^\d{4}$/.test(inputPin)) {
        showPopup("Invalid Secret PIN", "Secret PIN অবশ্যই ৪ সংখ্যার (4 digits) হতে হবে।", "error");
        return;
      }

      if (currentMethod === 'bkash' && amountVal < minBkashUsd) {
        showPopup("Minimum Limit Error", `Minimum withdrawal amount for bKash is $${minBkashUsd}.`, "error");
        return;
      }
      if (currentMethod === 'usd' && amountVal < minUsdUsd) {
        showPopup("Minimum Limit Error", `Minimum withdrawal amount for USD is $${minUsdUsd}.`, "error");
        return;
      }
      if (currentMethod === 'bank' && amountVal < minBankUsd) {
        showPopup("Minimum Limit Error", `Minimum withdrawal amount for Bank is $${minBankUsd}.`, "error");
        return;
      }

      const calculatedCharge = (amountVal * cashoutFeeRate) / 100;
      const totalRequiredBalance = amountVal + calculatedCharge;

      submitBtn.innerText = "Processing...";
      submitBtn.disabled = true;

      try {
        const { data: { user } } = await client.auth.getUser();
        let userId = user ? user.id : localStorage.getItem('user_id');

        if (!userId) {
          showPopup("Error", "Please login first!", "error");
          return;
        }

        const { data: userData, error: userErr } = await client
          .from('user')
          .select('secret_pin')
          .eq('id', userId)
          .single();

        if (userErr || !userData) {
          showPopup("Error", "User record not found!", "error");
          return;
        }

        if (String(userData.secret_pin) !== inputPin) {
          showPopup("Security Alert", "Incorrect Secret PIN! Please try again.", "error");
          return;
        }

        const { data: walletData, error: walletError } = await client
          .from('wallets')
          .select('id, balance')
          .eq('user_id', userId)
          .single();

        if (walletError || !walletData) {
          showPopup("Error", "Wallet record not found!", "error");
          return;
        }

        const currentBalance = parseFloat(walletData.balance || 0);

        if (currentBalance < totalRequiredBalance) {
          showPopup("Insufficient Balance", `You need $${totalRequiredBalance.toFixed(2)} (including ${cashoutFeeRate}% fee) to proceed. Your balance is $${currentBalance.toFixed(2)}.`, "error");
          return;
        }

        let accountDetails = '';
        let methodNameDisplay = '';

        if (currentMethod === 'bkash') {
          accountDetails = document.getElementById('bkash_number').value.trim();
          methodNameDisplay = 'bKash Personal';
        } else if (currentMethod === 'usd') {
          accountDetails = document.getElementById('bsc_address').value;
          methodNameDisplay = 'USD (BSC BEP20)';
        } else if (currentMethod === 'bank') {
          const bankName = document.getElementById('bank_name').value;
          const accName = document.getElementById('account_name').value;
          const accNum = document.getElementById('account_number_bank').value;
          const branch = document.getElementById('branch_name').value;
          const router = document.getElementById('router_number').value;
          
          accountDetails = `Bank: ${bankName} | Acc Name: ${accName} | Acc No: ${accNum} | Branch: ${branch} | Routing: ${router}`;
          methodNameDisplay = 'Bank Transfer';
        }

        const newBalance = currentBalance - totalRequiredBalance;
        const { error: updateError } = await client
          .from('wallets')
          .update({ balance: newBalance, updated_at: new Date().toISOString() })
          .eq('user_id', userId);

        if (updateError) {
          throw new Error("Balance Update Failed: " + updateError.message);
        }

        const trxId = 'WD' + Math.floor(10000000 + Math.random() * 90000000);

        const payload = {
          user_id: userId,
          type: 'withdraw',
          amount: amountVal,
          charge: calculatedCharge,
          net_amount: amountVal,
          method: methodNameDisplay,
          account_number: accountDetails,
          trx_id: trxId,
          status: 'pending'
        };

        const { error: trxError } = await client.from('transactions').insert([payload]);

        if (trxError) {
          await client.from('wallets').update({ balance: currentBalance }).eq('user_id', userId);
          throw new Error("Transaction Failed: " + trxError.message);
        }

        showPopup("Success!", "Withdrawal request submitted successfully!", "success", true);

      } catch (err) {
        console.error("Withdrawal Error:", err);
        showPopup("Error", err.message || "Something went wrong!", "error");
      } finally {
        submitBtn.innerText = "Submit Withdraw Request";
        submitBtn.disabled = false;
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      fetchGatewayData();
    });
  </script>
</body>
</html>
