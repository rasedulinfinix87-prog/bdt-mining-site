<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goldmine Digital - Notification Center</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #061913;
      --topbar-bg: rgba(6, 25, 19, 0.85);
      --card-bg: rgba(12, 38, 29, 0.85);
      --card-border: rgba(245, 207, 102, 0.2);
      --gold-primary: #f5cf66;
      --gold-gradient: linear-gradient(135deg, #ffe082 0%, #f5cf66 40%, #b89332 100%);
      --card-gradient: linear-gradient(135deg, rgba(12, 38, 29, 0.95) 0%, #030d0a 100%);
      --text-main: #ffffff;
      --text-muted: #8da499;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Page Loader */
    .page-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-dark);
      z-index: 3000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .page-loader.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loader-spinner {
      width: 45px;
      height: 45px;
      border: 3px solid rgba(245, 207, 102, 0.15);
      border-top: 3px solid var(--gold-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .mobile-container {
      width: 100%;
      max-width: 480px;
      background-color: var(--bg-dark);
      padding-bottom: 30px;
      position: relative;
      min-height: 100vh;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      background: var(--topbar-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--card-border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .top-bar .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .top-bar .back-btn {
      color: var(--gold-primary);
      font-size: 1.1rem;
      text-decoration: none;
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(245, 207, 102, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(245, 207, 102, 0.2);
      transition: all 0.3s ease;
    }

    .top-bar .back-btn:hover {
      background: rgba(245, 207, 102, 0.2);
    }

    .top-bar h2 {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: 0.5px;
    }

    /* Notification List Container */
    .notification-list {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Notification Item Card */
    .notif-card {
      background: var(--card-gradient);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      gap: 14px;
      position: relative;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .notif-card:active {
      transform: scale(0.98);
    }

    .notif-card.unread {
      border-left: 3px solid var(--gold-primary);
      background: linear-gradient(135deg, rgba(245, 207, 102, 0.08) 0%, #030d0a 100%);
    }

    .notif-icon {
      width: 40px;
      height: 40px;
      min-width: 40px;
      border-radius: 50%;
      background: rgba(245, 207, 102, 0.1);
      border: 1px solid rgba(245, 207, 102, 0.25);
      color: var(--gold-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .notif-content {
      flex: 1;
    }

    .notif-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }

    .notif-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.3;
    }

    .notif-time {
      font-size: 0.72rem;
      color: var(--text-muted);
      white-space: nowrap;
      margin-left: 8px;
    }

    .notif-message {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
      word-break: break-word;
    }

    /* Empty State Container */
    .empty-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      text-align: center;
    }

    .empty-icon {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: rgba(245, 207, 102, 0.08);
      border: 1px solid rgba(245, 207, 102, 0.2);
      color: var(--gold-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 16px;
      box-shadow: 0 0 20px rgba(245, 207, 102, 0.1);
    }

    .empty-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .empty-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div class="page-loader" id="pageLoader">
    <div class="loader-spinner"></div>
  </div>

  <div class="mobile-container">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="title-group">
        <a href="javascript:history.back()" class="back-btn">
          <i class="fa-solid fa-chevron-left"></i>
        </a>
        <h2>Notifications</h2>
      </div>
    </div>

    <!-- Notification List -->
    <div class="notification-list" id="notifContainer">
      <!-- Dynamic Notifications Will Be Loaded Here -->
    </div>

    <!-- Empty State -->
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">
        <i class="fa-regular fa-bell-slash"></i>
      </div>
      <div class="empty-title">No Notifications</div>
      <div class="empty-desc">You don't have any notifications right now.</div>
    </div>
  </div>

  <!-- 1. Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- 2. Supabase Configuration File -->
  <script src="supabase-config.js"></script>

  <!-- 3. Logic Script -->
  <script>
    let currentUserId = null;

    // টাইম ফরম্যাটিং হেলপার (যেমন: 5m ago, 2h ago, Oct 1)
    function formatTime(dateString) {
      const date = new Date(dateString);
      const now = new Date();
      const seconds = Math.floor((now - date) / 1000);

      if (seconds < 60) return 'Just now';
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}m ago`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}h ago`;
      const days = Math.floor(hours / 24);
      if (days < 7) return `${days}d ago`;

      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    // আনরিড নোটিফিকেশনগুলো `is_red = true` করা (Mark as Read)
    async function markNotificationsAsRead(client, userId) {
      await client
        .from('notifications')
        .update({ is_red: true })
        .eq('user_id', userId)
        .eq('is_red', false);
    }

    // ডাটাবেজ থেকে নোটিফিকেশন লোড করার ফাংশন
    async function loadNotifications() {
      const client = window._supabase || window.supabase;
      const loader = document.getElementById('pageLoader');
      const container = document.getElementById('notifContainer');
      const emptyState = document.getElementById('emptyState');

      if (!client) {
        console.error("Supabase client initialized পাওয়া যায়নি!");
        if (loader) loader.classList.add('hidden');
        return;
      }

      // ১. লগইন করা ইউজার চেক
      const { data: { user }, error: userError } = await client.auth.getUser();

      if (userError || !user) {
        window.location.href = 'login-signup.html';
        return;
      }

      currentUserId = user.id;

      // ২. 'notifications' টেবিল থেকে নোটিফিকেশন আনা (তাজা নোটিফিকেশন উপরে থাকবে)
      const { data: notifications, error } = await client
        .from('notifications')
        .select('*')
        .eq('user_id', currentUserId)
        .order('created_at', { ascending: false });

      if (loader) loader.classList.add('hidden');

      if (error) {
        console.error("Error fetching notifications:", error.message);
        return;
      }

      // ৩. লিস্ট রেন্ডার করা
      if (!notifications || notifications.length === 0) {
        container.style.display = 'none';
        emptyState.style.display = 'flex';
      } else {
        emptyState.style.display = 'none';
        container.style.display = 'flex';
        container.innerHTML = '';

        notifications.forEach(notif => {
          const card = document.createElement('div');
          card.className = `notif-card ${!notif.is_red ? 'unread' : ''}`;
          
          card.innerHTML = `
            <div class="notif-icon">
              <i class="fa-solid fa-bell"></i>
            </div>
            <div class="notif-content">
              <div class="notif-header">
                <div class="notif-title">${notif.title || 'Notification'}</div>
                <div class="notif-time">${formatTime(notif.created_at)}</div>
              </div>
              <div class="notif-message">${notif.message || ''}</div>
            </div>
          `;
          container.appendChild(card);
        });

        // ৪. ইউজার পেজ দেখে ফেলার কারণে ব্যাকগ্রাউন্ডে is_red = true আপডেট করে দেওয়া
        markNotificationsAsRead(client, currentUserId);
      }

      // ৫. Realtime Listener: নতুন নোটিফিকেশন আসলে লাইভ যোগ হবে
      client
        .channel('notification-center-live')
        .on(
          'postgres_changes',
          {
            event: 'INSERT',
            schema: 'public',
            table: 'notifications',
            filter: `user_id=eq.${currentUserId}`
          },
          (payload) => {
            // নতুন ডাটা আসলে পেজের তালিকাটি রিফ্রেশ করবে
            loadNotifications();
          }
        )
        .subscribe();
    }

    // পেজ লোড সম্পন্ন হলে রিলিজ করবে
    window.addEventListener('DOMContentLoaded', loadNotifications);
  </script>
</body>
</html>
