<script>

    /* =========================================
       SUPABASE CONFIG
    ========================================= */

    const HEADER_SUPABASE_URL =
        'https://pckocwvuxeseumynslwv.supabase.co';

    const HEADER_SUPABASE_KEY =
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBja29jd3Z1eGVzZXVteW5zbHd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NDc3OTAsImV4cCI6MjEwNjIyMzc5MH0.0VBGW9lgZDritQa7XDoPncu5bl9M6J5W9eup0KSLXIc';


    /* =========================================
       CREATE SUPABASE CLIENT
    ========================================= */

    const headerSupabase =
        supabase.createClient(
            HEADER_SUPABASE_URL,
            HEADER_SUPABASE_KEY
        );


    /* =========================================
       VARIABLES
    ========================================= */

    let headerCurrentUser = null;
    let headerRealtimeChannel = null;
    let headerBalancePolling = null;


    /* =========================================
       FORMAT BALANCE
    ========================================= */

    function formatHeaderBalance(balance) {

        const number =
            parseFloat(balance) || 0;

        return '$' + number.toFixed(2);

    }


    /* =========================================
       UPDATE BALANCE UI
    ========================================= */

    function updateHeaderBalance(balance, animate = false) {

        const balanceElement =
            document.getElementById('topBalance');

        const balanceBox =
            document.getElementById('topBalanceBox');


        if (!balanceElement) {
            return;
        }


        const formattedBalance =
            formatHeaderBalance(balance);


        /*
         * Only animate if value actually changed
         */

        const oldBalance =
            balanceElement.innerText;


        balanceElement.innerText =
            formattedBalance;


        if (
            animate &&
            oldBalance !== formattedBalance &&
            balanceBox
        ) {

            balanceBox.classList.remove(
                'balance-updated'
            );


            /*
             * Force browser reflow
             */

            void balanceBox.offsetWidth;


            balanceBox.classList.add(
                'balance-updated'
            );


            setTimeout(() => {

                balanceBox.classList.remove(
                    'balance-updated'
                );

            }, 800);

        }

    }


    /* =========================================
       GET LOGGED-IN USER
    ========================================= */

    async function getHeaderUser() {

        try {

            const {
                data,
                error
            } =
                await headerSupabase.auth.getUser();


            if (error) {

                console.log(
                    'Header auth error:',
                    error
                );

                return null;

            }


            return data?.user || null;

        } catch (error) {

            console.log(
                'Header user error:',
                error
            );

            return null;

        }

    }


    /* =========================================
       LOAD BALANCE FROM DATABASE
    ========================================= */

    async function loadHeaderBalance(
        animate = false
    ) {

        try {

            if (!headerCurrentUser) {

                headerCurrentUser =
                    await getHeaderUser();

            }


            if (!headerCurrentUser) {

                updateHeaderBalance(
                    0,
                    false
                );

                return;

            }


            const {
                data: profile,
                error
            } =
                await headerSupabase

                    .from('profiles')

                    .select('balance')

                    .eq(
                        'id',
                        headerCurrentUser.id
                    )

                    .single();


            if (error) {

                console.log(
                    'Balance fetch error:',
                    error
                );

                return;

            }


            const balance =
                parseFloat(
                    profile?.balance
                ) || 0;


            updateHeaderBalance(
                balance,
                animate
            );


        } catch (error) {

            console.log(
                'Header balance error:',
                error
            );

        }

    }


    /* =========================================
       START SUPABASE REALTIME
    ========================================= */

    async function startHeaderRealtime() {

        try {

            if (!headerCurrentUser) {

                headerCurrentUser =
                    await getHeaderUser();

            }


            if (!headerCurrentUser) {

                console.log(
                    'No logged-in user for realtime.'
                );

                return;

            }


            /*
             * Remove old channel if exists
             */

            if (headerRealtimeChannel) {

                try {

                    await headerSupabase
                        .removeChannel(
                            headerRealtimeChannel
                        );

                } catch (e) {

                    console.log(
                        'Old channel remove error:',
                        e
                    );

                }

            }


            /*
             * Create new realtime channel
             */

            headerRealtimeChannel =
                headerSupabase

                    .channel(
                        'profile-balance-' +
                        headerCurrentUser.id
                    )

                    .on(

                        'postgres_changes',

                        {
                            event: 'UPDATE',

                            schema: 'public',

                            table: 'profiles',

                            filter:
                                'id=eq.' +
                                headerCurrentUser.id
                        },

                        (payload) => {

                            console.log(
                                'Realtime balance update:',
                                payload.new?.balance
                            );


                            const newBalance =
                                parseFloat(
                                    payload.new?.balance
                                ) || 0;


                            updateHeaderBalance(
                                newBalance,
                                true
                            );

                        }

                    )

                    .subscribe(
                        (status) => {

                            console.log(
                                'Header Realtime status:',
                                status
                            );

                        }
                    );


        } catch (error) {

            console.log(
                'Realtime start error:',
                error
            );

        }

    }


    /* =========================================
       FALLBACK BALANCE CHECK
       
       Even if Realtime is temporarily
       unavailable, check database every
       10 seconds.
    ========================================= */

    function startHeaderBalancePolling() {

        /*
         * Prevent duplicate timers
         */

        if (headerBalancePolling) {

            clearInterval(
                headerBalancePolling
            );

        }


        headerBalancePolling =
            setInterval(
                async () => {

                    await loadHeaderBalance(
                        false
                    );

                },
                10000
            );

    }


    /* =========================================
       AUTH STATE CHANGE
    ========================================= */

    headerSupabase.auth.onAuthStateChange(
        async (event, session) => {

            console.log(
                'Header auth event:',
                event
            );


            if (session?.user) {

                headerCurrentUser =
                    session.user;


                /*
                 * Load latest balance
                 */

                await loadHeaderBalance(
                    false
                );


                /*
                 * Restart realtime
                 */

                await startHeaderRealtime();


            } else {

                headerCurrentUser =
                    null;


                updateHeaderBalance(
                    0,
                    false
                );


                /*
                 * Remove realtime
                 */

                if (
                    headerRealtimeChannel
                ) {

                    try {

                        await headerSupabase
                            .removeChannel(
                                headerRealtimeChannel
                            );

                    } catch (e) {

                        console.log(e);

                    }


                    headerRealtimeChannel =
                        null;

                }

            }

        }
    );


    /* =========================================
       SIDEBAR TOGGLE
    ========================================= */

    function toggleSidebar() {

        const sidebar =
            document.getElementById(
                'sidebarMenu'
            );

        const overlay =
            document.getElementById(
                'sidebarOverlay'
            );


        if (!sidebar || !overlay) {
            return;
        }


        sidebar.classList.toggle(
            'active'
        );

        overlay.classList.toggle(
            'active'
        );

    }


    /* =========================================
       CLOSE SIDEBAR WITH ESC
    ========================================= */

    document.addEventListener(
        'keydown',
        function(event) {

            if (event.key === 'Escape') {

                const sidebar =
                    document.getElementById(
                        'sidebarMenu'
                    );

                const overlay =
                    document.getElementById(
                        'sidebarOverlay'
                    );


                if (sidebar) {

                    sidebar.classList.remove(
                        'active'
                    );

                }


                if (overlay) {

                    overlay.classList.remove(
                        'active'
                    );

                }

            }

        }
    );


    /* =========================================
       INITIALIZE HEADER
    ========================================= */

    async function initializeHeader() {

        console.log(
            'Initializing BDTMINER header...'
        );


        /*
         * Get current user
         */

        headerCurrentUser =
            await getHeaderUser();


        /*
         * Load current balance immediately
         */

        await loadHeaderBalance(
            false
        );


        /*
         * Start realtime balance listener
         */

        await startHeaderRealtime();


        /*
         * Start fallback polling
         */

        startHeaderBalancePolling();


        console.log(
            'BDTMINER header initialized.'
        );

    }


    /* =========================================
       START
    ========================================= */

    initializeHeader();

</script>
