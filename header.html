<!-- ==================== SUPABASE REALTIME BALANCE SCRIPT ==================== -->

<script>
(function () {

    /*
     * ==========================================================
     * BDTMINER REAL-TIME BALANCE SYSTEM
     * ==========================================================
     *
     * Database:
     * profiles
     *
     * Column:
     * balance
     *
     * User identification:
     * Supabase Auth user.id === profiles.id
     *
     * এই script:
     *
     * 1. Current logged-in user বের করবে
     * 2. profiles থেকে প্রথম balance load করবে
     * 3. Supabase Realtime দিয়ে balance পরিবর্তন শুনবে
     * 4. অন্য page থেকে balance change হলেও header update করবে
     * 5. একই page-এ balance update হলেও UI refresh করবে
     * 6. Tab আবার active হলে balance refresh করবে
     *
     * ==========================================================
     */

    const SUPABASE_URL =
        'https://pckocwvuxeseumynslwv.supabase.co';

    const SUPABASE_KEY =
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6InBja29jd3Z1eGVzZXVteW5zbHd2IiwiaWF0IjoxNzkwNjQ3Nzk0LCJleHAiOjIxMDYyMjM3OTR9.0VBGW9lgZDritQa7XDoPncu5bl9M6J5W9eup0KSLXIc';

    /*
     * যদি parent page-এ Supabase ইতিমধ্যে load করা থাকে,
     * তাহলে নতুন client না বানিয়ে existing client ব্যবহার করবে।
     *
     * না থাকলে CDN থেকে supabase-js load করা প্রয়োজন।
     */

    let headerSupabase = null;
    let headerRealtimeChannel = null;
    let headerCurrentUserId = null;


    /* ==========================================================
       SUPABASE CLIENT INITIALIZE
       ========================================================== */

    function initHeaderSupabase() {

        try {

            if (typeof supabase === 'undefined') {

                console.error(
                    '[Header] Supabase library পাওয়া যায়নি। ' +
                    'Parent page-এ @supabase/supabase-js load করুন।'
                );

                return false;
            }

            headerSupabase = supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );

            return true;

        } catch (error) {

            console.error(
                '[Header] Supabase initialization error:',
                error
            );

            return false;
        }
    }


    /* ==========================================================
       FORMAT BALANCE
       ========================================================== */

    function formatHeaderBalance(balance) {

        const numericBalance = Number(balance);

        if (!Number.isFinite(numericBalance)) {
            return '$0.00';
        }

        return '$' + numericBalance.toFixed(2);
    }


    /* ==========================================================
       UPDATE BALANCE UI
       ========================================================== */

    function updateHeaderBalance(balance, animate = true) {

        const balanceElement =
            document.getElementById('topBalance');

        if (!balanceElement) {
            return;
        }

        const formattedBalance =
            formatHeaderBalance(balance);

        balanceElement.textContent =
            formattedBalance;

        /*
         * ছোট animation
         */

        if (animate) {

            balanceElement.classList.remove(
                'balance-updated'
            );

            /*
             * Reflow force করা
             */

            void balanceElement.offsetWidth;

            balanceElement.classList.add(
                'balance-updated'
            );

            setTimeout(function () {

                balanceElement.classList.remove(
                    'balance-updated'
                );

            }, 500);
        }

        /*
         * অন্য JavaScript code চাইলে এই event
         * ব্যবহার করে balance পরিবর্তন জানতে পারবে।
         */

        window.dispatchEvent(
            new CustomEvent(
                'bdtminerBalanceUpdated',
                {
                    detail: {
                        balance: Number(balance)
                    }
                }
            )
        );
    }


    /* ==========================================================
       FETCH CURRENT BALANCE
       ========================================================== */

    async function fetchHeaderBalance() {

        if (!headerSupabase) {
            return;
        }

        try {

            const {
                data: {
                    user
                },
                error: userError
            } = await headerSupabase.auth.getUser();


            if (userError) {

                console.error(
                    '[Header] User fetch error:',
                    userError
                );

                return;
            }


            if (!user) {

                updateHeaderBalance(0, false);

                return;
            }


            headerCurrentUserId =
                user.id;


            const {
                data: profile,
                error: profileError
            } = await headerSupabase
                .from('profiles')
                .select('balance')
                .eq('id', user.id)
                .single();


            if (profileError) {

                console.error(
                    '[Header] Balance fetch error:',
                    profileError
                );

                return;
            }


            if (
                profile &&
                profile.balance !== null &&
                profile.balance !== undefined
            ) {

                updateHeaderBalance(
                    profile.balance,
                    false
                );

            } else {

                updateHeaderBalance(
                    0,
                    false
                );
            }


        } catch (error) {

            console.error(
                '[Header] Unexpected balance error:',
                error
            );

        }
    }


    /* ==========================================================
       START REALTIME LISTENER
       ========================================================== */

    function startHeaderRealtime() {

        if (!headerSupabase) {
            return;
        }

        if (!headerCurrentUserId) {
            return;
        }


        /*
         * পুরনো channel থাকলে remove করি
         */

        if (headerRealtimeChannel) {

            try {

                headerSupabase.removeChannel(
                    headerRealtimeChannel
                );

            } catch (e) {

                console.warn(
                    '[Header] Old channel remove error:',
                    e
                );
            }

            headerRealtimeChannel = null;
        }


        /*
         * profiles table-এর শুধুমাত্র
         * current user's row listen করা হবে।
         */

        headerRealtimeChannel =
            headerSupabase
                .channel(
                    'profile-balance-' +
                    headerCurrentUserId
                )
                .on(
                    'postgres_changes',
                    {
                        event: 'UPDATE',
                        schema: 'public',
                        table: 'profiles',
                        filter:
                            'id=eq.' +
                            headerCurrentUserId
                    },
                    function (payload) {

                        console.log(
                            '[Header] Real-time profile update:',
                            payload
                        );


                        /*
                         * নতুন balance পাওয়া গেলে
                         * সঙ্গে সঙ্গে UI update
                         */

                        if (
                            payload.new &&
                            payload.new.balance !== undefined
                        ) {

                            updateHeaderBalance(
                                payload.new.balance,
                                true
                            );
                        }

                    }
                )
                .subscribe(
                    function (status) {

                        console.log(
                            '[Header] Realtime status:',
                            status
                        );

                        /*
                         * SUBSCRIBED হলে আবার current balance
                         * fetch করে নিই।
                         */

                        if (status === 'SUBSCRIBED') {

                            fetchHeaderBalance();
                        }

                    }
                );
    }


    /* ==========================================================
       AUTH STATE LISTENER
       ========================================================== */

    function startHeaderAuthListener() {

        if (!headerSupabase) {
            return;
        }


        headerSupabase.auth.onAuthStateChange(
            async function (event, session) {

                console.log(
                    '[Header] Auth event:',
                    event
                );


                if (session && session.user) {

                    headerCurrentUserId =
                        session.user.id;

                    await fetchHeaderBalance();

                    startHeaderRealtime();

                } else {

                    headerCurrentUserId = null;

                    updateHeaderBalance(
                        0,
                        false
                    );


                    if (headerRealtimeChannel) {

                        try {

                            await headerSupabase
                                .removeChannel(
                                    headerRealtimeChannel
                                );

                        } catch (e) {

                            console.warn(
                                '[Header] Channel cleanup error:',
                                e
                            );
                        }

                        headerRealtimeChannel =
                            null;
                    }
                }

            }
        );
    }


    /* ==========================================================
       TAB / PAGE VISIBILITY REFRESH
       ========================================================== */

    document.addEventListener(
        'visibilitychange',
        function () {

            if (
                document.visibilityState === 'visible'
            ) {

                fetchHeaderBalance();
            }

        }
    );


    /* ==========================================================
       PAGE FOCUS REFRESH
       ========================================================== */

    window.addEventListener(
        'focus',
        function () {

            fetchHeaderBalance();

        }
    );


    /* ==========================================================
       PUBLIC FUNCTION
       ==========================================================
       অন্য page/script চাইলে:

       window.refreshHeaderBalance();

       call করতে পারবে।
       ========================================================== */

    window.refreshHeaderBalance =
        function () {

            return fetchHeaderBalance();

        };


    /* ==========================================================
       INITIALIZE HEADER BALANCE SYSTEM
       ========================================================== */

    async function initializeHeaderBalanceSystem() {

        const initialized =
            initHeaderSupabase();


        if (!initialized) {
            return;
        }


        /*
         * প্রথমে current logged-in user বের করি
         */

        const {
            data: {
                user
            }
        } = await headerSupabase.auth.getUser();


        if (user) {

            headerCurrentUserId =
                user.id;


            /*
             * প্রথম balance load
             */

            await fetchHeaderBalance();


            /*
             * এরপর realtime listener
             */

            startHeaderRealtime();

        } else {

            updateHeaderBalance(
                0,
                false
            );
        }


        /*
         * Auth state changes
         */

        startHeaderAuthListener();

    }


    /*
     * DOM ready হওয়ার পর initialize
     */

    if (
        document.readyState === 'loading'
    ) {

        document.addEventListener(
            'DOMContentLoaded',
            initializeHeaderBalanceSystem
        );

    } else {

        initializeHeaderBalanceSystem();

    }


})();
</script>
