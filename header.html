<!-- =========================
     SUPABASE BALANCE SYSTEM
     ========================= -->

<script>

(function () {

    /* ==========================================
       SUPABASE CONFIG
       ========================================== */

    const SUPABASE_URL =
        'https://pckocwvuxeseumynslwv.supabase.co';

    const SUPABASE_KEY =
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzkwNjQ3Nzk0LCJleHAiOjIxMDYyMjM3OTR9.0VBGW9lgZDritQa7XDoPncu5bl9M6J5W9eup0KSLXIc';


    /* ==========================================
       CREATE CLIENT
       ========================================== */

    let headerSupabase;

    try {

        if (
            window.supabaseClient &&
            typeof window.supabaseClient.from === 'function'
        ) {

            headerSupabase = window.supabaseClient;

        } else {

            headerSupabase =
                window.supabase.createClient(
                    SUPABASE_URL,
                    SUPABASE_KEY
                );

        }

    } catch (error) {

        console.error(
            'Supabase client error:',
            error
        );

        return;

    }


    let headerCurrentUser = null;
    let balanceChannel = null;
    let lastBalance = null;


    /* ==========================================
       FORMAT BALANCE
       ========================================== */

    function formatBalance(balance) {

        const number =
            parseFloat(balance) || 0;

        return '$ ' + number.toFixed(2);

    }


    /* ==========================================
       UPDATE BALANCE UI
       ========================================== */

    function updateHeaderBalance(balance) {

        const balanceElement =
            document.getElementById('topBalance');

        const balanceBox =
            document.getElementById('topBalanceBox');

        if (!balanceElement) return;


        const newBalance =
            parseFloat(balance) || 0;


        balanceElement.innerText =
            formatBalance(newBalance);


        /* Animation only when balance actually changes */

        if (
            lastBalance !== null &&
            Number(lastBalance.toFixed(2)) !==
            Number(newBalance.toFixed(2))
        ) {

            if (balanceBox) {

                balanceBox.classList.remove(
                    'balance-updated'
                );

                void balanceBox.offsetWidth;

                balanceBox.classList.add(
                    'balance-updated'
                );

            }

        }


        lastBalance = newBalance;

    }


    /* ==========================================
       LOAD USER BALANCE
       ========================================== */

    async function loadHeaderBalance() {

        try {

            const {
                data: {
                    user
                },
                error: userError
            } =
                await headerSupabase.auth.getUser();


            if (userError) {

                console.error(
                    'User error:',
                    userError
                );

                return;

            }


            if (!user) {

                console.log(
                    'No logged-in user.'
                );

                updateHeaderBalance(0);

                return;

            }


            headerCurrentUser = user;


            const {
                data: profile,
                error
            } =
                await headerSupabase
                    .from('profiles')
                    .select('balance')
                    .eq('id', user.id)
                    .single();


            if (error) {

                console.error(
                    'Balance fetch error:',
                    error
                );

                return;

            }


            if (
                profile &&
                profile.balance !== undefined &&
                profile.balance !== null
            ) {

                updateHeaderBalance(
                    profile.balance
                );

            } else {

                updateHeaderBalance(0);

            }

        } catch (error) {

            console.error(
                'Header balance error:',
                error
            );

        }

    }


    /* ==========================================
       REALTIME BALANCE SUBSCRIPTION
       ========================================== */

    function subscribeToBalance() {

        if (!headerCurrentUser) {

            console.log(
                'Realtime: user not ready'
            );

            return;

        }


        /* Remove old channel */

        if (balanceChannel) {

            try {

                headerSupabase.removeChannel(
                    balanceChannel
                );

            } catch (e) {

                console.log(e);

            }

            balanceChannel = null;

        }


        const userId =
            headerCurrentUser.id;


        console.log(
            'Starting balance realtime for:',
            userId
        );


        balanceChannel =
            headerSupabase
                .channel(
                    'header-balance-' +
                    userId +
                    '-' +
                    Date.now()
                )

                .on(
                    'postgres_changes',
                    {
                        event: 'UPDATE',
                        schema: 'public',
                        table: 'profiles',
                        filter:
                            'id=eq.' + userId
                    },

                    function (payload) {

                        console.log(
                            'REALTIME BALANCE UPDATE:',
                            payload
                        );


                        if (
                            payload &&
                            payload.new &&
                            payload.new.balance !== undefined
                        ) {

                            updateHeaderBalance(
                                payload.new.balance
                            );

                        } else {

                            /*
                             * If realtime payload doesn't
                             * contain balance, fetch again.
                             */

                            loadHeaderBalance();

                        }

                    }
                )

                .subscribe(
                    function (status) {

                        console.log(
                            'Balance realtime status:',
                            status
                        );


                        if (
                            status === 'SUBSCRIBED'
                        ) {

                            console.log(
                                '✅ Balance realtime connected'
                            );

                        }


                        if (
                            status === 'CHANNEL_ERROR'
                        ) {

                            console.error(
                                '❌ Balance realtime channel error'
                            );

                        }


                        if (
                            status === 'TIMED_OUT'
                        ) {

                            console.error(
                                '❌ Balance realtime timed out'
                            );

                        }

                    }
                );

    }


    /* ==========================================
       AUTH STATE
       ========================================== */

    async function initializeHeaderBalance() {

        await loadHeaderBalance();


        if (headerCurrentUser) {

            subscribeToBalance();

        }

    }


    /* ==========================================
       AUTH LISTENER
       ========================================== */

    headerSupabase.auth.onAuthStateChange(
        async function (event, session) {

            console.log(
                'Auth event:',
                event
            );


            if (session && session.user) {

                headerCurrentUser =
                    session.user;

                await loadHeaderBalance();

                subscribeToBalance();

            } else {

                headerCurrentUser = null;

                updateHeaderBalance(0);

            }

        }
    );


    /* ==========================================
       PAGE FOCUS
       ========================================== */

    window.addEventListener(
        'focus',
        function () {

            loadHeaderBalance();

        }
    );


    /* ==========================================
       PAGE VISIBILITY
       ========================================== */

    document.addEventListener(
        'visibilitychange',
        function () {

            if (
                document.visibilityState ===
                'visible'
            ) {

                loadHeaderBalance();

            }

        }
    );


    /* ==========================================
       PAGESHOW
       ========================================== */

    window.addEventListener(
        'pageshow',
        function () {

            loadHeaderBalance();

        }
    );


    /* ==========================================
       FALLBACK BALANCE REFRESH
       ==========================================

       Realtime normally handles the update.

       This fallback checks every 10 seconds
       so balance still updates if the browser
       temporarily disconnects from Realtime.
    */

    setInterval(
        function () {

            if (headerCurrentUser) {

                loadHeaderBalance();

            }

        },
        10000
    );


    /* ==========================================
       SIDEBAR
       ========================================== */

    window.toggleSidebar = function () {

        const menu =
            document.getElementById(
                'sidebarMenu'
            );

        const overlay =
            document.getElementById(
                'sidebarOverlay'
            );


        if (!menu || !overlay) return;


        menu.classList.toggle(
            'active'
        );

        overlay.classList.toggle(
            'active'
        );

    };


    /* ==========================================
       CLOSE SIDEBAR WITH ESC
       ========================================== */

    document.addEventListener(
        'keydown',
        function (event) {

            if (event.key === 'Escape') {

                const menu =
                    document.getElementById(
                        'sidebarMenu'
                    );

                const overlay =
                    document.getElementById(
                        'sidebarOverlay'
                    );


                if (menu) {

                    menu.classList.remove(
                        'active'
                    );

                }


                if (overlay) {

                    overlay.classList.remove(
                        'active'
                    );

                }

            }

        }
    );


    /* ==========================================
       START
       ========================================== */

    if (
        document.readyState ===
        'loading'
    ) {

        document.addEventListener(
            'DOMContentLoaded',
            initializeHeaderBalance
        );

    } else {

        initializeHeaderBalance();

    }


})();

</script>
