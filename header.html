<!-- রিয়েল-টাইম ব্যালেন্স আপডেট করার মূল স্ক্রিপ্ট লজিক -->
<script>
    // আপনার সুপাবেস প্রজেক্টের ইউআরএল এবং এনামোরাস কি (আগের কোডের অনুরূপ)
    const SUPABASE_URL_HEADER = 'https://pckocwvuxeseumynslwv.supabase.co';
    const SUPABASE_KEY_HEADER = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBja29jd3Z1eGVzZXVteW5zbHd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NDc3OTAsImV4cCI6MjEwNjIyMzc5MH0.0VBGW9lgZDritQa7XDoPncu5bl9M6J5W9eup0KSLXIc';
    
    // সুপাবেস ক্লায়েন্ট ইনিশিয়ালাইজেশন (যদি উইন্ডোতে আগে ডিক্লেয়ার করা না থাকে)
    const headerSupabase = window.supabase ? window.supabase.createClient(SUPABASE_URL_HEADER, SUPABASE_KEY_HEADER) : null;

    async function fetchHeaderBalance() {
        if (!headerSupabase) return;
        try {
            const { data: { user } } = await headerSupabase.auth.getUser();
            if (!user) return;

            // profiles টেবিল থেকে balance কলাম ফেচ করা
            const { data: profile, error } = await headerSupabase
                .from('profiles')
                .select('balance')
                .eq('id', user.id)
                .single();

            if (profile && profile.balance !== undefined && profile.balance !== null) {
                const updatedBal = parseFloat(profile.balance).toFixed(2);
                const balanceEl = document.getElementById('topBalance');
                if (balanceEl) {
                    balanceEl.innerText = '$' + updatedBal;
                }
            }

            // রিয়েল-টাইম সাবস্ক্রিপশন (ডাটাবেজে ব্যালেন্স প্লাস বা মাইনাস হওয়া মাত্র সাথে সাথে আপডেট হবে)
            headerSupabase
                .channel('header-profiles-changes')
                .on('postgres_changes', {
                    event: 'UPDATE',
                    schema: 'public',
                    table: 'profiles',
                    filter: `id=eq.${user.id}`
                }, (payload) => {
                    if (payload.new && payload.new.balance !== undefined) {
                        const newBal = parseFloat(payload.new.balance).toFixed(2);
                        const balanceEl = document.getElementById('topBalance');
                        if (balanceEl) {
                            balanceEl.innerText = '$' + newBal;
                        }
                    }
                })
                .subscribe();

        } catch (err) {
            console.error('Header balance fetch error:', err);
        }
    }

    // পেজ লোড হওয়ার সাথে সাথে ফাংশনটি রান হবে
    document.addEventListener("DOMContentLoaded", fetchHeaderBalance);
</script>
