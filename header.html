<!-- ==================== HEADER BALANCE SCRIPT ==================== -->

<script>
(function () {

    /*
     * =========================================================
     * SUPABASE CONFIG
     * Dashboard.html-এর একই Supabase project ব্যবহার করা হচ্ছে।
     * =========================================================
     */

    const HEADER_SUPABASE_URL =
        'https://pckocwvuxeseumynslwv.supabase.co';

    const HEADER_SUPABASE_KEY =
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBja29jd3Z1eGVzZXVteW5zbHd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NDc3OTAsImV4cCI6MjEwNjIyMzc5MH0.0VBGW9lgZDritQa7XDoPncu5bl9M6J5W9eup0KSLXIc';


    /*
     * =========================================================
     * Supabase Client
     * =========================================================
     */

    let headerSupabaseClient = null;

    try {

        if (typeof supabase !== 'undefined') {

            headerSupabaseClient = supabase.createClient(
                HEADER_SUPABASE_URL,
                HEADER_SUPABASE_KEY
            );

        }

    } catch (error) {

        console.error(
            'Header Supabase initialization error:',
            error
        );

    }


    /*
     * =========================================================
     * Current Balance
     * =========================================================
     */

    let headerCurrentBalance = 0;


    /*
     * =========================================================
     * Update Balance UI
     * =========================================================
     */

    function updateHeaderBalance(balance) {

        const balanceElement =
            document.getElementById('topBalance');

        const balanceBox =
            document.getElementById('topBalanceBox');

        if (!balanceElement) return;


        let numericBalance =
            parseFloat(balance);


        if (isNaN(numericBalance)) {
            numericBalance = 0;
        }


        headerCurrentBalance = numericBalance;


        /*
         * Dashboard-এর মতোই 2 decimal
         */

        balanceElement.innerText =
            `$ ${numericBalance.toFixed(2)}`;


        if (balanceBox) {

            balanceBox.classList.remove('loading');

        }

    }


    /*
     * =========================================================
     * Load User Balance
     *
     * Dashboard-এর loadUserBalance() এর মতোই:
     *
     * profiles
     *   -> balance
     *   -> current user's id
     * =========================================================
     */

    async function loadHeaderBalance() {

        if (!headerSupabaseClient) {
            console.error(
                'Supabase client not available.'
            );
            return;
        }


        const balanceBox =
            document.getElementById('topBalanceBox');

        if (balanceBox) {
            balanceBox.classList.add('loading');
        }


        try {

            /*
             * Logged-in user বের করা
             */

            const {
                data: { user },
                error: userError
            } =
                await headerSupabaseClient.auth.getUser();


            if (userError) {

                console.error(
                    'Header user fetch error:',
                    userError
                );

                updateHeaderBalance(0);

                return;
            }


            /*
             * User না থাকলে balance 0
             */

            if (!user) {

                updateHeaderBalance(0);

                return;
            }


            /*
             * Dashboard-এর মতো profiles থেকে balance নেওয়া
             */

            const {
                data: profile,
                error: profileError
            } =
                await headerSupabaseClient
                    .from('profiles')
                    .select('balance')
                    .eq('id', user.id)
                    .single();


            if (profileError) {

                console.error(
                    'Header balance fetch error:',
                    profileError
                );

                updateHeaderBalance(0);

                return;
            }


            /*
             * Profile এবং balance থাকলে update
             */

            if (
                profile &&
                profile.balance !== undefined &&
                profile.balance !== null
            ) {

                updateHeaderBalance(
                    profile.balance
                );

            } else {

                updateHeaderBalance(0);

            }

        } catch (error) {

            console.error(
                'Header balance error:',
                error
            );

            updateHeaderBalance(0);

        }

    }


    /*
     * =========================================================
     * SUPABASE REALTIME BALANCE UPDATE
     *
     * profiles.balance পরিবর্তন হলে Header নিজে থেকেই
     * balance update করার চেষ্টা করবে।
     * =========================================================
     */

    async function subscribeToBalanceChanges() {

        if (!headerSupabaseClient) return;


        try {

            const {
                data: { user }
            } =
                await headerSupabaseClient.auth.getUser();


            if (!user) return;


            headerSupabaseClient
                .channel(
                    'header-balance-' + user.id
                )
                .on(
                    'postgres_changes',
                    {
                        event: 'UPDATE',
                        schema: 'public',
                        table: 'profiles',
                        filter: `id=eq.${user.id}`
                    },
                    function (payload) {

                        console.log(
                            'Balance changed:',
                            payload.new.balance
                        );


                        if (
                            payload.new &&
                            payload.new.balance !== undefined
                        ) {

                            updateHeaderBalance(
                                payload.new.balance
                            );

                        }

                    }
                )
                .subscribe();

        } catch (error) {

            console.error(
                'Balance realtime subscription error:',
                error
            );

        }

    }


    /*
     * =========================================================
     * AUTH STATE CHANGE
     *
     * Login / Logout হলে Header balance refresh হবে।
     * =========================================================
     */

    function setupAuthListener() {

        if (!headerSupabaseClient) return;


        headerSupabaseClient.auth.onAuthStateChange(
            function (event, session) {

                console.log(
                    'Header auth event:',
                    event
                );


                if (session && session.user) {

                    loadHeaderBalance();

                } else {

                    updateHeaderBalance(0);

                }

            }
        );

    }


    /*
     * =========================================================
     * PAGE VISIBILITY / FOCUS REFRESH
     *
     * অন্য page থেকে Deposit/Withdraw করে আবার এই page-এ
     * ফিরলে balance refresh হবে।
     * =========================================================
     */

    document.addEventListener(
        'visibilitychange',
        function () {

            if (
                document.visibilityState === 'visible'
            ) {

                loadHeaderBalance();

            }

        }
    );


    window.addEventListener(
        'focus',
        function () {

            loadHeaderBalance();

        }
    );


    /*
     * =========================================================
     * GLOBAL FUNCTION
     *
     * অন্য page থেকেও চাইলে:
     *
     * refreshHeaderBalance();
     *
     * call করা যাবে।
     * =========================================================
     */

    window.refreshHeaderBalance =
        loadHeaderBalance;


    /*
     * =========================================================
     * SIDEBAR TOGGLE
     * =========================================================
     */

    window.toggleSidebar = function () {

        const sidebar =
            document.getElementById('sidebarMenu');

        const overlay =
            document.getElementById('sidebarOverlay');


        if (!sidebar || !overlay) return;


        sidebar.classList.toggle('active');

        overlay.classList.toggle('active');

    };


    /*
     * =========================================================
     * CLOSE SIDEBAR WHEN ESC PRESSED
     * =========================================================
     */

    document.addEventListener(
        'keydown',
        function (event) {

            if (event.key === 'Escape') {

                const sidebar =
                    document.getElementById(
                        'sidebarMenu'
                    );

                const overlay =
                    document.getElementById(
                        'sidebarOverlay'
                    );


                if (sidebar) {
                    sidebar.classList.remove('active');
                }

                if (overlay) {
                    overlay.classList.remove('active');
                }

            }

        }
    );


    /*
     * =========================================================
     * INITIALIZE HEADER
     * =========================================================
     */

    async function initializeHeader() {

        /*
         * প্রথমে balance load
         */

        await loadHeaderBalance();


        /*
         * তারপর realtime listener
         */

        await subscribeToBalanceChanges();


        /*
         * Auth listener
         */

        setupAuthListener();

    }


    /*
     * DOM ready হলে শুরু হবে
     */

    if (
        document.readyState === 'loading'
    ) {

        document.addEventListener(
            'DOMContentLoaded',
            initializeHeader
        );

    } else {

        initializeHeader();

    }

})();
</script>
