<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goldmine Digital - Investment Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #061913;
      --topbar-bg: #030d0a;
      --card-bg: linear-gradient(135deg, rgba(14, 46, 34, 0.85) 0%, rgba(6, 25, 19, 0.95) 100%);
      --card-border: rgba(255, 215, 0, 0.3);
      --gold-primary: #ffd700;
      --gold-secondary: #b89332;
      --gold-gradient: linear-gradient(135deg, #ffd700 0%, #b89332 100%);
      --gold-glow: rgba(255, 215, 0, 0.2);
      --card-gradient: linear-gradient(135deg, rgba(14, 46, 34, 0.85) 0%, rgba(6, 25, 19, 0.95) 100%);
      --text-main: #ffffff;
      --text-muted: #8da499;
      --green-glow: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(255, 215, 0, 0.05) 0%, transparent 20%),
        radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.03) 0%, transparent 20%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .mobile-container {
      width: 100%;
      max-width: 480px;
      background-color: var(--bg-dark);
      padding-bottom: 90px;
      position: relative;
      min-height: 100vh;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      background: var(--card-gradient);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--card-border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .top-bar .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .top-bar .back-btn {
      color: var(--text-main);
      font-size: 1.1rem;
      text-decoration: none;
      cursor: pointer;
    }

    .top-bar h2 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: 0.5px;
    }

    .top-bar .history-btn {
      color: var(--gold-primary);
      font-size: 1.2rem;
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 215, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 215, 0, 0.25);
      transition: all 0.3s ease;
    }

    .top-bar .history-btn:hover {
      background: rgba(255, 215, 0, 0.2);
      box-shadow: 0 0 10px var(--gold-glow);
    }

    /* Overview Cards Area */
    .overview-section {
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .stat-card {
      background: var(--card-gradient);
      border: 1px solid rgba(255, 215, 0, 0.25);
      border-radius: 18px;
      padding: 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
      transition: all 0.3s ease;
    }

    .stat-card:hover {
      border-color: rgba(255, 215, 0, 0.45);
      box-shadow: 0 10px 25px var(--gold-glow);
    }

    .stat-card.full-width {
      grid-column: span 2;
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.15) 0%, rgba(14, 46, 34, 0.9) 100%);
      border: 1px solid rgba(255, 215, 0, 0.4);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--gold-primary);
    }

    .stat-value.green {
      color: var(--green-glow);
    }

    /* Active Investments Section Header */
    .section-title {
      padding: 10px 20px;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--gold-primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .plan-list {
      padding: 10px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .plan-card {
      background: var(--card-gradient);
      border: 1px solid rgba(255, 215, 0, 0.25);
      border-radius: 20px;
      padding: 20px;
      position: relative;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }

    .plan-card:hover {
      border-color: rgba(255, 215, 0, 0.45);
      box-shadow: 0 12px 30px var(--gold-glow);
    }

    .plan-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .plan-name {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-active {
      background: rgba(16, 185, 129, 0.2);
      color: var(--green-glow);
      border: 1px solid rgba(16, 185, 129, 0.4);
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .badge-completed {
      background: rgba(255, 215, 0, 0.15);
      color: var(--gold-primary);
      border: 1px solid rgba(255, 215, 0, 0.3);
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .plan-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .plan-body-item {
      background: rgba(8, 30, 22, 0.6);
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 215, 0, 0.08);
    }

    .plan-body-item .val {
      font-weight: 700;
      font-size: 1rem;
      color: var(--gold-primary);
      margin-top: 2px;
    }

    /* Progress & Timer */
    .timer-box {
      background: rgba(8, 30, 22, 0.75);
      padding: 12px;
      border-radius: 14px;
      text-align: center;
      border: 1px solid rgba(255, 215, 0, 0.2);
    }

    .timer-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 5px;
      letter-spacing: 0.5px;
    }

    .countdown-timer {
      font-family: monospace;
      font-size: 1rem;
      font-weight: 700;
      color: var(--gold-primary);
      letter-spacing: 1px;
    }

    /* Live Data 100-Point Graph Container */
    .live-graph-container {
      width: 100%;
      height: 45px;
      margin-top: 8px;
      margin-bottom: 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .live-graph-container svg {
      width: 100%;
      height: 100%;
    }

    .progress-container {
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      height: 6px;
      border-radius: 10px;
      margin-top: 8px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--gold-gradient);
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
      width: 0%;
      transition: width 0.1s linear;
    }

    .empty-msg {
      text-align: center;
      color: var(--text-muted);
      padding: 30px 20px;
      font-size: 0.9rem;
    }

    /* Skeleton Loading Styles */
    .skeleton-box {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      position: relative;
      overflow: hidden;
    }

    .skeleton-box::after {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      transform: translateX(-100%);
      background-image: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0,
        rgba(255, 215, 0, 0.1) 20%,
        rgba(255, 255, 255, 0.2) 60%,
        rgba(255, 255, 255, 0)
      );
      animation: shimmer 1.5s infinite;
      content: '';
    }

    @keyframes shimmer {
      100% {
        transform: translateX(100%);
      }
    }

    .skeleton-text {
      height: 14px;
      border-radius: 4px;
    }

    .skeleton-val {
      height: 24px;
      border-radius: 6px;
      margin-top: 6px;
    }

    .skeleton-card {
      background: var(--card-gradient);
      border: 1px solid rgba(255, 215, 0, 0.2);
      border-radius: 20px;
      padding: 20px;
    }

    .skeleton-timer {
      height: 50px;
      border-radius: 14px;
      margin-top: 10px;
    }

    /* Modal Pop-up Overlay & Container */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(3, 13, 10, 0.85);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 20px;
    }

    .modal-container {
      background: var(--card-gradient);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      width: 100%;
      max-width: 440px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 25px rgba(255, 215, 0, 0.15);
      overflow: hidden;
      animation: modalFadeIn 0.3s ease-out;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-header {
      padding: 18px 20px;
      border-bottom: 1px solid rgba(255, 215, 0, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(3, 13, 10, 0.5);
    }

    .modal-header h3 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--gold-primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .close-modal-btn {
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .close-modal-btn:hover {
      color: var(--text-main);
    }

    .modal-body {
      padding: 18px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .history-card {
      background: rgba(8, 30, 22, 0.7);
      border: 1px solid rgba(255, 215, 0, 0.2);
      border-radius: 16px;
      padding: 16px;
    }

    .history-card .h-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
    }

    .history-card .h-name {
      font-weight: 700;
      color: var(--text-main);
      font-size: 0.98rem;
    }

    .history-card .h-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .history-card .h-item {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .history-card .h-item span {
      display: block;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--gold-primary);
      margin-top: 2px;
    }

    .history-card .h-item span.green {
      color: var(--green-glow);
    }

    #bottom-nav-container {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <div class="mobile-container">
    <!-- Top Bar (History Button Added) -->
    <div class="top-bar">
      <div class="title-group">
        <a href="javascript:history.back()" class="back-btn">
          <i class="fa-solid fa-chevron-left"></i>
        </a>
        <h2>Investment Dashboard</h2>
      </div>
      <!-- Modal Trigger Button -->
      <div class="history-btn" onclick="openHistoryModal()" title="Completed Investment History">
        <i class="fa-solid fa-clock-rotate-left"></i>
      </div>
    </div>

    <!-- Stats Overview -->
    <div class="overview-section">
      <!-- Main Wallet Balance -->
      <div class="stat-card full-width">
        <div class="stat-label">
          <i class="fa-solid fa-wallet" style="color: var(--gold-primary);"></i> Main Wallet Balance
        </div>
        <div class="stat-value" id="main-wallet-balance">
          <div class="skeleton-box skeleton-val" style="width: 40%;"></div>
        </div>
      </div>

      <!-- Total Investment Amount -->
      <div class="stat-card">
        <div class="stat-label">Active Invest</div>
        <div class="stat-value" id="total-active-invest">
          <div class="skeleton-box skeleton-val" style="width: 60%;"></div>
        </div>
      </div>

      <!-- Total Profit Earned (Live Micro-Counter) -->
      <div class="stat-card">
        <div class="stat-label">Total Profit</div>
        <div class="stat-value green" id="total-profit-earned" style="font-size: 1.25rem;">
          <div class="skeleton-box skeleton-val" style="width: 60%;"></div>
        </div>
      </div>
    </div>

    <!-- Active Plans Section -->
    <div class="section-title">
      <span>Active Investment Plans</span>
      <i class="fa-solid fa-chart-line"></i>
    </div>

    <!-- Skeleton Loader List Container -->
    <div class="plan-list" id="skeleton-list">
      <div class="skeleton-card">
        <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
          <div class="skeleton-box skeleton-text" style="width: 50%;"></div>
          <div class="skeleton-box skeleton-text" style="width: 20%;"></div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;">
          <div class="skeleton-box skeleton-val" style="height:40px;"></div>
          <div class="skeleton-box skeleton-val" style="height:40px;"></div>
        </div>
        <div class="skeleton-box skeleton-timer"></div>
      </div>

      <div class="skeleton-card">
        <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
          <div class="skeleton-box skeleton-text" style="width: 55%;"></div>
          <div class="skeleton-box skeleton-text" style="width: 20%;"></div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;">
          <div class="skeleton-box skeleton-val" style="height:40px;"></div>
          <div class="skeleton-box skeleton-val" style="height:40px;"></div>
        </div>
        <div class="skeleton-box skeleton-timer"></div>
      </div>
    </div>

    <!-- Active Plans Real Data Container (Initially Hidden) -->
    <div class="plan-list" id="investment-list-container" style="display: none;"></div>

    <div id="bottom-nav-container"></div>
  </div>

  <!-- Complete History Popup Modal -->
  <div class="modal-overlay" id="historyModal">
    <div class="modal-container">
      <div class="modal-header">
        <h3><i class="fa-solid fa-receipt"></i> Complete History</h3>
        <i class="fa-solid fa-xmark close-modal-btn" onclick="closeHistoryModal()"></i>
      </div>
      <div class="modal-body" id="history-modal-body">
        <div class="empty-msg">Loading history...</div>
      </div>
    </div>
  </div>

  <!-- Supabase & Configuration -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <script>
    let activeIntervals = [];
    let liveInvestmentsData = [];
    let planGraphPoints = {};
    let globalUserId = null;

    async function loadDashboardData() {
      const client = window._supabase || window.supabase;
      if (!client) return console.error("Supabase client properly initialized পাওয়া যায়নি!");

      // ১. ইউজারের সেশন চেক
      const { data: { user }, error: authErr } = await client.auth.getUser();
      if (authErr || !user) {
        window.location.href = 'login.html';
        return;
      }

      globalUserId = user.id;

      // ২. 'wallets' টেবিল থেকে মেইন ব্যালেন্স আনা
      await fetchMainWallet(client, globalUserId);

      // ৩. 'investments' টেবিল থেকে একটিভ ইনভেস্টমেন্ট তথ্য আনা
      await fetchInvestments(client, globalUserId);

      // Skeleton Loader সরিয়ে আসল ডাটা কন্টেইনার প্রদর্শন করা
      document.getElementById('skeleton-list').style.display = 'none';
      document.getElementById('investment-list-container').style.display = 'flex';

      // ৪. Realtime Listener for Wallets Balance
      client
        .channel('dashboard-wallet-sync')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'wallets', filter: `user_id=eq.${globalUserId}` }, (payload) => {
          if (payload.new && payload.new.balance !== undefined) {
            document.getElementById('main-wallet-balance').innerText = '$' + parseFloat(payload.new.balance).toFixed(2);
          }
        })
        .subscribe();
    }

    // মেইন ওয়ালেট ব্যালেন্স
    async function fetchMainWallet(client, userId) {
      const { data } = await client
        .from('wallets')
        .select('balance, currency')
        .eq('user_id', userId)
        .single();

      if (data) {
        const symbol = data.currency === 'BDT' ? '৳' : '$';
        document.getElementById('main-wallet-balance').innerText = symbol + parseFloat(data.balance || 0).toFixed(2);
      } else {
        document.getElementById('main-wallet-balance').innerText = '$0.00';
      }
    }

    // ইনভেস্টমেন্ট তালিকা ও সামারি হিসাব
    async function fetchInvestments(client, userId) {
      const { data: investments, error } = await client
        .from('investments')
        .select('*')
        .eq('user_id', userId)
        .eq('status', 'active')
        .order('created_at', { ascending: false });

      const container = document.getElementById('investment-list-container');
      
      if (error || !investments || investments.length === 0) {
        container.innerHTML = '<div class="empty-msg">No active investment plans found.</div>';
        document.getElementById('total-active-invest').innerText = '$0.00';
        document.getElementById('total-profit-earned').innerText = '$0.00000000';
        return;
      }

      let totalInvest = 0;
      container.innerHTML = '';
      liveInvestmentsData = [];
      planGraphPoints = {};

      // আগের টাইমারগুলো ক্লিয়ার করা
      activeIntervals.forEach(clearInterval);
      activeIntervals = [];

      investments.forEach((plan, index) => {
        const investedAmount = parseFloat(plan.amount || 0);
        totalInvest += investedAmount;

        liveInvestmentsData.push({
          planId: index,
          start: new Date(plan.start_date).getTime(),
          end: new Date(plan.end_date).getTime(),
          investedAmount: investedAmount,
          totalExpectedProfit: parseFloat(plan.total_return || 0) - investedAmount
        });

        // প্রতিটি প্ল্যানের জন্য ১০০ পয়েন্টের একটি ইনিশিয়াল র‍্যান্ডম গ্রাফ ডাটা তৈরি (রেঞ্জ ৫ থেকে ৩৫)
        let initialPoints = [];
        for (let i = 0; i < 100; i++) {
          initialPoints.push(20 + Math.sin(i * 0.2) * 10 + (Math.random() * 6 - 3));
        }
        planGraphPoints[index] = initialPoints;

        const cardHtml = `
          <div class="plan-card">
            <div class="plan-header">
              <div class="plan-name">
                <i class="fa-solid fa-coins" style="color: var(--gold-primary);"></i>
                ${plan.plan_name} (${plan.duration_days} Days)
              </div>
              <span class="badge-active">Active</span>
            </div>
            
            <div class="plan-body">
              <div class="plan-body-item">
                <div class="stat-label">Invested</div>
                <div class="val">$${investedAmount.toFixed(2)}</div>
              </div>
              <div class="plan-body-item">
                <div class="stat-label">Est. Profit So Far</div>
                <div class="val" id="plan-profit-${index}" style="color: var(--green-glow); font-size: 0.9rem;">$0.00000000</div>
              </div>
            </div>

            <div class="timer-box">
              <div class="timer-label">TIME REMAINING</div>
              
              <!-- Live Data 100-Point Graph -->
              <div class="live-graph-container">
                <svg viewBox="0 0 300 45" preserveAspectRatio="none">
                  <defs>
                    <linearGradient id="grad-${index}" x1="0%" y1="0%" x2="0%" y2="100%">
                      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
                      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
                    </linearGradient>
                  </defs>
                  <path id="graph-area-${index}" fill="url(#grad-${index})" d="" />
                  <path id="graph-line-${index}" fill="none" stroke="#10b981" stroke-width="2" d="" />
                </svg>
              </div>

              <div class="countdown-timer" id="timer-${index}">00d 00h 00m 00s</div>
              <div class="progress-container">
                <div class="progress-bar" id="progress-${index}"></div>
              </div>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', cardHtml);
      });

      // সামারি আপডেট
      document.getElementById('total-active-invest').innerText = '$' + totalInvest.toFixed(2);

      // গ্লোবাল লাইভ প্রফিট, টাইমার এবং ১০০ পয়েন্টের গ্রাফ লজিক চালু করা (প্রতি ১০০ মিলিসেকেন্ড পরপর)
      const globalInterval = setInterval(() => {
        const now = new Date().getTime();
        let totalAccumulatedProfit = 0;

        liveInvestmentsData.forEach(item => {
          const totalDuration = item.end - item.start;
          const elapsedTime = Math.max(0, Math.min(totalDuration, now - item.start));
          
          // বর্তমান প্ল্যানের প্রফিট
          const currentPlanProfit = totalDuration > 0 ? (item.totalExpectedProfit * (elapsedTime / totalDuration)) : 0;
          totalAccumulatedProfit += currentPlanProfit;

          // সিঙ্গেল প্ল্যান প্রফিট আপডেট (৮ ঘরের মিক্রো-ডেসিমেল সহ লাইভ কাউন্টিং)
          const planProfitEl = document.getElementById(`plan-profit-${item.planId}`);
          if(planProfitEl) {
            planProfitEl.innerText = '$' + currentPlanProfit.toFixed(8);
          }

          // ১০০ পয়েন্টের গ্রাফ শিফট ও আপডেট লজিক
          let points = planGraphPoints[item.planId];
          if (points) {
            points.shift();
            let lastVal = points[points.length - 1];
            let newVal = lastVal + (Math.random() * 10 - 5);
            if (newVal < 5) newVal = 5;
            if (newVal > 40) newVal = 40;
            points.push(newVal);

            let svgWidth = 300;
            let svgHeight = 45;
            let stepX = svgWidth / (points.length - 1);

            let linePath = "";
            let areaPath = `M 0 ${svgHeight} `;

            points.forEach((val, pIdx) => {
              let px = pIdx * stepX;
              let py = svgHeight - (val / 45) * svgHeight;
              if (pIdx === 0) {
                linePath += `M ${px} ${py} `;
              } else {
                linePath += `L ${px} ${py} `;
              }
              areaPath += `L ${px} ${py} `;
            });

            areaPath += `L ${svgWidth} ${svgHeight} Z`;

            const lineEl = document.getElementById(`graph-line-${item.planId}`);
            const areaEl = document.getElementById(`graph-area-${item.planId}`);
            if (lineEl) lineEl.setAttribute('d', linePath);
            if (areaEl) areaEl.setAttribute('d', areaPath);
          }

          // টাইমার ও প্রোগ্রেস বার আপডেট
          const distance = item.end - now;
          const timerId = `timer-${item.planId}`;
          const progressId = `progress-${item.planId}`;

          if (distance <= 0) {
            const timerEl = document.getElementById(timerId);
            if(timerEl) {
              timerEl.innerText = "COMPLETED";
              timerEl.style.color = "var(--green-glow)";
            }
            const progEl = document.getElementById(progressId);
            if(progEl) {
              progEl.style.width = "100%";
            }
          } else {
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            const timerEl = document.getElementById(timerId);
            if(timerEl) {
              timerEl.innerText = `${days}d ${hours.toString().padStart(2, '0')}h ${minutes.toString().padStart(2, '0')}m ${seconds.toString().padStart(2, '0')}s`;
            }

            const progressPercent = Math.min(100, Math.max(0, (elapsedTime / totalDuration) * 100));
            const progEl = document.getElementById(progressId);
            if(progEl) {
              progEl.style.width = progressPercent + "%";
            }
          }
        });

        // টোটাল প্রফিট কার্ডে লাইভ আপডেট (৮ ঘরের নিখুঁত ডেসিমেল সহ)
        const totalProfitEl = document.getElementById('total-profit-earned');
        if(totalProfitEl) {
          totalProfitEl.innerText = '$' + totalAccumulatedProfit.toFixed(8);
        }

      }, 100);

      activeIntervals.push(globalInterval);
    }

    // --- Complete History Popup Modal Controls ---
    async function openHistoryModal() {
      const modal = document.getElementById('historyModal');
      modal.style.display = 'flex';
      
      const client = window._supabase || window.supabase;
      const modalBody = document.getElementById('history-modal-body');

      if (!client || !globalUserId) {
        modalBody.innerHTML = '<div class="empty-msg">User data unavailable.</div>';
        return;
      }

      modalBody.innerHTML = '<div class="empty-msg"><i class="fa-solid fa-spinner fa-spin"></i> Loading completed history...</div>';

      // ডেটাবেজ থেকে মেয়াদ উত্তীর্ণ / Completed প্ল্যান ফেচ করা
      const { data: completedInvestments, error } = await client
        .from('investments')
        .select('*')
        .eq('user_id', globalUserId)
        .eq('status', 'completed')
        .order('end_date', { ascending: false });

      if (error || !completedInvestments || completedInvestments.length === 0) {
        modalBody.innerHTML = '<div class="empty-msg">No completed investment history found.</div>';
        return;
      }

      let historyHtml = '';
      completedInvestments.forEach(plan => {
        const investedAmount = parseFloat(plan.amount || 0);
        const totalReturn = parseFloat(plan.total_return || 0);
        const profitEarned = totalReturn > investedAmount ? (totalReturn - investedAmount) : 0;
        
        const endDateObj = plan.end_date ? new Date(plan.end_date) : new Date();
        const formattedDate = endDateObj.toLocaleDateString('en-US', {
          month: 'short',
          day: 'numeric',
          year: 'numeric'
        });

        historyHtml += `
          <div class="history-card">
            <div class="h-top">
              <div class="h-name">${plan.plan_name} (${plan.duration_days} Days)</div>
              <span class="badge-completed">Completed</span>
            </div>
            <div class="h-grid">
              <div class="h-item">Invested<span>$${investedAmount.toFixed(2)}</span></div>
              <div class="h-item">Profit Earned<span class="green">+$${profitEarned.toFixed(2)}</span></div>
              <div class="h-item">Total Returned<span>$${totalReturn.toFixed(2)}</span></div>
              <div class="h-item">Ended On<span>${formattedDate}</span></div>
            </div>
          </div>
        `;
      });

      modalBody.innerHTML = historyHtml;
    }

    function closeHistoryModal() {
      document.getElementById('historyModal').style.display = 'none';
    }

    // Bottom Nav লোড করা
    fetch('bottom.html')
      .then(res => res.text())
      .then(html => { document.getElementById('bottom-nav-container').innerHTML = html; })
      .catch(err => console.log(err));

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(loadDashboardData, 300);
    });
  </script>
</body>
</html>
